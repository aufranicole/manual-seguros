"t": "Ejecutivos", "p": "Cobros y comisiones", "b": "- Su comisión se calcula al procesar la conciliación: - normalmente es su % sobre la comisión recibida ; - si su regla tiene Sobre prima pagada , el % es sobre la prima cobrada . - Adelantos e incentivos : - un adelanto se paga en el momento (con asiento a Anticipos a ejecutivos ) y se descuenta en la próxima liquidación; - un incentivo se suma en la próxima liquidación. - Liquidaciones → Nuevo → Cargar pendientes → Generar factura . Crea la factura de proveedor en borrador , para que contabilidad revise las retenciones antes de publicarla. - Liquidación por lote : en Configuración → Ejecutivos , selecciona varios y usa Acción → Liquidar comisiones .", "k": "tema"}, {"id": "cobros-metas-y-presupuesto", "t": "Metas y presupuesto", "p": "Cobros y comisiones", "b": "Reportes → Metas y presupuesto : una línea por meta con el tipo (producción, cobros o comisiones recibidas), el período y, si quieres, el ejecutivo, la aseguradora o el ramo. El real , lo que falta y el cumplimiento se calculan solos (verde al 100%, ámbar por debajo de 70%). Para el presupuesto del año usa el año completo como período. - Producción: prima de las pólizas emitidas con inicio de vigencia en el período. - Cobros: lo aplicado de recibos en el período. - Comisiones: lo recibido en conciliaciones procesadas en el período.", "k": "tema"}, {"id": "cobros-carta-de-despacho", "t": "Carta de despacho", "p": "Cobros y comisiones", "b": "Al entregar las pólizas emitidas o renovadas, en la póliza vigente (o seleccionando varias del mismo cliente en la lista, Acción → Carta de despacho ) se arma la carta que las acompaña: 1. Se propone Emisión o Renovación , la referencia (\"Emisión Multirriesgo - Seguros Crecer\") y el interés asegurado con los ítems y sus valores. Elija a quién va dirigida ( Atención ) y quién firma. 2. La carta trae una fila por póliza con su factura (número, ramo, concepto, fecha, valor y vigencia) y el total, la documentación incluida, las recomendaciones y el plazo de pago de la Ley 146-02. 3. Descargar PDF o Descargar Word para retocarla antes de enviarla.", "k": "tema"}, {"id": "cobros-estado-de-cuenta-del-cliente--grupo-deudor", "t": "Grupo deudor", "p": "Cobros y comisiones › Estado de cuenta del cliente", "b": "Cuando una compañía madre responde por las primas de varios clientes (sus filiales, sus empleados), en cada uno de esos clientes se pone el Grupo deudor (pestaña Seguros ). En el grupo: - el botón Balance del grupo abre los documentos pendientes de todos sus clientes, agrupados por cliente; - Imprimir → Estado de cuenta de seguros sale como Estado de cuenta del grupo , con una columna de cliente y el balance total del grupo; - en un recibo de cobro a nombre del grupo, Distribuir y la lista de documentos traen los de todos sus clientes con esa aseguradora y moneda. En documentos de prima, cuotas pendientes, seguimiento a cobros y antigüedad de saldos se puede buscar y agrupar por Grupo deudor . Un cliente sin grupo responde por sí mismo.", "k": "tema"}, {"id": "cobros-estado-de-cuenta-del-cliente", "t": "Estado de cuenta del cliente", "p": "Cobros y comisiones", "b": "En el contacto, el botón Balance de primas muestra sus documentos pendientes. Para el PDF, usa Imprimir → Estado de cuenta de seguros .", "k": "tema"}, {"id": "cobros-preguntas-frecuentes--por-que-la-factura-de-prima-no-aparece-en-contabilidad", "t": "¿Por qué la factura de prima no aparece en Contabilidad?", "p": "Cobros y comisiones › Preguntas frecuentes", "b": "Porque no es de la corredora: es de la aseguradora al cliente. En contabilidad solo aparecen el cobro (si lo recibió la corredora), la remesa, la factura de comisión y la liquidación de ejecutivos.", "k": "pregunta"}, {"id": "cobros-preguntas-frecuentes--que-pasa-con-la-comision-si-la-aseguradora-emite-una-nota-de", "t": "¿Qué pasa con la comisión si la aseguradora emite una nota de crédito?", "p": "Cobros y comisiones › Preguntas frecuentes", "b": "La nota baja el balance del cliente, pero en esta versión no genera un reverso de comisión automático. Si la aseguradora descuenta comisión, regístralo como monto adicional de tipo descuento en la conciliación.", "k": "pregunta"}, {"id": "cobros", "t": "Cobros y comisiones", "p": "Manual", "b": "Documentos de prima, recibos, remesas, acuerdos de pago, comisiones y carta de despacho. Este módulo se instala sobre Corredora de Seguros y agrega todo lo que tiene que ver con dinero: lo que el cliente le debe a la aseguradora, lo que la corredora cobra y remesa, y lo que la aseguradora le paga a la corredora como comisión.", "k": "manual"}, {"id": "avisos-encender-los-avisos", "t": "Encender los avisos", "p": "Avisos a clientes", "b": "Los avisos vienen apagados al instalar. En Seguros → Configuración → Ajustes → Avisos a clientes , marca Enviar avisos automáticos cuando las reglas estén revisadas. El primer día se avisa todo lo que esté pendiente (por ejemplo, todas las facturas con más de 15 días de atraso), así que revisa antes las reglas y los mensajes.", "k": "tema"}, {"id": "avisos-configurar-el-whatsapp-una-vez", "t": "Configurar el WhatsApp (una vez)", "p": "Avisos a clientes", "b": "Seguros → Configuración → Ajustes → Avisos a clientes por WhatsApp : Opción Cuándo usarla Qué pide Sin WhatsApp Solo correo. — Fradoo Usas Fradoo como WhatsApp de la corredora. Los mensajes salen del número de la corredora en Fradoo y las respuestas llegan a su bandeja. Dirección de Fradoo y clave de API (en Fradoo: Ajustes → API). API oficial de Meta Tienes un número de WhatsApp Business conectado a Meta. Phone number ID y token de acceso. Importante sobre WhatsApp: Meta solo deja escribir texto libre a quien escribió a la corredora en las últimas 24 horas. Para avisos a cualquier cliente (renovaciones, cobros), usa plantillas aprobadas por Meta y escribe su nombre en la regla (campo Plantilla de Meta ). Las variables de la plantilla se llenan en orden: 1 cliente, 2 póliza (o documento), 3 fecha de vencimiento (o monto, en avisos de cobro). El código de país (RD: 1) se agrega a los teléfonos de 10 dígitos. Se usa el móvil del cliente y, si no tiene, el teléfono.", "k": "tema"}, {"id": "avisos-reglas-de-aviso", "t": "Reglas de aviso", "p": "Avisos a clientes", "b": "Seguros → Configuración → Seguros → Avisos a clientes . Vienen siete listas para usar: Regla Cuándo se envía Renovación en 30 días Una vez, cuando a la póliza le faltan 30 días o menos para vencer. Renovación en 7 días Una vez, a 7 días o menos. Cuota por vencer en 3 días Por cada cuota (o factura de contado) que vence en 3 días o menos. Prima vencida 15 días Una vez por factura, cuando tiene 15 días o más de atraso. Formulario KYC por vencer Solo correo, 30 días antes del vencimiento del formulario. Avance de reclamación Cada vez que la reclamación cambia de estado. Felicitación de cumpleaños El día del cumpleaños del cliente, una vez al año. En cada regla puedes cambiar los días, los canales, el asunto y el mensaje. Variables: {cliente} {poliza} {aseguradora} {ramo} {vence} {dias} {monto} {moneda} {documento} {estado} {corredora} . Desactiva la regla con el interruptor si no la quieres. Con los avisos encendidos, salen solos una vez al día. Enviar ahora lo pendiente en la regla los manda de inmediato. Nunca se envía dos veces el mismo aviso de la misma regla para el mismo documento. Las pólizas con Avisar al cliente al vencer desmarcado no reciben avisos de renovación.", "k": "tema"}, {"id": "avisos-desde-la-poliza", "t": "Desde la póliza", "p": "Avisos a clientes", "b": "El botón Avisar renovación de una póliza vigente envía el aviso en ese momento.", "k": "tema"}, {"id": "avisos-seguimiento", "t": "Seguimiento", "p": "Avisos a clientes", "b": "Seguros → Reportes → Avisos enviados : fecha, cliente, documento, canal y estado ( Enviado , Falló con el motivo —por ejemplo, el cliente no tiene correo o número válido—, u Omitido ). El correo queda además en el historial de la póliza o factura. Para que un cliente no reciba avisos, marca No enviar avisos en su ficha.", "k": "tema"}, {"id": "avisos", "t": "Avisos a clientes", "p": "Manual", "b": "Avisos automáticos por WhatsApp y correo: vencimientos, cuotas, cumpleaños. Odoo avisa a tus clientes, sin que nadie lo recuerde, de lo que les toca: renovar, pagar una cuota, ponerse al día, actualizar su formulario KYC y cómo va su reclamación.", "k": "manual"}, {"id": "bandeja-cargar-un-archivo--columnas-que-se-reconocen-solas", "t": "Columnas que se reconocen solas", "p": "Bandeja de aseguradoras › Cargar un archivo", "b": "Dato Nombres de columna que se reconocen Póliza Póliza, No. Póliza, Número de póliza, Certificado Póliza anterior (renovaciones) Póliza anterior, Renueva a Cliente Cliente, Asegurado, Nombre, Contratante, Tomador RNC / cédula RNC, Cédula, RNC/Cédula, Identificación Ramo Ramo, Producto, Plan, Subramo Moneda Moneda (RD, DOP, Pesos, US, USD, Dólares) Vigencia Inicio vigencia / Desde, Fin vigencia / Hasta / Vencimiento Emisión Fecha emisión, Emisión Montos Suma asegurada, Prima neta, Impuesto / ITBIS, Prima bruta / Prima total / Total Documento Factura, No. Factura, Aviso de cobro, Nota de crédito Cobros Recibo, Fecha pago, Monto pagado / Monto / Importe Si una aseguradora usa otros nombres, o su archivo trae un título arriba de los encabezados, crea un perfil en Seguros → Configuración → Seguros → Perfiles de archivo de aseguradoras : indica solo las columnas que no se reconocen, el formato de fecha y la fila de encabezados. Luego elige ese perfil en el lote.", "k": "tema"}, {"id": "bandeja-cargar-un-archivo", "t": "Cargar un archivo", "p": "Bandeja de aseguradoras", "b": "1. Lotes → Nuevo . 2. Elige la aseguradora y la cola : Emisiones, Renovaciones, Cobros o Notas de crédito. 3. Adjunta el archivo (Excel .xlsx o CSV) tal como lo envió la aseguradora. 4. Pulsa Cargar archivo . En la pestaña Columnas reconocidas ves qué columna del archivo se tomó para cada dato.", "k": "tema"}, {"id": "bandeja-revisar", "t": "Revisar", "p": "Bandeja de aseguradoras", "b": "Cada registro queda en un estado: - Listo (azul): se puede aplicar; el detalle dice qué va a pasar. - Con problema (rojo): el detalle dice por qué. Corrige en la fila (por ejemplo, elige el ramo, el cliente o la póliza) y pulsa Validar de nuevo . - Ignorado : ya existía (misma póliza y vigencia, mismo recibo, misma nota) o lo descartaste. - Aplicado (verde): ya se creó en Odoo; la fila enlaza lo creado.", "k": "tema"}, {"id": "bandeja-aplicar", "t": "Aplicar", "p": "Bandeja de aseguradoras", "b": "Aplicar listos procesa todos los registros listos. Cada uno se aplica por separado: si uno falla, queda en rojo con el motivo y los demás siguen. Cola Qué hace Emisiones Busca el cliente por RNC/cédula o nombre (si no existe lo crea), crea la póliza vigente con la prima e impuesto del archivo y su factura de prima. Renovaciones Renueva la póliza anterior (copia ítems, coberturas, ejecutivos y coaseguro), con las fechas y prima del archivo, la activa y crea la factura de renovación. Cobros Registra un recibo de pago directo en aseguradora contra la factura indicada (o la más antigua pendiente de la póliza), genera la comisión por conciliar y, si sobra dinero, lo deja como saldo a favor. Notas de crédito Crea la nota de crédito en la póliza y la aplica a lo pendiente del cliente con esa aseguradora. Cuando termines con el lote, pulsa Terminar . Lo que siga pendiente aparece en Por procesar y en Pendientes del Inicio.", "k": "tema"}, {"id": "bandeja-preguntas-frecuentes--puedo-cargar-el-mismo-archivo-dos-veces", "t": "¿Puedo cargar el mismo archivo dos veces?", "p": "Bandeja de aseguradoras › Preguntas frecuentes", "b": "Sí: lo ya aplicado se marca Ignorado . - El ramo del archivo no coincide con los nuestros. Elige el ramo en la fila, o registra la equivalencia en Configuración → Categorías (nombre en la aseguradora) para que se reconozca la próxima vez. - La aseguradora no indica el número de factura en los cobros. El pago se aplica a la factura pendiente más antigua de la póliza.", "k": "pregunta"}, {"id": "bandeja", "t": "Bandeja de aseguradoras", "p": "Manual", "b": "Cargar los archivos que mandan las aseguradoras y aplicarlos a la cartera. Las aseguradoras envían reportes de lo que emitieron , renovaron , cobraron directamente o acreditaron a tus clientes. La bandeja los carga, los compara con lo que hay en Odoo y los aplica sin digitar póliza por póliza. Dónde: Seguros → Operación → Bandeja de aseguradoras.", "k": "manual"}, {"id": "linea-configuracion-administrador--que-se-puede-cotizar", "t": "Qué se puede cotizar", "p": "Cotizador y espacio del cliente › Configuración (administrador)", "b": "Cada ramo tiene la pestaña Cotizador en línea (Seguros → Configuración → Ramos): - Se cotiza en línea : lo muestra como opción. - Nombre en el cotizador y Descripción : cómo lo ve el visitante (ej. \"Mi vehículo\"). - Para : personas y familias, o empresas. Se agrupan así en la primera pantalla. - Orden . Además siempre aparece Aún no estoy seguro(a) : la oportunidad llega sin ramo, como asesoría, con lo que el visitante contó. Lo que se pregunta en el segundo paso depende del tipo de ítem del ramo: vehículo (marca, modelo, año, uso y valor), persona (para quién, cuántas personas, edad y cobertura), inmueble (tipo, dirección y valores) o genérico (descripción y monto).", "k": "tema"}, {"id": "linea-configuracion-administrador--enlace-desde-la-pagina-web", "t": "Enlace desde la página web", "p": "Cotizador y espacio del cliente › Configuración (administrador)", "b": "Ponga un botón \"Cotizar en línea\" en la página de la corredora que lleve a https://<su Odoo /cotizar . Para abrir directo un ramo: /cotizar?ramo=<id del ramo .", "k": "tema"}, {"id": "linea-configuracion-administrador", "t": "Configuración (administrador)", "p": "Cotizador y espacio del cliente", "b": "En Seguros → Configuración → Ajustes → En línea : - Colores : principal y de acento. El logo es el de la compañía (Ajustes generales). - Logo para fondo oscuro : la versión clara del logo, para los paneles de color del cotizador y de la entrada. Vacío: se usa el logo normal sobre una placa clara. - Frase de la marca : el titular de la página de entrada del espacio del cliente. - Aviso de privacidad : enlace que el visitante acepta al enviar el cotizador. - Equipo de ventas : el que recibe las solicitudes del cotizador. Vacío: el equipo Seguros. - WhatsApp de atención : número con código de país, solo dígitos (ej. 18095550000). Activa los botones \"Escríbanos\" del cotizador y del espacio del cliente.", "k": "tema"}, {"id": "linea-el-cotizador", "t": "El cotizador", "p": "Cotizador y espacio del cliente", "b": "El visitante responde 4 pasos: qué asegurar, los datos del bien o de las personas, si ya tiene seguro (con qué aseguradora y cuándo vence) y cómo contactarlo. A la izquierda la solicitud se va escribiendo como una carta con sus respuestas. Al enviar: 1. Se crea una oportunidad en el equipo de ventas, en su primera etapa, con origen Cotizador en línea , el ramo, la aseguradora y el vencimiento de su póliza actual. 2. La descripción resume todo lo que llenó. 3. Se crea una llamada pendiente para el líder del equipo. 4. Si dejó correo, recibe la confirmación con su número de referencia. En el CRM, el filtro Del cotizador en línea las muestra. El botón Cotizar de la oportunidad crea el contacto (si no existe) y abre la cotización con el bien ya cargado. Los envíos automáticos de robots se descartan sin avisar.", "k": "tema"}, {"id": "linea-el-espacio-del-cliente--dar-acceso", "t": "Dar acceso", "p": "Cotizador y espacio del cliente › El espacio del cliente", "b": "1. Abra el cliente (debe tener correo). 2. Acción → Conceder acceso al portal → Conceder acceso . Le llega un correo para crear su contraseña. 3. El cliente entra por https://<su Odoo /cliente . Si entra por el inicio de sesión normal de Odoo, por el enlace de la invitación o por el portal estándar ( /my ), igual llega a su espacio. El personal de la corredora sigue entrando a Odoo como siempre. El correo de invitación y el de \"olvidé mi contraseña\" llevan a pantallas con la marca de la corredora: el cliente crea su contraseña y entra directo a su espacio. Si el cliente es una empresa, dé acceso a la persona de contacto: verá todo lo de la empresa.", "k": "tema"}, {"id": "linea-el-espacio-del-cliente--que-ve-el-cliente", "t": "Qué ve el cliente", "p": "Cotizador y espacio del cliente › El espacio del cliente", "b": "- Inicio : un resumen en una frase (pólizas vigentes, reclamaciones, próximo pago o pago vencido), accesos rápidos y su protección hoy : cada póliza con una línea de su vigencia que marca el día de hoy y las cuotas (pagadas, por vencer y vencidas). - Mis pólizas : vigentes y anteriores. Cada póliza abre con una franja con lo esencial: días de vigencia que quedan, a quién cubre (titulares y dependientes, o los bienes), la suma asegurada (por persona cuando es igual para todos), si está al día o cuánto debe, y la línea de vigencia con las cuotas. Debajo: qué cubre (las coberturas una sola vez; si alguna no aplica a todos, dice a cuántos), quién está cubierto (en colectivos, una fila por titular con su familia debajo, buscador y beneficiarios en vida; RR.HH. puede abrir la ficha de cada empleado) y los documentos de prima. A la derecha: reportar un siniestro y pedirle al asesor un certificado, un cambio, una inclusión, una exclusión o una cancelación con un toque. Arriba, el resumen en PDF . - Pagos : lo pendiente y lo vencido por moneda, las cuotas por vencer, los documentos con balance, los pagos registrados y el estado de cuenta en PDF. - Reclamaciones : el avance de cada una (Recibida, En la aseguradora, En ajuste, Aprobada, Pagada), los documentos que pide la aseguradora con un botón para subir cada uno, las fotos y los montos. - Mi cuenta : sus datos registrados, un botón para pedir cambios por WhatsApp y el cambio de contraseña. - Reportar un siniestro : elige la póliza, el bien, la fecha, la causa (solo las de su tipo de seguro), dónde, qué pasó, si hubo terceros y fotos.", "k": "tema"}, {"id": "linea-el-espacio-del-cliente--que-le-llega-a-la-corredora", "t": "Qué le llega a la corredora", "p": "Cotizador y espacio del cliente › El espacio del cliente", "b": "Lo que hace el cliente Dónde aparece Pide un certificado o un cambio Historial de la póliza y una actividad para su responsable Reporta un siniestro Reclamación nueva ( Registrada , marcada \"reportada en línea\") con los documentos del ramo, sus fotos y una actividad para el responsable Sube un documento El documento queda Recibido con el archivo y una nota en el historial Cada cliente ve solo lo suyo y lo de su empresa. Las pólizas en borrador no se muestran.", "k": "tema"}, {"id": "linea-espacio-de-la-empresa-recursos-humanos--dar-acceso", "t": "Dar acceso", "p": "Cotizador y espacio del cliente › Espacio de la empresa (Recursos Humanos)", "b": "1. Abra el contacto de RR.HH. dentro de la empresa cliente (debe tener correo). 2. Pestaña Seguros → Espacio del cliente : marque Ve los asegurados de su empresa . 3. Concédale acceso al portal como a cualquier cliente. Solo quien tenga la marca ve la nómina. Los demás contactos de la empresa ven las pólizas y pagos, pero no los datos de los empleados.", "k": "tema"}, {"id": "linea-espacio-de-la-empresa-recursos-humanos--que-ve", "t": "Qué ve", "p": "Cotizador y espacio del cliente › Espacio de la empresa (Recursos Humanos)", "b": "- Mi empresa : cuántos empleados y dependientes hay asegurados, la prima, lo pendiente y lo vencido, las pólizas colectivas, la gente por departamento, los incluidos en los últimos 60 días y las reclamaciones en curso. - Asegurados : una fila por empleado (aunque esté en salud y en vida), con cédula, código, departamento, pólizas, dependientes y prima. Se busca por nombre, cédula, código, departamento o nombre de un dependiente, y se filtra por póliza. Descargar listado baja todo en CSV (abre en Excel). - Ficha del empleado : su grupo familiar, beneficiarios de vida, cobertura, pólizas y reclamaciones. - Inclusiones y exclusiones : pide altas, bajas, inclusión de dependientes o cambios de datos. Llega como actividad al responsable de la póliza, con todos los datos.", "k": "tema"}, {"id": "linea-espacio-de-la-empresa-recursos-humanos--cargar-la-nomina", "t": "Cargar la nómina", "p": "Cotizador y espacio del cliente › Espacio de la empresa (Recursos Humanos)", "b": "En la póliza colectiva: Importar asegurados con el Excel o CSV de la aseguradora o del cliente. Además de nombre, cédula, nacimiento y parentesco, lee Departamento , Código empleado , Fecha inclusión y Cédula titular . Cada dependiente queda enlazado a su titular: al de la cédula indicada o, si no viene, al titular que aparece antes en el listado. Los beneficiarios se cargan en cada asegurado (pestaña Beneficiarios); deben sumar 100% o menos.", "k": "tema"}, {"id": "linea-espacio-de-la-empresa-recursos-humanos", "t": "Espacio de la empresa (Recursos Humanos)", "p": "Cotizador y espacio del cliente", "b": "Para las cuentas corporativas: la persona de Recursos Humanos ve a todos los empleados asegurados.", "k": "tema"}, {"id": "linea", "t": "Cotizador y espacio del cliente", "p": "Manual", "b": "Cotizador en la página web, espacio del cliente y espacio de la empresa (RR. HH.). Este módulo pone dos cosas en internet con la marca de la corredora: - El cotizador ( /cotizar ): cualquier persona pide una cotización desde la página web y la solicitud llega al CRM como oportunidad. - El espacio del cliente ( /cliente ): cada cliente entra con su correo y ve sus pólizas, pagos y reclamaciones, y reporta un siniestro.", "k": "manual"}, {"id": "portal-dar-acceso-a-un-cliente", "t": "Dar acceso a un cliente", "p": "Portal del cliente", "b": "1. Abre el cliente (debe tener correo). 2. Acción → Conceder acceso al portal y pulsa Conceder acceso . Le llega un correo para crear su contraseña. 3. Para quitarlo, en el mismo asistente pulsa Revocar acceso . Si el cliente es una empresa, dale acceso a la persona de contacto: verá las pólizas de la empresa.", "k": "tema"}, {"id": "portal", "t": "Portal del cliente", "p": "Manual", "b": "Dar acceso a un cliente al portal. El cliente entra al portal de la corredora con su correo y ve, sin llamar a nadie: - Mis pólizas : vigentes (o todas), con aseguradora, ramo, vigencia y prima. Al abrir una ve los bienes o personas asegurados, sus facturas de prima y descarga el resumen de la póliza en PDF . - Mis pagos pendientes : lo que tiene por pagar, cuándo vence (en rojo lo vencido) y el total. - Estado de cuenta (PDF) : el mismo que la corredora le envía. Cada cliente ve solo lo suyo: sus pólizas y las de su empresa. Las pólizas en borrador (solicitudes de emisión) no se muestran.", "k": "manual"}, {"id": "guia-prospecto-y-cliente-nuevo", "t": "Prospecto y cliente nuevo", "p": "Guía rápida", "b": "Dónde: Seguros → Ventas → Prospectos . 1. Escriba el prospecto directamente en la lista: nombre, teléfono, ramo y tipo de cliente. No hace falta abrir ningún formulario. 2. Cuando el prospecto acepta, ábralo y pulse Convertir en cliente : se crea el cliente con esos datos. 3. Las oportunidades en curso se siguen en Seguros → Ventas → Oportunidades .", "k": "guia"}, {"id": "guia-formulario-conoce-tu-cliente", "t": "Formulario Conoce tu Cliente", "p": "Guía rápida", "b": "Dónde: ficha del cliente (Seguros → Operación → Clientes ), pestaña Conoce tu Cliente . En la sección Formulario Conoce tu Cliente se registran las fechas de envío, recibido y vencimiento, y se sube el formulario firmado. El estado (al día, por vencer, vencido) se ve en la ficha y en Cumplimiento → Debida diligencia .", "k": "guia"}, {"id": "guia-cotizacion-y-comparativo", "t": "Cotización y comparativo", "p": "Guía rápida", "b": "Dónde: Seguros → Ventas → Cotizaciones . 1. En la pestaña Documentos de las aseguradoras , arrastre al recuadro lo que mandó cada aseguradora (PDF, Excel, Word o foto), o pulse Seleccionar archivos y elija varios a la vez. La cotización se guarda sola y cada archivo queda como Por leer . 2. Pulse Leer cotizaciones . Cada documento llena su opción con prima neta, impuestos, total, coberturas y prima por bien. 3. Cada opción leída queda Por revisar . Use Revisar en la fila para confirmar los números y pulse Revisado ; o Todas revisadas en el aviso amarillo. 4. Si el cliente ya tiene póliza, marque esa opción como Póliza actual : el comparativo mostrará cuánto ahorra o cuánto sube. 5. Imprimir o Enviar genera el comparativo horizontal: resumen económico, diferencia de prima, comparación de coberturas y prima neta por bien. No se puede imprimir ni enviar mientras haya opciones sin revisar o sin aseguradora. Si una cotización viene de una aseguradora que no está registrada, regístrela en Seguros → Operación → Aseguradoras y elíjala en la opción.", "k": "guia"}, {"id": "guia-emision-o-nombramiento", "t": "Emisión o nombramiento", "p": "Guía rápida", "b": "Dónde: botones arriba de la cotización aceptada. - Solicitar emisión: crea la póliza en borrador para pedirla a la aseguradora. Aparece en Seguros → Operación → Emisiones pendientes , con los días que lleva esperando. - En la póliza, cuando la aseguradora confirma, pulse Riesgo aceptado . - Cuando llega la póliza, pulse Recibir emisión y suba el PDF de la póliza y el de la factura. - Nombramiento: para un cliente que ya tiene su póliza y nombra a la corredora. La póliza queda vigente directamente.", "k": "guia"}, {"id": "guia-carta-de-despacho", "t": "Carta de despacho", "p": "Guía rápida", "b": "Dónde: botón Carta de despacho en la póliza vigente. Sale en PDF o en Word, con el texto de emisión o de renovación. Desde la lista de pólizas se pueden seleccionar varias del mismo cliente para una sola carta.", "k": "guia"}, {"id": "guia-cobro-de-la-prima", "t": "Cobro de la prima", "p": "Guía rápida", "b": "Dónde: Seguros → Cobros → Recibos de cobro . - Fecha del pago: el día que pagó el cliente. Fecha de registro: el día que se registró en el sistema. - El recibo indica si es abono o pago total y guarda el comprobante. - La pestaña Pendientes del cliente muestra lo que aún debe.", "k": "guia"}, {"id": "guia-grupo-deudor-empresa-que-paga-por-varios-clientes", "t": "Grupo deudor (empresa que paga por varios clientes)", "p": "Guía rápida", "b": "Dónde: ficha del cliente, pestaña Seguros , campo Grupo deudor . Ponga ahí la empresa que paga por ese cliente. La ficha de la empresa muestra sus Clientes del grupo , su estado de cuenta sale como Estado de cuenta del grupo , y un solo recibo de la empresa puede cobrar documentos de todos los miembros.", "k": "guia"}, {"id": "guia-comisiones", "t": "Comisiones", "p": "Guía rápida", "b": "Dónde: Seguros → Comisiones → Recibos de ingreso, Comisiones esperadas, Comisiones de ejecutivos y Liquidaciones.", "k": "guia"}, {"id": "guia-renovacion", "t": "Renovación", "p": "Guía rápida", "b": "Dónde: Seguros → Operación → Por renovar (una a una) o Renovación en lote .", "k": "guia"}, {"id": "guia-reclamaciones", "t": "Reclamaciones", "p": "Guía rápida", "b": "Dónde: Seguros → Reclamaciones . El tipo de reclamación (consulta, emergencia, vacunas, laboratorio, medicamentos, maternidad, odontología, asistencia vial, equipos eléctricos…) se elige al registrarla; la lista se mantiene en Configuración → Reclamaciones → Tipos de reclamación .", "k": "guia"}, {"id": "guia-ajustes-del-administrador", "t": "Ajustes del administrador", "p": "Guía rápida", "b": "Dónde: Seguros → Configuración → Ajustes . - Pólizas: activa las coberturas por cada bien asegurado. - Cotizaciones: la clave del servicio de lectura de cotizaciones. Cada corredora puede poner la suya.", "k": "guia"}]};
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view'), band = $('#band'), q = $('#q');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- texto normalizado, misma longitud que el original ----------
const fold = s => Array.from(s, c => (c.normalize('NFD')[0] || c).toLowerCase()).join('');
const STOP = new Set('de la el los las un una unos unas que como donde se y o a al del en por para con mi mis su sus lo le les es son hago hacer puedo puede quiero necesito cual cuales que hay esta este esto eso cuando'.split(' '));
const stem = w => { let s = w.replace(/(aciones|acion|ciones|cion|siones|sion|amientos|amiento|mente|ar|er|ir|as|os|es|a|o|e|s)$/, ''); if (s.length < 3) s = w.slice(0, 3); return s.slice(0, 6); };
const SYN = {
  cobr: ['recibo', 'pago'], pag: ['recibo', 'cobro'], carro: ['vehiculo'], auto: ['vehiculo'], vehicul: ['auto'],
  borr: ['archiv', 'anul', 'cancel'], elimin: ['archiv', 'anul', 'cancel'], siniestr: ['reclam'], reclam: ['siniestr'],
  whatsap: ['aviso'], correo: ['aviso'], kyc: ['conoce', 'diligen'], madre: ['grupo', 'deudor'], deudor: ['grupo'],
  endos: ['movimi'], factur: ['documen', 'prima'], cuot: ['prima'], renuev: ['renov'], comparativ: ['cotiz'],
  presupuest: ['cotiz'], prospect: ['oportu'], cliente: [], empres: ['grupo', 'colect'], rrhh: ['empresa', 'nomina'],
  dependient: ['familiar', 'asegur'], carnet: ['tarjet'], comisi: ['ingreso']
};
const words = s => fold(s).match(/[a-z0-9ñ]+/g) || [];

const ENTRIES = DATA.index.map(e => ({ ...e, ts: words(e.t).map(stem), ps: words(e.p).map(stem), bs: words(e.b).map(stem) }));

function queryStems(text) {
  return words(text).filter(w => !STOP.has(w)).map(stem);
}
function hits(list, s) { let n = 0; for (const w of list) if (w.startsWith(s)) n++; return n; }

function search(text) {
  const stems = queryStems(text);
  if (!stems.length) return [];
  const groups = stems.map(s => [s, ...(SYN[s] || Object.entries(SYN).find(([k]) => s.startsWith(k))?.[1] || [])]);
  const out = [];
  for (const e of ENTRIES) {
    let score = 0, matched = 0;
    groups.forEach(g => {
      let best = 0;
      g.forEach((s, i) => {
        const w = i ? 0.6 : 1;
        const sc = (hits(e.ts, s) * 8 + hits(e.ps, s) * 2 + Math.min(hits(e.bs, s), 4)) * w;
        if (sc > best) best = sc;
      });
      if (best) { matched++; score += best; }
    });
    if (!matched || matched < Math.ceil(groups.length * 0.6)) continue;
    score *= matched / groups.length;
    if (e.k === 'pregunta') score *= 1.15;
    if (e.k === 'guia') score *= 1.1;
    out.push({ e, score });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 30).map(r => r.e);
}

function highlight(text, stems) {
  if (!stems.length) return esc(text);
  const f = fold(text); let out = '', last = 0;
  const re = /[a-z0-9ñ]+/g; let m;
  while ((m = re.exec(f))) {
    const st = stem(m[0]);
    if (stems.some(s => st.startsWith(s))) { out += esc(text.slice(last, m.index)) + '<mark>' + esc(text.slice(m.index, m.index + m[0].length)) + '</mark>'; last = m.index + m[0].length; }
  }
  return out + esc(text.slice(last));
}
function snippet(text, stems) {
  const f = fold(text); let pos = -1;
  const re = /[a-z0-9ñ]+/g; let m;
  while ((m = re.exec(f))) { if (stems.some(s => stem(m[0]).startsWith(s))) { pos = m.index; break; } }
  let start = Math.max(0, pos - 70);
  if (start > 0) { const sp = text.indexOf(' ', start); start = sp > 0 ? sp + 1 : start; }
  let s = text.slice(start, start + 220);
  if (start + 220 < text.length) s = s.replace(/\s\S*$/, '') + '…';
  return (start > 0 ? '…' : '') + highlight(s, stems);
}

// ---------- rutas de menú en el contenido ----------
function decorate(root) {
  root.querySelectorAll('strong, b, em').forEach(el => {
    if (el.textContent.includes('→') && !el.querySelector('*')) {
      el.outerHTML = '<span class="route">' + el.textContent.split('→').map(p => esc(p.trim())).join(' <i>›</i> ') + '</span>';
    }
  });
  root.querySelectorAll('p').forEach(p => { if (/^(Dónde|Donde)\b/.test(p.textContent.trim())) p.classList.add('where'); });
  // texto suelto "Seguros → Ventas → X" fuera de negritas
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) if (walker.currentNode.nodeValue.includes('→') && !walker.currentNode.parentElement.closest('.route, code')) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const html = esc(n.nodeValue).replace(/((?:[A-ZÁÉÍÓÚÑ][\wáéíóúñ\/().-]*(?: [\wáéíóúñ\/().-]+){0,4}) → (?:[^,.;:→]+? → )*[^,.;:→]+?)(?=[,.;:)]|\s(?:y|o|para|con|del|en|desde)\s|$)/g,
      m => '<span class="route">' + m.split('→').map(p => p.trim()).join(' <i>›</i> ') + '</span>');
    if (html !== esc(n.nodeValue)) { const span = document.createElement('span'); span.innerHTML = html; n.replaceWith(...span.childNodes); }
  });
}

// ---------- vistas ----------
const CH = DATA.chapters;
const findTarget = id => {
  for (const c of CH) {
    if (c.id === id) return { c };
    for (const s of c.sections) { if (s.id === id || id.startsWith(s.id + '--')) return { c, s }; }
  }
  return null;
};

function renderHome() {
  band.classList.add('home');
  const guide = CH[0];
  view.innerHTML = `
    <section class="journey">
      <p class="eyebrow">Guía rápida</p>
      <h2 class="title">El camino de un cliente, paso a paso</h2>
      <ol class="steps">${guide.sections.map(s => `<li><a href="#${s.id}"><strong>${esc(s.title)}</strong></a></li>`).join('')}</ol>
    </section>
    <section>
      <p class="eyebrow">Manuales</p>
      <h2 class="title">Todo lo que hace el sistema</h2>
      <div class="grid">${CH.slice(1).map(c => `<a class="card" href="#${c.id}"><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><span class="count">${c.sections.length} temas</span></a>`).join('')}</div>
    </section>`;
}

function renderChapter(c, targetId) {
  band.classList.remove('home');
  view.innerHTML = `<div class="reader">
    <nav class="toc" aria-label="Contenido">
      <a class="back" href="#inicio">‹ Todos los manuales</a>
      <h3>${esc(c.title)}</h3>
      <select id="tocsel" aria-label="Ir a un tema">${c.sections.map(s => `<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>
      <ol>${c.sections.map(s => `<li><a href="#${s.id}" data-id="${s.id}">${esc(s.title)}</a></li>`).join('')}</ol>
      <div class="others"><ol>${CH.filter(o => o !== c).map(o => `<li><a href="#${o.id}">${esc(o.title)}</a></li>`).join('')}</ol></div>
    </nav>
    <article>
      <p class="eyebrow">Manual</p>
      <h2 class="title">${esc(c.title)}</h2>
      <div class="intro">${c.intro}</div>
      ${c.sections.map(s => `<section id="${s.id}"><h3>${esc(s.title)}</h3>${s.html}</section>`).join('')}
    </article></div>`;
  decorate($('article', view));
  $('#tocsel').addEventListener('change', e => { location.hash = e.target.value; });
  const spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) markToc(en.target.id); }), { rootMargin: '0px 0px -70% 0px' });
  view.querySelectorAll('article section').forEach(s => spy.observe(s));
  if (targetId && targetId !== c.id) {
    const el = document.getElementById(targetId);
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); markToc(findTarget(targetId)?.s?.id); }
  } else window.scrollTo(0, 0);
}
function markToc(id) {
  if (!id) return;
  view.querySelectorAll('.toc a[data-id]').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  const sel = $('#tocsel'); if (sel) sel.value = id;
}

let selIdx = -1;
function renderResults(text) {
  band.classList.remove('home');
  const stems = queryStems(text);
  const res = search(text);
  selIdx = -1;
  view.innerHTML = `<p class="eyebrow">Búsqueda</p>
    <h2 class="title">${res.length ? `${res.length === 30 ? 'Más de 30' : res.length} resultado${res.length === 1 ? '' : 's'} para “${esc(text)}”` : `Sin resultados para “${esc(text)}”`}</h2>
    ${res.length ? `<div class="results" id="results">${res.map(e => `<a class="result" href="#${e.id}">
        <span class="meta"><span class="badge ${e.k}">${{ pregunta: 'Pregunta', tema: 'Tema', guia: 'Guía rápida', manual: 'Manual' }[e.k]}</span>${esc(e.p)}</span>
        <h3>${highlight(e.t, stems)}</h3><p>${snippet(e.b, stems)}</p></a>`).join('')}</div>`
      : `<div class="empty">Pruebe con otra palabra (por ejemplo “cuota”, “renovación”, “carta”) o vuelva a los <a href="#inicio">manuales</a>.</div>`}`;
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id || id === 'inicio') { if (!q.value.trim()) return renderHome(); return renderResults(q.value.trim()); }
  const t = findTarget(id);
  if (t) renderChapter(t.c, id); else renderHome();
}

let timer;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const v = q.value.trim();
    if (v.length >= 2) renderResults(v); else route();
  }, 120);
});
q.addEventListener('keydown', e => {
  const items = [...view.querySelectorAll('.result')];
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    selIdx = (selIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle('sel', i === selIdx));
    items[selIdx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    (items[selIdx] || items[0]).click();
  } else if (e.key === 'Escape') { q.value = ''; route(); }
});
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
view.addEventListener('click', e => {
  const a = e.target.closest('a.result');
  if (a) { const h = a.getAttribute('href'); q.value = ''; if (location.hash === h) route(); }
});
window.addEventListener('hashchange', route);

const CHIPS = ['¿Cómo renuevo varias pólizas a la vez?', 'Cobrar una cuota', 'Leer cotizaciones', 'Grupo deudor', 'Carta de despacho', 'Registrar una reclamación', 'Dar acceso a un cliente'];
$('#chips').innerHTML = CHIPS.map(c => `<button type="button">${esc(c)}</button>`).join('');
$('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { q.value = b.textContent; renderResults(q.value); q.focus(); } });
route();
</script>
