;\n   - se registra el <strong>pago<\/strong> de la parte que llegó al banco y se cruza con lo que ya se había\n     retenido en remesas;\n   - las líneas aceptadas se bloquean;\n   - se calculan las <strong>comisiones de los ejecutivos<\/strong>.\n7. <strong>Anular<\/strong> cancela la factura y el pago, y libera las comisiones. No se puede si ya se\n   liquidaron comisiones de ejecutivos de esa conciliación.<\/p>\n<p>Reportes: en <strong>Comisiones esperadas<\/strong>, la vista pivote muestra lo esperado, lo recibido y lo\nreclamado por aseguradora y mes. El filtro <em>Con monto a reclamar<\/em> sirve para preparar los\nreclamos a la aseguradora.<\/p>", "subs": [{"id": "cobros-comisiones-de-la-corredora--recibo-de-ingreso-y-conciliacion", "title": "Recibo de ingreso y conciliación"}]}, {"id": "cobros-ejecutivos", "title": "Ejecutivos", "html": "<ul>\n<li>Su comisión se calcula al procesar la conciliación:<\/li>\n<li>normalmente es su % sobre la <strong>comisión recibida<\/strong>;<\/li>\n<li>si su regla tiene <em>Sobre prima pagada<\/em>, el % es sobre la <strong>prima cobrada<\/strong>.<\/li>\n<li><strong>Adelantos e incentivos<\/strong>:<\/li>\n<li>un <strong>adelanto<\/strong> se paga en el momento (con asiento a <em>Anticipos a ejecutivos<\/em>) y se\n    descuenta en la próxima liquidación;<\/li>\n<li>un <strong>incentivo<\/strong> se suma en la próxima liquidación.<\/li>\n<li><strong>Liquidaciones → Nuevo → Cargar pendientes → Generar factura<\/strong>. Crea la factura de proveedor\n  en <strong>borrador<\/strong>, para que contabilidad revise las retenciones antes de publicarla.<\/li>\n<li><strong>Liquidación por lote<\/strong>: en <strong>Configuración → Ejecutivos<\/strong>, selecciona varios y usa\n  <em>Acción → Liquidar comisiones<\/em>.<\/li>\n<\/ul><h4 id=\"cobros-ejecutivos--plantilla-de-conciliacion\">Plantilla de conciliación<\/h4><p>En el recibo de ingreso, después de <strong>Conciliar comisiones<\/strong>, <strong>Descargar plantilla<\/strong> baja un\nExcel con una fila por comisión (póliza, cliente, documento, recibo, prima cobrada, % y comisión\nesperada). Llena la columna <strong>Recibido<\/strong> (o envíala a la aseguradora para que la llene), adjúntala\nen <em>Plantilla con lo recibido<\/em> y pulsa <strong>Importar lo recibido<\/strong>: cada comisión toma su monto.<\/p>", "subs": [{"id": "cobros-ejecutivos--plantilla-de-conciliacion", "title": "Plantilla de conciliación"}]}, {"id": "cobros-metas-y-presupuesto", "title": "Metas y presupuesto", "html": "<p><strong>Reportes → Metas y presupuesto<\/strong>: una línea por meta con el tipo (producción, cobros o\ncomisiones recibidas), el período y, si quieres, el ejecutivo, la aseguradora o el ramo. El\n<strong>real<\/strong>, lo que <strong>falta<\/strong> y el <strong>cumplimiento<\/strong> se calculan solos (verde al 100%, ámbar por\ndebajo de 70%). Para el presupuesto del año usa el año completo como período.<\/p>\n<ul>\n<li>Producción: prima de las pólizas emitidas con inicio de vigencia en el período.<\/li>\n<li>Cobros: lo aplicado de recibos en el período.<\/li>\n<li>Comisiones: lo recibido en conciliaciones procesadas en el período.<\/li>\n<\/ul>", "subs": []}, {"id": "cobros-carta-de-despacho", "title": "Carta de despacho", "html": "<p>Al entregar las pólizas emitidas o renovadas, en la póliza vigente (o seleccionando varias del\nmismo cliente en la lista, <em>Acción → Carta de despacho<\/em>) se arma la carta que las acompaña:<\/p>\n<ol>\n<li>Se propone <strong>Emisión<\/strong> o <strong>Renovación<\/strong>, la <strong>referencia<\/strong> (\"Emisión Multirriesgo - Seguros\n   Crecer\") y el <strong>interés asegurado<\/strong> con los ítems y sus valores. Elija a quién va dirigida\n   (<em>Atención<\/em>) y quién firma.<\/li>\n<li>La carta trae una fila por póliza con su factura (número, ramo, concepto, fecha, valor y\n   vigencia) y el total, la documentación incluida, las recomendaciones y el plazo de pago de la\n   Ley 146-02.<\/li>\n<li><strong>Descargar PDF<\/strong> o <strong>Descargar Word<\/strong> para retocarla antes de enviarla.<\/li>\n<\/ol>", "subs": []}, {"id": "cobros-estado-de-cuenta-del-cliente", "title": "Estado de cuenta del cliente", "html": "<p>En el contacto, el botón <strong>Balance de primas<\/strong> muestra sus documentos pendientes. Para el PDF,\nusa <em>Imprimir → Estado de cuenta de seguros<\/em>.<\/p><h4 id=\"cobros-estado-de-cuenta-del-cliente--grupo-deudor\">Grupo deudor<\/h4><p>Cuando una compañía madre responde por las primas de varios clientes (sus filiales, sus\nempleados), en cada uno de esos clientes se pone el <strong>Grupo deudor<\/strong> (pestaña <em>Seguros<\/em>). En\nel grupo:<\/p>\n<ul>\n<li>el botón <strong>Balance del grupo<\/strong> abre los documentos pendientes de todos sus clientes,\n  agrupados por cliente;<\/li>\n<li><em>Imprimir → Estado de cuenta de seguros<\/em> sale como <strong>Estado de cuenta del grupo<\/strong>, con una\n  columna de cliente y el balance total del grupo;<\/li>\n<li>en un <strong>recibo de cobro<\/strong> a nombre del grupo, <em>Distribuir<\/em> y la lista de documentos traen los\n  de todos sus clientes con esa aseguradora y moneda.<\/li>\n<\/ul>\n<p>En documentos de prima, cuotas pendientes, seguimiento a cobros y antigüedad de saldos se puede\nbuscar y <strong>agrupar por Grupo deudor<\/strong>. Un cliente sin grupo responde por sí mismo.<\/p>", "subs": [{"id": "cobros-estado-de-cuenta-del-cliente--grupo-deudor", "title": "Grupo deudor"}]}, {"id": "cobros-preguntas-frecuentes", "title": "Preguntas frecuentes", "html": "<p><strong id=\"cobros-preguntas-frecuentes--por-que-la-factura-de-prima-no-aparece-en-contabilidad\">¿Por qué la factura de prima no aparece en Contabilidad?<\/strong> Porque no es de la corredora: es\nde la aseguradora al cliente. En contabilidad solo aparecen el cobro (si lo recibió la\ncorredora), la remesa, la factura de comisión y la liquidación de ejecutivos.<\/p>\n<p><strong>La factura de comisión quedó con un saldo pequeño.<\/strong> El producto de comisión tiene un\nimpuesto que la aseguradora no pagó. La comisión va sin ITBIS: quita el impuesto del producto\n(Ajustes → Comisión de corretaje) para las próximas facturas y revisa con el contador cómo\ncerrar esa.<\/p>\n<p><strong id=\"cobros-preguntas-frecuentes--que-pasa-con-la-comision-si-la-aseguradora-emite-una-nota-de\">¿Qué pasa con la comisión si la aseguradora emite una nota de crédito?<\/strong> La nota baja el\nbalance del cliente, pero en esta versión no genera un reverso de comisión automático. Si la\naseguradora descuenta comisión, regístralo como <em>monto adicional<\/em> de tipo descuento en la\nconciliación.<\/p>\n<p><strong>Me equivoqué en un recibo ya remesado.<\/strong> Anula primero la remesa (revierte su asiento), luego\nel recibo, y vuelve a hacerlos.<\/p>", "subs": []}]}, {"id": "avisos", "title": "Avisos a clientes", "summary": "Avisos automáticos por WhatsApp y correo: vencimientos, cuotas, cumpleaños.", "intro": "<p>Odoo avisa a tus clientes, sin que nadie lo recuerde, de lo que les toca: renovar, pagar\nuna cuota, ponerse al día, actualizar su formulario KYC y cómo va su reclamación.<\/p>", "sections": [{"id": "avisos-encender-los-avisos", "title": "Encender los avisos", "html": "<p>Los avisos vienen <strong>apagados<\/strong> al instalar. En Seguros → Configuración → Ajustes → <strong>Avisos a\nclientes<\/strong>, marca <em>Enviar avisos automáticos<\/em> cuando las reglas estén revisadas. El primer día\nse avisa todo lo que esté pendiente (por ejemplo, todas las facturas con más de 15 días de\natraso), así que revisa antes las reglas y los mensajes.<\/p>", "subs": []}, {"id": "avisos-configurar-el-whatsapp-una-vez", "title": "Configurar el WhatsApp (una vez)", "html": "<p>Seguros → Configuración → Ajustes → <strong>Avisos a clientes por WhatsApp<\/strong>:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Opción<\/th>\n<th>Cuándo usarla<\/th>\n<th>Qué pide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sin WhatsApp<\/td>\n<td>Solo correo.<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Fradoo<\/td>\n<td>Usas Fradoo como WhatsApp de la corredora. Los mensajes salen del número de la corredora en Fradoo y las respuestas llegan a su bandeja.<\/td>\n<td>Dirección de Fradoo y clave de API (en Fradoo: Ajustes → API).<\/td>\n<\/tr>\n<tr>\n<td>API oficial de Meta<\/td>\n<td>Tienes un número de WhatsApp Business conectado a Meta.<\/td>\n<td>Phone number ID y token de acceso.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Importante sobre WhatsApp:<\/strong> Meta solo deja escribir texto libre a quien escribió a la\ncorredora en las últimas 24 horas. Para avisos a cualquier cliente (renovaciones, cobros),\nusa <strong>plantillas aprobadas por Meta<\/strong> y escribe su nombre en la regla (campo <em>Plantilla de\nMeta<\/em>). Las variables de la plantilla se llenan en orden: <strong>1<\/strong> cliente, <strong>2<\/strong> póliza (o\ndocumento), <strong>3<\/strong> fecha de vencimiento (o monto, en avisos de cobro).<\/p>\n<p>El <strong>código de país<\/strong> (RD: 1) se agrega a los teléfonos de 10 dígitos. Se usa el móvil del\ncliente y, si no tiene, el teléfono.<\/p>", "subs": []}, {"id": "avisos-reglas-de-aviso", "title": "Reglas de aviso", "html": "<p>Seguros → Configuración → Seguros → <strong>Avisos a clientes<\/strong>. Vienen siete listas para usar:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Regla<\/th>\n<th>Cuándo se envía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Renovación en 30 días<\/td>\n<td>Una vez, cuando a la póliza le faltan 30 días o menos para vencer.<\/td>\n<\/tr>\n<tr>\n<td>Renovación en 7 días<\/td>\n<td>Una vez, a 7 días o menos.<\/td>\n<\/tr>\n<tr>\n<td>Cuota por vencer en 3 días<\/td>\n<td>Por cada cuota (o factura de contado) que vence en 3 días o menos.<\/td>\n<\/tr>\n<tr>\n<td>Prima vencida 15 días<\/td>\n<td>Una vez por factura, cuando tiene 15 días o más de atraso.<\/td>\n<\/tr>\n<tr>\n<td>Formulario KYC por vencer<\/td>\n<td>Solo correo, 30 días antes del vencimiento del formulario.<\/td>\n<\/tr>\n<tr>\n<td>Avance de reclamación<\/td>\n<td>Cada vez que la reclamación cambia de estado.<\/td>\n<\/tr>\n<tr>\n<td>Felicitación de cumpleaños<\/td>\n<td>El día del cumpleaños del cliente, una vez al año.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En cada regla puedes cambiar los días, los canales, el asunto y el mensaje. Variables:\n<code>{cliente} {poliza} {aseguradora} {ramo} {vence} {dias} {monto} {moneda} {documento}\n{estado} {corredora}<\/code>. Desactiva la regla con el interruptor si no la quieres.<\/p>\n<p>Con los avisos encendidos, salen solos una vez al día. <strong>Enviar ahora lo pendiente<\/strong> en la regla los manda\nde inmediato. Nunca se envía dos veces el mismo aviso de la misma regla para el mismo\ndocumento.<\/p>\n<p>Las pólizas con <em>Avisar al cliente al vencer<\/em> desmarcado no reciben avisos de renovación.<\/p>", "subs": []}, {"id": "avisos-desde-la-poliza", "title": "Desde la póliza", "html": "<p>El botón <strong>Avisar renovación<\/strong> de una póliza vigente envía el aviso en ese momento.<\/p>", "subs": []}, {"id": "avisos-seguimiento", "title": "Seguimiento", "html": "<p>Seguros → Reportes → <strong>Avisos enviados<\/strong>: fecha, cliente, documento, canal y estado\n(<em>Enviado<\/em>, <em>Falló<\/em> con el motivo —por ejemplo, el cliente no tiene correo o número válido—,\nu <em>Omitido<\/em>). El correo queda además en el historial de la póliza o factura.<\/p>\n<p>Para que un cliente no reciba avisos, marca <strong>No enviar avisos<\/strong> en su ficha.<\/p>", "subs": []}]}, {"id": "bandeja", "title": "Bandeja de aseguradoras", "summary": "Cargar los archivos que mandan las aseguradoras y aplicarlos a la cartera.", "intro": "<p>Las aseguradoras envían reportes de lo que <strong>emitieron<\/strong>, <strong>renovaron<\/strong>, <strong>cobraron\ndirectamente<\/strong> o <strong>acreditaron<\/strong> a tus clientes. La bandeja los carga, los compara con lo\nque hay en Odoo y los aplica sin digitar póliza por póliza.<\/p>\n<p><strong>Dónde:<\/strong> Seguros → Operación → Bandeja de aseguradoras.<\/p>", "sections": [{"id": "bandeja-cargar-un-archivo", "title": "Cargar un archivo", "html": "<ol>\n<li><strong>Lotes → Nuevo<\/strong>.<\/li>\n<li>Elige la <strong>aseguradora<\/strong> y la <strong>cola<\/strong>: Emisiones, Renovaciones, Cobros o Notas de crédito.<\/li>\n<li>Adjunta el archivo (Excel <code>.xlsx<\/code> o CSV) tal como lo envió la aseguradora.<\/li>\n<li>Pulsa <strong>Cargar archivo<\/strong>.<\/li>\n<\/ol>\n<p>En la pestaña <em>Columnas reconocidas<\/em> ves qué columna del archivo se tomó para cada dato.<\/p><h4 id=\"bandeja-cargar-un-archivo--columnas-que-se-reconocen-solas\">Columnas que se reconocen solas<\/h4><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dato<\/th>\n<th>Nombres de columna que se reconocen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Póliza<\/td>\n<td>Póliza, No. Póliza, Número de póliza, Certificado<\/td>\n<\/tr>\n<tr>\n<td>Póliza anterior (renovaciones)<\/td>\n<td>Póliza anterior, Renueva a<\/td>\n<\/tr>\n<tr>\n<td>Cliente<\/td>\n<td>Cliente, Asegurado, Nombre, Contratante, Tomador<\/td>\n<\/tr>\n<tr>\n<td>RNC / cédula<\/td>\n<td>RNC, Cédula, RNC/Cédula, Identificación<\/td>\n<\/tr>\n<tr>\n<td>Ramo<\/td>\n<td>Ramo, Producto, Plan, Subramo<\/td>\n<\/tr>\n<tr>\n<td>Moneda<\/td>\n<td>Moneda (RD, DOP, Pesos, US, USD, Dólares)<\/td>\n<\/tr>\n<tr>\n<td>Vigencia<\/td>\n<td>Inicio vigencia / Desde, Fin vigencia / Hasta / Vencimiento<\/td>\n<\/tr>\n<tr>\n<td>Emisión<\/td>\n<td>Fecha emisión, Emisión<\/td>\n<\/tr>\n<tr>\n<td>Montos<\/td>\n<td>Suma asegurada, Prima neta, Impuesto / ITBIS, Prima bruta / Prima total / Total<\/td>\n<\/tr>\n<tr>\n<td>Documento<\/td>\n<td>Factura, No. Factura, Aviso de cobro, Nota de crédito<\/td>\n<\/tr>\n<tr>\n<td>Cobros<\/td>\n<td>Recibo, Fecha pago, Monto pagado / Monto / Importe<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Si una aseguradora usa otros nombres, o su archivo trae un título arriba de los\nencabezados, crea un <strong>perfil<\/strong> en Seguros → Configuración → Seguros → <em>Perfiles de archivo\nde aseguradoras<\/em>: indica solo las columnas que no se reconocen, el formato de fecha y la\nfila de encabezados. Luego elige ese perfil en el lote.<\/p>", "subs": [{"id": "bandeja-cargar-un-archivo--columnas-que-se-reconocen-solas", "title": "Columnas que se reconocen solas"}]}, {"id": "bandeja-revisar", "title": "Revisar", "html": "<p>Cada registro queda en un estado:<\/p>\n<ul>\n<li><strong>Listo<\/strong> (azul): se puede aplicar; el detalle dice qué va a pasar.<\/li>\n<li><strong>Con problema<\/strong> (rojo): el detalle dice por qué. Corrige en la fila (por ejemplo, elige\n  el ramo, el cliente o la póliza) y pulsa <em>Validar de nuevo<\/em>.<\/li>\n<li><strong>Ignorado<\/strong>: ya existía (misma póliza y vigencia, mismo recibo, misma nota) o lo\n  descartaste.<\/li>\n<li><strong>Aplicado<\/strong> (verde): ya se creó en Odoo; la fila enlaza lo creado.<\/li>\n<\/ul>", "subs": []}, {"id": "bandeja-aplicar", "title": "Aplicar", "html": "<p><strong>Aplicar listos<\/strong> procesa todos los registros listos. Cada uno se aplica por separado: si\nuno falla, queda en rojo con el motivo y los demás siguen.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Cola<\/th>\n<th>Qué hace<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Emisiones<\/td>\n<td>Busca el cliente por RNC/cédula o nombre (si no existe lo crea), crea la póliza vigente con la prima e impuesto del archivo y su factura de prima.<\/td>\n<\/tr>\n<tr>\n<td>Renovaciones<\/td>\n<td>Renueva la póliza anterior (copia ítems, coberturas, ejecutivos y coaseguro), con las fechas y prima del archivo, la activa y crea la factura de renovación.<\/td>\n<\/tr>\n<tr>\n<td>Cobros<\/td>\n<td>Registra un recibo de <em>pago directo en aseguradora<\/em> contra la factura indicada (o la más antigua pendiente de la póliza), genera la comisión por conciliar y, si sobra dinero, lo deja como saldo a favor.<\/td>\n<\/tr>\n<tr>\n<td>Notas de crédito<\/td>\n<td>Crea la nota de crédito en la póliza y la aplica a lo pendiente del cliente con esa aseguradora.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Cuando termines con el lote, pulsa <strong>Terminar<\/strong>. Lo que siga pendiente aparece en\n<strong>Por procesar<\/strong> y en <em>Pendientes<\/em> del Inicio.<\/p>", "subs": []}, {"id": "bandeja-preguntas-frecuentes", "title": "Preguntas frecuentes", "html": "<ul>\n<li><strong id=\"bandeja-preguntas-frecuentes--puedo-cargar-el-mismo-archivo-dos-veces\">¿Puedo cargar el mismo archivo dos veces?<\/strong> Sí: lo ya aplicado se marca <em>Ignorado<\/em>.<\/li>\n<li><strong>El ramo del archivo no coincide con los nuestros.<\/strong> Elige el ramo en la fila, o registra\n  la equivalencia en Configuración → Categorías (nombre en la aseguradora) para que se\n  reconozca la próxima vez.<\/li>\n<li><strong>La aseguradora no indica el número de factura en los cobros.<\/strong> El pago se aplica a la\n  factura pendiente más antigua de la póliza.<\/li>\n<\/ul>", "subs": []}]}, {"id": "linea", "title": "Cotizador y espacio del cliente", "summary": "Cotizador en la página web, espacio del cliente y espacio de la empresa (RR. HH.).", "intro": "<p>Este módulo pone dos cosas en internet con la marca de la corredora:<\/p>\n<ul>\n<li><strong>El cotizador<\/strong> (<code>/cotizar<\/code>): cualquier persona pide una cotización desde la página web y la\n  solicitud llega al CRM como oportunidad.<\/li>\n<li><strong>El espacio del cliente<\/strong> (<code>/cliente<\/code>): cada cliente entra con su correo y ve sus pólizas,\n  pagos y reclamaciones, y reporta un siniestro.<\/li>\n<\/ul>", "sections": [{"id": "linea-configuracion-administrador", "title": "Configuración (administrador)", "html": "<p>En <strong>Seguros → Configuración → Ajustes → En línea<\/strong>:<\/p>\n<ul>\n<li><strong>Colores<\/strong>: principal y de acento. El logo es el de la compañía (Ajustes generales).<\/li>\n<li><strong>Logo para fondo oscuro<\/strong>: la versión clara del logo, para los paneles de color del\n  cotizador y de la entrada. Vacío: se usa el logo normal sobre una placa clara.<\/li>\n<li><strong>Frase de la marca<\/strong>: el titular de la página de entrada del espacio del cliente.<\/li>\n<li><strong>Aviso de privacidad<\/strong>: enlace que el visitante acepta al enviar el cotizador.<\/li>\n<li><strong>Equipo de ventas<\/strong>: el que recibe las solicitudes del cotizador. Vacío: el equipo Seguros.<\/li>\n<li><strong>WhatsApp de atención<\/strong>: número con código de país, solo dígitos (ej. 18095550000). Activa los\n  botones \"Escríbanos\" del cotizador y del espacio del cliente.<\/li>\n<\/ul><h4 id=\"linea-configuracion-administrador--que-se-puede-cotizar\">Qué se puede cotizar<\/h4><p>Cada ramo tiene la pestaña <strong>Cotizador en línea<\/strong> (Seguros → Configuración → Ramos):<\/p>\n<ul>\n<li><strong>Se cotiza en línea<\/strong>: lo muestra como opción.<\/li>\n<li><strong>Nombre en el cotizador<\/strong> y <strong>Descripción<\/strong>: cómo lo ve el visitante (ej. \"Mi vehículo\").<\/li>\n<li><strong>Para<\/strong>: personas y familias, o empresas. Se agrupan así en la primera pantalla.<\/li>\n<li><strong>Orden<\/strong>.<\/li>\n<\/ul>\n<p>Además siempre aparece <strong>Aún no estoy seguro(a)<\/strong>: la oportunidad llega sin ramo, como\nasesoría, con lo que el visitante contó.<\/p>\n<p>Lo que se pregunta en el segundo paso depende del tipo de ítem del ramo: vehículo (marca, modelo,\naño, uso y valor), persona (para quién, cuántas personas, edad y cobertura), inmueble (tipo,\ndirección y valores) o genérico (descripción y monto).<\/p><h4 id=\"linea-configuracion-administrador--enlace-desde-la-pagina-web\">Enlace desde la página web<\/h4><p>Ponga un botón \"Cotizar en línea\" en la página de la corredora que lleve a\n<code>https://&lt;su Odoo&gt;/cotizar<\/code>. Para abrir directo un ramo: <code>/cotizar?ramo=&lt;id del ramo&gt;<\/code>.<\/p>", "subs": [{"id": "linea-configuracion-administrador--que-se-puede-cotizar", "title": "Qué se puede cotizar"}, {"id": "linea-configuracion-administrador--enlace-desde-la-pagina-web", "title": "Enlace desde la página web"}]}, {"id": "linea-el-cotizador", "title": "El cotizador", "html": "<p>El visitante responde 4 pasos: qué asegurar, los datos del bien o de las personas, si ya tiene\nseguro (con qué aseguradora y cuándo vence) y cómo contactarlo. A la izquierda la solicitud se va\nescribiendo como una carta con sus respuestas.<\/p>\n<p>Al enviar:<\/p>\n<ol>\n<li>Se crea una <strong>oportunidad<\/strong> en el equipo de ventas, en su primera etapa, con origen\n   <em>Cotizador en línea<\/em>, el ramo, la aseguradora y el vencimiento de su póliza actual.<\/li>\n<li>La <strong>descripción<\/strong> resume todo lo que llenó.<\/li>\n<li>Se crea una <strong>llamada pendiente<\/strong> para el líder del equipo.<\/li>\n<li>Si dejó correo, recibe la confirmación con su número de referencia.<\/li>\n<\/ol>\n<p>En el CRM, el filtro <strong>Del cotizador en línea<\/strong> las muestra. El botón <strong>Cotizar<\/strong> de la\noportunidad crea el contacto (si no existe) y abre la cotización con el bien ya cargado.<\/p>\n<p>Los envíos automáticos de robots se descartan sin avisar.<\/p>", "subs": []}, {"id": "linea-el-espacio-del-cliente", "title": "El espacio del cliente", "html": "<h4 id=\"linea-el-espacio-del-cliente--dar-acceso\">Dar acceso<\/h4><ol>\n<li>Abra el cliente (debe tener correo).<\/li>\n<li><strong>Acción → Conceder acceso al portal → Conceder acceso<\/strong>. Le llega un correo para crear su\n   contraseña.<\/li>\n<li>El cliente entra por <code>https://&lt;su Odoo&gt;/cliente<\/code>. Si entra por el inicio de sesión normal de\n   Odoo, por el enlace de la invitación o por el portal estándar (<code>/my<\/code>), igual llega a su\n   espacio. El personal de la corredora sigue entrando a Odoo como siempre.<\/li>\n<\/ol>\n<p>El correo de invitación y el de \"olvidé mi contraseña\" llevan a pantallas con la marca de la\ncorredora: el cliente crea su contraseña y entra directo a su espacio.<\/p>\n<p>Si el cliente es una empresa, dé acceso a la persona de contacto: verá todo lo de la empresa.<\/p><h4 id=\"linea-el-espacio-del-cliente--que-ve-el-cliente\">Qué ve el cliente<\/h4><ul>\n<li><strong>Inicio<\/strong>: un resumen en una frase (pólizas vigentes, reclamaciones, próximo pago o pago\n  vencido), accesos rápidos y <strong>su protección hoy<\/strong>: cada póliza con una línea de su vigencia que\n  marca el día de hoy y las cuotas (pagadas, por vencer y vencidas).<\/li>\n<li><strong>Mis pólizas<\/strong>: vigentes y anteriores. Cada póliza abre con una franja con lo esencial:\n  días de vigencia que quedan, a quién cubre (titulares y dependientes, o los bienes), la suma\n  asegurada (por persona cuando es igual para todos), si está al día o cuánto debe, y la línea\n  de vigencia con las cuotas. Debajo: <strong>qué cubre<\/strong> (las coberturas una sola vez; si alguna no\n  aplica a todos, dice a cuántos), <strong>quién está cubierto<\/strong> (en colectivos, una fila por titular\n  con su familia debajo, buscador y beneficiarios en vida; RR.HH. puede abrir la ficha de cada\n  empleado) y los documentos de prima. A la derecha: <strong>reportar un siniestro<\/strong> y pedirle al\n  asesor un certificado, un cambio, una inclusión, una exclusión o una cancelación con un toque.\n  Arriba, el <strong>resumen en PDF<\/strong>.<\/li>\n<li><strong>Pagos<\/strong>: lo pendiente y lo vencido por moneda, las cuotas por vencer, los documentos con\n  balance, los pagos registrados y el estado de cuenta en PDF.<\/li>\n<li><strong>Reclamaciones<\/strong>: el avance de cada una (Recibida, En la aseguradora, En ajuste, Aprobada,\n  Pagada), los documentos que pide la aseguradora con un botón para subir cada uno, las fotos y\n  los montos.<\/li>\n<li><strong>Mi cuenta<\/strong>: sus datos registrados, un botón para pedir cambios por WhatsApp y el cambio\n  de contraseña.<\/li>\n<li><strong>Reportar un siniestro<\/strong>: elige la póliza, el bien, la fecha, la causa (solo las de su tipo de\n  seguro), dónde, qué pasó, si hubo terceros y fotos.<\/li>\n<\/ul><h4 id=\"linea-el-espacio-del-cliente--que-le-llega-a-la-corredora\">Qué le llega a la corredora<\/h4><div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Lo que hace el cliente<\/th>\n<th>Dónde aparece<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pide un certificado o un cambio<\/td>\n<td>Historial de la póliza y una actividad para su responsable<\/td>\n<\/tr>\n<tr>\n<td>Reporta un siniestro<\/td>\n<td>Reclamación nueva (<em>Registrada<\/em>, marcada \"reportada en línea\") con los documentos del ramo, sus fotos y una actividad para el responsable<\/td>\n<\/tr>\n<tr>\n<td>Sube un documento<\/td>\n<td>El documento queda <strong>Recibido<\/strong> con el archivo y una nota en el historial<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Cada cliente ve solo lo suyo y lo de su empresa. Las pólizas en borrador no se muestran.<\/p>", "subs": [{"id": "linea-el-espacio-del-cliente--dar-acceso", "title": "Dar acceso"}, {"id": "linea-el-espacio-del-cliente--que-ve-el-cliente", "title": "Qué ve el cliente"}, {"id": "linea-el-espacio-del-cliente--que-le-llega-a-la-corredora", "title": "Qué le llega a la corredora"}]}, {"id": "linea-espacio-de-la-empresa-recursos-humanos", "title": "Espacio de la empresa (Recursos Humanos)", "html": "<p>Para las cuentas corporativas: la persona de Recursos Humanos ve a todos los empleados asegurados.<\/p><h4 id=\"linea-espacio-de-la-empresa-recursos-humanos--dar-acceso\">Dar acceso<\/h4><ol>\n<li>Abra el contacto de RR.HH. dentro de la empresa cliente (debe tener correo).<\/li>\n<li>Pestaña <strong>Seguros → Espacio del cliente<\/strong>: marque <strong>Ve los asegurados de su empresa<\/strong>.<\/li>\n<li>Concédale acceso al portal como a cualquier cliente.<\/li>\n<\/ol>\n<p>Solo quien tenga la marca ve la nómina. Los demás contactos de la empresa ven las pólizas y\npagos, pero no los datos de los empleados.<\/p><h4 id=\"linea-espacio-de-la-empresa-recursos-humanos--que-ve\">Qué ve<\/h4><ul>\n<li><strong>Mi empresa<\/strong>: cuántos empleados y dependientes hay asegurados, la prima, lo pendiente y lo\n  vencido, las pólizas colectivas, la gente por departamento, los incluidos en los últimos 60\n  días y las reclamaciones en curso.<\/li>\n<li><strong>Asegurados<\/strong>: una fila por empleado (aunque esté en salud y en vida), con cédula, código,\n  departamento, pólizas, dependientes y prima. Se busca por nombre, cédula, código, departamento\n  o nombre de un dependiente, y se filtra por póliza. <strong>Descargar listado<\/strong> baja todo en CSV\n  (abre en Excel).<\/li>\n<li><strong>Ficha del empleado<\/strong>: su grupo familiar, beneficiarios de vida, cobertura, pólizas y\n  reclamaciones.<\/li>\n<li><strong>Inclusiones y exclusiones<\/strong>: pide altas, bajas, inclusión de dependientes o cambios de\n  datos. Llega como actividad al responsable de la póliza, con todos los datos.<\/li>\n<\/ul><h4 id=\"linea-espacio-de-la-empresa-recursos-humanos--cargar-la-nomina\">Cargar la nómina<\/h4><p>En la póliza colectiva: <strong>Importar asegurados<\/strong> con el Excel o CSV de la aseguradora o del\ncliente. Además de nombre, cédula, nacimiento y parentesco, lee <strong>Departamento<\/strong>, <strong>Código\nempleado<\/strong>, <strong>Fecha inclusión<\/strong> y <strong>Cédula titular<\/strong>. Cada dependiente queda enlazado a su\ntitular: al de la cédula indicada o, si no viene, al titular que aparece antes en el listado.\nLos beneficiarios se cargan en cada asegurado (pestaña Beneficiarios); deben sumar 100% o menos.<\/p>", "subs": [{"id": "linea-espacio-de-la-empresa-recursos-humanos--dar-acceso", "title": "Dar acceso"}, {"id": "linea-espacio-de-la-empresa-recursos-humanos--que-ve", "title": "Qué ve"}, {"id": "linea-espacio-de-la-empresa-recursos-humanos--cargar-la-nomina", "title": "Cargar la nómina"}]}]}, {"id": "portal", "title": "Portal del cliente", "summary": "Dar acceso a un cliente al portal.", "intro": "<p>El cliente entra al portal de la corredora con su correo y ve, sin llamar a nadie:<\/p>\n<ul>\n<li><strong>Mis pólizas<\/strong>: vigentes (o todas), con aseguradora, ramo, vigencia y prima. Al abrir una ve\n  los bienes o personas asegurados, sus facturas de prima y descarga el <strong>resumen de la póliza\n  en PDF<\/strong>.<\/li>\n<li><strong>Mis pagos pendientes<\/strong>: lo que tiene por pagar, cuándo vence (en rojo lo vencido) y el total.<\/li>\n<li><strong>Estado de cuenta (PDF)<\/strong>: el mismo que la corredora le envía.<\/li>\n<\/ul>\n<p>Cada cliente ve solo lo suyo: sus pólizas y las de su empresa. Las pólizas en borrador\n(solicitudes de emisión) no se muestran.<\/p>", "sections": [{"id": "portal-dar-acceso-a-un-cliente", "title": "Dar acceso a un cliente", "html": "<ol>\n<li>Abre el cliente (debe tener correo).<\/li>\n<li><strong>Acción → Conceder acceso al portal<\/strong> y pulsa <strong>Conceder acceso<\/strong>. Le llega un correo para\n   crear su contraseña.<\/li>\n<li>Para quitarlo, en el mismo asistente pulsa <strong>Revocar acceso<\/strong>.<\/li>\n<\/ol>\n<p>Si el cliente es una empresa, dale acceso a la persona de contacto: verá las pólizas de la\nempresa.<\/p>", "subs": []}]}], "index": [{"id": "cartera-conceptos", "t": "Conceptos", "p": "Clientes, pólizas y reclamaciones", "b": "Concepto Qué es Ramo El tipo de seguro: Vehículos de motor, Incendio, Salud… Define qué datos se piden de lo asegurado y qué coberturas se precargan. Cobertura Lo que cubre la póliza (Daños a la propiedad ajena, Terremoto…). Se agrupan por categoría de ramo. Tabla de comisiones Cuánto paga cada aseguradora a la corredora por ramo, distinto si la póliza es nueva o renovación . Ejecutivo Quien trae o atiende al cliente (ejecutivo de negocios, agente, referido). Tiene su propia tabla de comisiones. Condiciones particulares Los ítems asegurados de una póliza: vehículos, ubicaciones, personas. Cada uno con sus coberturas. Conoce tu Cliente (KYC) La información de debida diligencia que exige la ley de prevención de lavado.", "k": "tema"}, {"id": "cartera-inicio", "t": "Inicio", "p": "Clientes, pólizas y reclamaciones", "b": "Al abrir la app Seguros se ve Inicio . Todos los montos están en la moneda de la compañía. Si hay pólizas en otra moneda, se convierten a la tasa del día y el Inicio lo indica. Respeta el modo claro u oscuro de Odoo. - Buscar : escribe un número de póliza, nombre de cliente o RNC/cédula y pulsa Intro. - Registrar : crea una póliza, cliente, movimiento, cobro, remesa, conciliación de comisiones o reclamación, o abre la renovación en lote. El botón circular actualiza los datos. - Pulso , la franja de arriba: cartera vigente, por cobrar a clientes (la barra roja es la parte vencida), comisión por conciliar con las aseguradoras y prima que se renueva en 90 días. Cada cifra abre su lista. - Calendario de vencimientos : 13 semanas día por día, desde el lunes de esta semana. Mientras más oscuro el día, más prima vence ese día; el número son las pólizas. Hoy tiene borde y los días pasados se ven tenues. Pulsa un día para ver sus pólizas. - Próximas renovaciones : las siete pólizas que vencen primero, con cliente, aseguradora, ramo, prima y días que faltan (en rojo si faltan 15 días o menos). Pulsa una para abrirla. - Pendientes : agrupados por Cobros, Cartera, Cumplimiento y Reclamaciones; el punto rojo es urgente, el ámbar es para esta semana. Si no hay nada, lo indica. - Producción : prima emitida por mes en 12 meses, nuevas y renovaciones, con la línea de comisiones recibidas. - Aseguradoras : prima vigente por compañía y su porcentaje de la cartera. - Antigüedad del balance (con el módulo de Cobros): al día, 1-30, 31-60, 61-90 y más de 90 días, más cobrado por remesar, saldo a favor, comisión a reclamar, acuerdos vigentes y lo cobrado en el mes. - Clientes : personas y empresas, y la distribución por nivel de riesgo. - Reclamaciones : abiertas, monto reclamado, pagado en el año y cuántas hay en cada estado.", "k": "tema"}, {"id": "cartera-primeros-pasos-administrador", "t": "Primeros pasos (administrador)", "p": "Clientes, pólizas y reclamaciones", "b": "1. Seguros → Configuración → Seguros → Ramos : revisa el catálogo base. Ajusta el impuesto de cada ramo; los de salud y vida vienen en 0 hasta que el contador confirme el tratamiento fiscal. 2. Seguros → Operación → Aseguradoras : crea cada aseguradora (marca Es aseguradora ). En su pestaña Aseguradora carga la tabla de comisiones. - Para cargar o corregir muchas tasas de una vez, usa Configuración → Comisiones → Tabla de comisiones : filtra por aseguradora o ramo, selecciona varias filas y cambia el porcentaje en una sola. 3. Configuración → Comisiones → Ejecutivos : crea los ejecutivos. Asígnales un usuario para que les lleguen los avisos de renovación, y carga su tabla de comisiones. Deja la aseguradora vacía para que la tasa aplique a todas. 4. Configuración → Ajustes : define con cuántos días de anticipación se avisa una renovación (por defecto, 30).", "k": "tema"}, {"id": "cartera-clientes-y-debida-diligencia--listas-restrictivas", "t": "Listas restrictivas", "p": "Clientes, pólizas y reclamaciones › Clientes y debida diligencia", "b": "En Cumplimiento → Listas restrictivas están las listas contra las que se verifica a los clientes: - OFAC - Lista SDN (sanciones del Tesoro de EE.UU.): pulsa Actualizar lista para descargarla. Se puede programar para que se actualice sola cada semana. - ONU - Lista consolidada del Consejo de Seguridad : personas, entidades y sus alias; también con Actualizar lista (la misma tarea programada actualiza OFAC y ONU). - INTERPOL (Notificaciones Rojas) no permite consultas automáticas: se verifica en su página oficial y se registra el resultado (ver abajo). - Listas propias : crea una, elige Archivo propio (CSV) , adjunta un CSV con el nombre en la primera columna (y, opcional, el documento en la segunda) y pulsa Actualizar lista . Sirve para listas de la UAF, de la Superintendencia o internas. Para verificar, en la lista de clientes (o en la ficha) usa Acción → Verificar en listas restrictivas . Se compara el nombre sin importar acentos, el orden de las palabras ni \"SRL\" o \"S.A.\": - Coincidencia : el nombre completo es el mismo (sin importar orden, acentos ni \"SRL\"). El cliente queda en lista negra con el motivo y su riesgo pasa a alto. Verifica con la cédula y la fecha de nacimiento si es la misma persona; si no lo es, quítale la marca de lista negra. - Posible coincidencia : nombre parecido o contenido en el otro (por ejemplo, \"Juan Carlos González\" en la lista y \"Juan Carlos González Pérez\" como cliente). No se marca nada solo: revísalo a mano. - Sin coincidencias . Cada consulta queda en Cumplimiento → Consultas en listas (fecha, quién consultó, contra qué listas y el resultado), y la ficha del cliente muestra la última. Consultas en bases de datos desde la ficha (pestaña Conoce tu Cliente ): - Consultar en bases de datos compara al cliente y a su representante legal y beneficiarios finales con OFAC, ONU y las listas propias. El detalle sale por persona y por lista. Una coincidencia del representante o de un beneficiario avisa, pero no pone al cliente en lista negra. - Abrir INTERPOL abre la página oficial de Notificaciones Rojas: busque el nombre y pulse INTERPOL: sin resultados o INTERPOL: con resultados . Queda quién lo verificó y cuándo. - Certificado imprime la constancia de la consulta (INTERPOL, OFAC, ONU y listas propias con su resultado y una barra verde, amarilla o roja), para el expediente de debida diligencia. - La consulta se hace sola al crear un cliente, al agregarle un representante o beneficiario (si ya se había consultado) y al leer sus documentos de identidad.", "k": "tema"}, {"id": "cartera-clientes-y-debida-diligencia--conoce-tu-cliente-en-lote", "t": "Conoce tu Cliente en lote", "p": "Clientes, pólizas y reclamaciones › Clientes y debida diligencia", "b": "En la lista de clientes, selecciona varios y usa Acción → Conoce tu Cliente en lote : - Registrar formulario recibido : pone la fecha de recibido y el vencimiento (12 meses por defecto) a todos; opcionalmente fija el nivel de riesgo. - Enviar formulario para firma : envía por correo a cada cliente su formulario en PDF con los datos que tenemos, para que lo revise, firme y devuelva. Marca la fecha de remisión. Los clientes sin correo se indican y no se envían.", "k": "tema"}, {"id": "cartera-clientes-y-debida-diligencia", "t": "Clientes y debida diligencia", "p": "Clientes, pólizas y reclamaciones", "b": "1. Operación → Clientes → Nuevo . Indica si es persona o empresa y llena la cédula o el RNC. 2. Pestaña Seguros : tipo de cliente, ejecutivos asignados (se proponen en cada póliza nueva) y datos de identificación con su vencimiento . - Grupo deudor : si otra empresa responde por las primas de este cliente (la compañía madre), elígela aquí. El grupo muestra el botón Clientes del grupo y su lista. Es un solo nivel: un grupo no pertenece a otro grupo. Filtros Grupos deudores y Pertenecen a un grupo , y Agrupar por → Grupo deudor en la lista de clientes. 3. Pestaña Conoce tu Cliente : - perfil económico: profesión o cargo, actividad, ingresos, otros ingresos; - las preguntas PEP . Si cualquiera es sí , o si la profesión es un cargo PEP, el cliente queda marcado como PEP; - el formulario : fechas de remisión y recepción, y el PDF firmado. Al poner la fecha de recepción, el vencimiento se propone a un año. 4. El nivel de riesgo se calcula solo: - Alto : PEP, lista negra o actividad de riesgo (casinos, bancas, compraventa de vehículos…). - Medio : empresas, extranjeros o ingreso alto. - Bajo : el resto. Si el oficial de cumplimiento decide otro nivel, lo pone en Riesgo asignado . 5. Cumplimiento → Debida diligencia lista todos los clientes agrupados por riesgo. Los filtros muestran los KYC sin formulario, por vencer (30 días) o vencidos, las identificaciones vencidas, los PEP y la lista negra.", "k": "tema"}, {"id": "cartera-polizas--registrar-una-poliza", "t": "Registrar una póliza", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "1. Operación → Pólizas → Nuevo . 2. Número de póliza, cliente, aseguradora, ramo y tipo de producción (nueva o renovación). 3. Vigencia: al poner el inicio, el fin se propone a un año. Cámbialo si la póliza es a prorrata. 4. Montos: suma asegurada, prima neta y gastos administrativos. El impuesto y la prima bruta se calculan solos. 5. La comisión se toma de la tabla de la aseguradora. Se puede corregir en la póliza. 6. Pestaña Condiciones particulares → Agregar línea . Cada ítem lleva una descripción (\"Carro 1\", \"Consultorio 3\"), su suma asegurada y, si se quiere, el documento de la aseguradora (cuadro de coberturas, certificado o marbete): ese documento es el que vale y se abre desde el ítem. Según el ramo también pide: - vehículo : modelo (la marca y el tipo se llenan solos), año, color, chasis, placa y uso; - inmueble : ubicación, renglón, valor de edificación y contenido; - persona : asegurado y parentesco (vacío = titular). Las coberturas no se digitan : la póliza en PDF de la aseguradora (campo Póliza de la aseguradora , arriba en la póliza) y los documentos de cada ítem son la referencia. Si una corredora prefiere detallarlas, en Configuración → Ajustes → Pólizas se enciende Detallar coberturas por ítem : los ítems nuevos traen las coberturas del ramo para ajustar límites y deducibles. 7. Pestaña Ejecutivos : vienen los del cliente, con el porcentaje de su tabla. 8. Coaseguro (si aplica): una línea por aseguradora con su participación; deben sumar 100 % y una debe ser la líder. La comisión esperada se calcula sobre la parte de la líder. 9. Activar . La póliza pasa a Vigente .", "k": "tema"}, {"id": "cartera-polizas--renovar", "t": "Renovar", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "- Operación → Por renovar muestra lo que vence en los próximos 60 días, agrupado por mes. - Cada día el sistema crea una actividad Renovación de póliza para el responsable de las pólizas que vencen dentro del plazo configurado. - En la póliza, Renovar crea la del siguiente período en borrador, con los mismos ítems, coberturas, ejecutivos y coaseguro, y con las tasas de renovación . Ajusta prima y número si cambiaron y pulsa Activar : la anterior queda como Renovada . - Las pólizas marcadas como No renovable no generan aviso ni se pueden renovar.", "k": "tema"}, {"id": "cartera-polizas--renovacion-en-lote", "t": "Renovación en lote", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "Para renovar muchas pólizas a la vez: Operación → Renovación en lote . 1. Indica el período de vencimiento y, si quieres, la aseguradora, el ramo o el área → Buscar pólizas . Salen las vigentes o vencidas que no son No renovables y que aún no se han renovado. 2. En cada póliza captura la prima neta nueva : la línea se marca sola. Puedes cambiar también la suma asegurada y la fecha de emisión. 3. Con el módulo de Cobros instalado, escribe además el número de factura de la aseguradora y el NCF : se crea la factura de renovación ya confirmada, con sus cuotas. 4. Generar renovaciones crea la póliza de cada una con ítems, coberturas y ejecutivos, y con la tasa de renovación . Si dejaste marcado Activar , quedan vigentes y las anteriores pasan a Renovada .", "k": "tema"}, {"id": "cartera-polizas--traspaso-a-otro-cliente", "t": "Traspaso a otro cliente", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "En la póliza vigente, Traspasar → cliente destino, fecha efectiva y motivo. - La póliza pasa al cliente nuevo y el traspaso queda como movimiento en su historial. - Lo ya facturado sigue siendo del cliente original : él paga sus documentos pendientes. Lo que se emita después es del cliente nuevo. - Marca Usar los ejecutivos del cliente destino si la cuenta cambia de ejecutivo.", "k": "tema"}, {"id": "cartera-polizas--cambio-de-aseguradora", "t": "Cambio de aseguradora", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "Cuando el cliente se mueve a otra aseguradora: en la póliza vigente, Cambiar aseguradora . 1. Indica la aseguradora nueva, el número de la póliza nueva, la fecha efectiva y la prima. 2. En Prima a devolver va la prima no devengada que acredita la aseguradora actual. Es opcional. 3. Al confirmar: - se crea la póliza nueva con los mismos ítems, coberturas y ejecutivos, como producción nueva y con la tasa de la aseguradora nueva (el coaseguro no se copia); - la póliza actual se cancela con un movimiento de cancelación, que genera el crédito por la prima a devolver; - las dos pólizas quedan enlazadas en la pestaña Otros .", "k": "tema"}, {"id": "cartera-polizas--movimientos-endosos", "t": "Movimientos (endosos)", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "Para cambiar una póliza vigente: en la póliza, Registrar movimiento , o desde Operación → Movimientos . 1. Elige el tipo : - Inclusión : agrega ítems. En la pestaña Ítems a incluir llénalos igual que en la póliza. - Exclusión : quita ítems. Selecciónalos en Ítems a excluir . - Aumento o Disminución : cambia la suma asegurada. - Cancelación : termina la póliza. - Cambio de datos : no afecta la prima. 2. Indica la fecha efectiva , el número de endoso de la aseguradora, la variación de suma asegurada y la prima neta del movimiento , siempre en positivo: el tipo decide si suma o resta. En inclusiones y exclusiones, si dejas la suma en cero, se toma la de los ítems. 3. Aplicar : - los ítems incluidos se activan y los excluidos se archivan (no se borran: queda el historial); - la suma asegurada y la prima de la póliza se ajustan; - en una cancelación, la póliza queda Cancelada . 4. Un movimiento aplicado no se anula: si hubo un error, registra el movimiento contrario. Con el módulo de Cobros instalado, al aplicar se crea además el documento de prima en borrador: débito para inclusión o aumento, crédito para exclusión, disminución o cancelación.", "k": "tema"}, {"id": "cartera-polizas--asegurados-de-un-colectivo-salud-vida", "t": "Asegurados de un colectivo (salud, vida)", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "En pólizas de personas, la pestaña Condiciones particulares tiene el botón Importar asegurados . Sube el listado de la empresa en Excel o CSV, una fila por persona. Se reconocen las columnas Nombre, Cédula, Fecha de nacimiento, Sexo, Parentesco, Certificado, Prima y Suma asegurada , y además Departamento, Código empleado, Fecha inclusión y Cédula titular . El titular va con parentesco vacío o \"Titular\"; los dependientes (Cónyuge, Hijo, Padre/Madre…) quedan enlazados a su titular: al de la Cédula titular o, si la columna no viene, al titular que aparece antes en el listado. En cada asegurado se ve su Titular y, en la pestaña Beneficiarios , quién cobra un seguro de vida y en qué porcentaje (no pueden pasar de 100%). Si la persona ya existe (por cédula o nombre) se actualiza, no se duplica. Con Reemplazar el listado actual , quienes no vengan en el archivo se archivan (bajas del colectivo).", "k": "tema"}, {"id": "cartera-polizas--vencimiento-y-cancelacion", "t": "Vencimiento y cancelación", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "- Una póliza vigente cuyo fin de vigencia pasó sin renovarse se marca Vencida automáticamente. - Cancelar la saca de la cartera; Volver a borrador la reabre.", "k": "tema"}, {"id": "cartera-polizas--reportes", "t": "Reportes", "p": "Clientes, pólizas y reclamaciones › Pólizas", "b": "- En Pólizas , cambia a la vista pivote para ver la producción (prima bruta y comisión esperada) por aseguradora y mes. Agrupa por ramo, área, cliente o mes de vencimiento desde los filtros. - Para buscar por placa o chasis , escríbelos en la búsqueda de pólizas.", "k": "tema"}, {"id": "cartera-documentos-para-el-cliente--resumen-de-poliza", "t": "Resumen de póliza", "p": "Clientes, pólizas y reclamaciones › Documentos para el cliente", "b": "En la póliza: - Resumen PDF imprime el resumen: datos del asegurado, vigencia, montos, condiciones particulares con sus coberturas, cláusulas, endosos y ejecutivo. - Enviar resumen abre el correo al cliente con el PDF adjunto, usando la plantilla Seguros: resumen de póliza . Se puede editar el texto antes de enviar.", "k": "tema"}, {"id": "cartera-documentos-para-el-cliente--formulario-conoce-tu-cliente", "t": "Formulario Conoce tu Cliente", "p": "Clientes, pólizas y reclamaciones › Documentos para el cliente", "b": "En el contacto, pestaña Conoce tu Cliente , Generar formulario KYC imprime el Formulario de Conocimiento con el formato de la corredora, ya prellenado con la ficha: - Persona física : tipo de tercero, identificación, nacimiento, profesión y empresa donde labora, domicilio, a dónde enviar la información, actividad económica, ingresos mensuales, las cuatro preguntas PEP y el ramo solicitado. - Persona jurídica : información básica (RNC, razón social, nombre comercial, registro mercantil), domicilio legal y principal, tipo de empresa, procedencia de fondos si es ONG, sector y tipo de actividad, ingresos anuales, representante legal y beneficiarios finales (accionistas con 20% o más) y el ramo solicitado. - La declaración de veracidad, la autorización de verificación y cesión de información (leyes 172-13 y 155-17) y los recuadros de firma del cliente y del corredor. Los datos salen de la pestaña Conoce tu Cliente : tercero y solicitud, actividad económica, información financiera, domicilio principal y la lista Representante legal y beneficiarios finales (marque quién es representante y quién es beneficiario, con su % de participación). Los rangos de ingreso son los del formulario: mensuales para personas y anuales para empresas ( Configuración → Conoce tu Cliente → Rangos de ingreso , columna Aplica a ). Si el formulario no se había remitido antes, se marca la fecha de remisión. Cuando el cliente lo devuelva firmado, adjúntalo y pon la fecha de recepción.", "k": "tema"}, {"id": "cartera-documentos-para-el-cliente--remision-de-documentos", "t": "Remisión de documentos", "p": "Clientes, pólizas y reclamaciones › Documentos para el cliente", "b": "Para entregar documentos con acuse: en la póliza, Remitir documentos , o desde Operación → Remisión de documentos . 1. La lista se prepara sola con la póliza y un carnet o marbete por vehículo. Agrega o quita documentos y escribe una nota si hace falta. 2. Carta de remisión imprime la carta con el acuse de recibo al pie. 3. Marcar enviada . Cuando vuelva firmada, Registrar recepción con el nombre y la cédula de quien recibió, y adjunta el acuse escaneado. 4. El filtro Sin acuse muestra lo que falta por confirmar.", "k": "tema"}, {"id": "cartera-reportes", "t": "Reportes", "p": "Clientes, pólizas y reclamaciones", "b": "En Seguros → Reportes . Todos se pueden ver como gráfico, pivote o lista, cambiar filas y columnas, filtrar y descargar a Excel con el botón de descarga del pivote. Reporte Qué muestra Producción Prima bruta y comisión esperada de lo emitido por mes, nueva contra renovación. Cambia a aseguradora, ramo o ejecutivo. Cartera vigente Prima de las pólizas vigentes por ramo y aseguradora. Cartera por ejecutivo Prima y comisión vigente por ejecutivo principal y área. Vencimientos (90 días) Pólizas que vencen en los próximos 90 días, agrupadas por mes. Antigüedad de saldos Lo pendiente por cliente en al día, 1-30, 31-60, 61-90 y más de 90 días. Con pago fraccionado se mide cada cuota contra su vencimiento. Agrupa por moneda si manejas pesos y dólares. Cobros Lo cobrado por mes y aseguradora, recibos internos contra pagos directos. Comisiones Comisión esperada, recibida y a reclamar por aseguradora y mes. Comisiones de ejecutivos Lo que se le debe a cada ejecutivo por mes. Siniestralidad Lo reclamado y lo pagado por aseguradora, causa y mes. Comisiones proyectadas Comisión esperada de la cartera vigente por aseguradora y área (cambia a ramo o ejecutivo). Pólizas canceladas Pólizas canceladas agrupadas por aseguradora. Clientes sin póliza vigente Clientes y prospectos sin ninguna póliza vigente, para recuperar o venta cruzada. Clientes duplicados Clientes con el mismo RNC/cédula o el mismo nombre (sin contar puntuación ni \"SRL\"); revisa y fusiona. Ejecutivos duplicados Ejecutivos del mismo tipo con el mismo nombre (sin acentos ni puntuación) o el mismo contacto; una persona con dos roles no cuenta. Cumpleaños del mes Clientes que cumplen años este mes, por día, con teléfono y correo. Avisos enviados (Con Avisos a clientes) qué aviso se envió a quién, por qué canal y si falló.", "k": "tema"}, {"id": "cartera-reclamaciones--registrar-una-reclamacion", "t": "Registrar una reclamación", "p": "Clientes, pólizas y reclamaciones › Reclamaciones", "b": "1. Reclamaciones → Reclamaciones → Nuevo . 2. Cliente, fecha del incidente y póliza. Solo aparecen las pólizas del cliente, y el incidente tiene que caer dentro de su vigencia. 3. Pestaña Datos del daño : - el ítem afectado de las condiciones particulares (si la póliza tiene un solo ítem, se pone solo); - el tipo de reclamación (consulta médica, emergencia, vacunas, laboratorio, medicamentos, hospitalización, choque, robo, cristales, asistencia vial…), el lugar y cómo ocurrió. No hace falta tener las coberturas digitadas: basta el ítem o la persona y el tipo. La lista se mantiene en Configuración → Reclamaciones → Tipos de reclamación ; - si hubo daños a terceros, márcalo y describe a los afectados. 4. Pestaña Documentos : la lista de documentos requeridos se carga sola según el ramo. Por ejemplo, en vehículos pide acta policial, matrícula y licencia; en salud, informe médico y facturas. Marca lo recibido y adjunta el archivo. Arriba se ve cuántos obligatorios faltan. 5. Pestaña Participantes : ajustador o tasador, taller y abogado.", "k": "tema"}, {"id": "cartera-reclamaciones--flujo", "t": "Flujo", "p": "Clientes, pólizas y reclamaciones › Reclamaciones", "b": "- Notificar a la aseguradora : exige el ítem afectado si la póliza tiene condiciones particulares. Carta de notificación imprime la carta para la aseguradora con los datos del siniestro y los documentos anexos. - En ajuste mientras la aseguradora evalúa. - Aprobar : requiere el monto autorizado. - Registrar pago : monto pagado, fecha y forma de pago. - Declinada : requiere el motivo. - Cerrar cuando todo terminó. Reabrir vuelve a ajuste.", "k": "tema"}, {"id": "cartera-reclamaciones--valores", "t": "Valores", "p": "Clientes, pólizas y reclamaciones › Reclamaciones", "b": "- En Desglose van los conceptos (piezas, mano de obra, lesiones, grúa…) con lo reclamado y lo autorizado. Los totales se suman solos. Sin desglose, se escriben a mano. - A pagar por la aseguradora = autorizado − deducible. El balance pendiente se calcula contra lo pagado.", "k": "tema"}, {"id": "cartera-reclamaciones--cheques", "t": "Cheques", "p": "Clientes, pólizas y reclamaciones › Reclamaciones", "b": "Si la aseguradora paga con cheque que recibe la corredora: 1. Anota la fecha en Cheque recibido el . 2. Cuando lo entregues, anota la fecha y quién lo recibió. Reclamaciones → Cheques por entregar lista los pendientes. Una reclamación con cheque recibido no se cierra hasta registrar la entrega.", "k": "tema"}, {"id": "cartera-reclamaciones--seguimiento-y-estadistica", "t": "Seguimiento y estadística", "p": "Clientes, pólizas y reclamaciones › Reclamaciones", "b": "- Seguimiento muestra las reclamaciones abiertas en columnas por estado, con días abiertas. Los filtros sacan las que tienen documentos pendientes y las tuyas. - La vista pivote muestra lo reclamado y lo pagado por aseguradora y causa (siniestralidad). - En Configuración → Reclamaciones se mantienen las causas, los documentos requeridos (por ramo o área), los tipos de desglose y los ajustadores, talleres y abogados.", "k": "tema"}, {"id": "cartera-preguntas-frecuentes--por-que-la-poliza-no-trae-comision", "t": "¿Por qué la póliza no trae comisión?", "p": "Clientes, pólizas y reclamaciones › Preguntas frecuentes", "b": "No hay una tasa en la tabla de comisiones para esa aseguradora, ese ramo y ese tipo de producción. Cárgala y vuelve a seleccionar el ramo, o escribe el porcentaje en la póliza.", "k": "pregunta"}, {"id": "cartera-preguntas-frecuentes--por-que-un-cliente-sale-con-riesgo-alto-si-no-es-pep", "t": "¿Por qué un cliente sale con riesgo alto si no es PEP?", "p": "Clientes, pólizas y reclamaciones › Preguntas frecuentes", "b": "Revisa la actividad económica (algunas son de riesgo alto) y si está en lista negra.", "k": "pregunta"}, {"id": "cartera-preguntas-frecuentes--que-pasa-si-borro-una-cobertura-del-ramo", "t": "¿Qué pasa si borro una cobertura del ramo?", "p": "Clientes, pólizas y reclamaciones › Preguntas frecuentes", "b": "Las pólizas que ya la tienen la conservan. Para dejar de usarla, archívala en lugar de borrarla.", "k": "pregunta"}, {"id": "cartera-preguntas-frecuentes--donde-estan-las-facturas-de-prima-los-cobros-y-las-comisione", "t": "¿Dónde están las facturas de prima, los cobros y las comisiones recibidas?", "p": "Clientes, pólizas y reclamaciones › Preguntas frecuentes", "b": "En el menú Cobros y Comisiones : vea el manual Cobros y comisiones .", "k": "pregunta"}, {"id": "cartera", "t": "Clientes, pólizas y reclamaciones", "p": "Manual", "b": "Cartera, debida diligencia, pólizas, renovaciones, movimientos y reclamaciones. Esta aplicación lleva la cartera de una corredora de seguros: clientes con su debida diligencia, aseguradoras con sus tablas de comisión, y pólizas con sus condiciones particulares, renovaciones y vencimientos.", "k": "manual"}, {"id": "ventas-prospectos-registro-rapido", "t": "Prospectos (registro rápido)", "p": "Ventas y cotizaciones", "b": "Ventas → Prospectos es una lista para anotar rápido, con lo mínimo: empresa, persona de contacto, necesidad, tipo de cliente, producto (el área sale sola), teléfono y correo. Se escribe directo en la lista, sin abrir formularios. - Cotizar abre la cotización ya ligada al prospecto. - Convertir en cliente : cuando el prospecto dice que sí, crea el cliente (empresa o persona) con esos datos y su persona de contacto, listo para emitir. No hace falta pasar por la oportunidad ni la cotización si no se necesitan.", "k": "tema"}, {"id": "ventas-documentos-de-identidad-del-cliente-ficha-y-formulario-kyc-l", "t": "Documentos de identidad del cliente (ficha y formulario KYC llenos solos)", "p": "Ventas y cotizaciones", "b": "En la ficha del cliente, pestaña Conoce tu Cliente , arriba: 1. Arrastre al recuadro la cédula (frente y dorso), el pasaporte , la residencia , la licencia , el registro mercantil o el certificado de RNC (foto o PDF), o pulse Seleccionar documentos y elija varios a la vez. La ficha se guarda sola y cada archivo queda en la lista como Por leer . 2. Pulse Leer documentos y llenar la ficha . Se llenan los datos que estén vacíos : - Persona: cédula, pasaporte, residencia, fecha y lugar de nacimiento, país de nacimiento, nacionalidad, sexo, vencimiento de la identificación, profesión (si coincide con la lista) y dirección. - Empresa: RNC, registro mercantil y su vencimiento, actividad económica (si coincide con la lista) y dirección. 3. Lo que ya estaba escrito no se cambia. Si el documento dice otra cosa (otra fecha, otro nombre), queda en la columna Por revisar y en una nota de los mensajes, junto con la lista de lo que se llenó. También se anota el representante legal del registro mercantil y la profesión o actividad que no esté en la lista, para elegirla. 4. Generar formulario KYC sale ya con esos datos. Los documentos quedan guardados en la ficha como respaldo de la debida diligencia. Usa el mismo servicio de lectura y la misma clave que las cotizaciones.", "k": "tema"}, {"id": "ventas-oportunidades", "t": "Oportunidades", "p": "Ventas y cotizaciones", "b": "Son las ventas en curso, en un tablero por etapas: Prospecto, Calificado, Cotizando, Propuesta enviada, En emisión, Emitida . Arrastra la tarjeta entre etapas; las de cotización y emisión se mueven solas cuando avanzas la cotización. En la pestaña Seguro de la oportunidad: - Ramo de interés y prima estimada . Con la prima, el ingreso esperado se calcula con la comisión típica del ramo. - Su póliza actual : con qué aseguradora está y cuándo vence . Es la mejor fecha para cotizarle; el filtro Su póliza vence en 60 días y Pendientes del Inicio te las recuerdan. Desde la oportunidad se programan llamadas y reuniones (actividades) y se ven en Ventas → Calendario . Importar una campaña: en Oportunidades, menú ⚙ → Importar registros , con un Excel de nombre, empresa, teléfono, correo y RNC. Puedes indicar la campaña para medir de dónde vienen.", "k": "tema"}, {"id": "ventas-cotizaciones--slip-para-pedir-cotizaciones-a-las-aseguradoras", "t": "Slip para pedir cotizaciones a las aseguradoras", "p": "Ventas y cotizaciones › Cotizaciones", "b": "En la cotización, Slip para aseguradoras descarga un Excel con el formato de la corredora: - Primas : cada bien con su valor asegurado y la columna Prima neta para que la aseguradora la complete, con la prima total, el ISC y el total anual ya formulados. - Valores : el desglose de los bienes (marca, modelo, placa, chasis, ubicación, renglón). - Coberturas : las coberturas pedidas con su límite y la columna Propuesta de la aseguradora ; debajo, los deducibles pedidos. - Notas : las del ramo ( Configuración → Ramos , pestaña Slip de cotización , una por línea: validez de la oferta, inspección, cláusulas) más las de la cotización (pestaña Notas ). Cuando la aseguradora lo devuelve completado, se sube en Documentos de las aseguradoras y se lee como cualquier cotización.", "k": "tema"}, {"id": "ventas-cotizaciones", "t": "Cotizaciones", "p": "Ventas y cotizaciones", "b": "Botón Cotizar en la oportunidad (o Ventas → Cotizaciones → Nuevo): 1. Cliente o prospecto , contacto, ramo y moneda. Se proponen las coberturas típicas del ramo en Coberturas pedidas . 2. Vigencia : anual (un año desde la fecha efectiva; por defecto, el vencimiento de su póliza actual) o prorrata (eliges la fecha final). 3. Bienes a asegurar : vehículos (marca, modelo, año, chasis, placa), ubicaciones o personas, con su suma asegurada. 4. Opciones de aseguradoras , de dos maneras: - Leídas de los documentos (recomendado) : en la pestaña Documentos de las aseguradoras arrastre al recuadro las cotizaciones que enviaron (PDF, Excel, Word o foto), o pulse Seleccionar archivos y elija varias a la vez. La cotización se guarda sola y cada archivo queda en la lista como Por leer . También se leen los archivos que se arrastren a los mensajes de la cotización. Cuando estén todos, pulse Leer cotizaciones . Cada documento llena su opción: aseguradora, prima neta, impuesto, gastos, deducible, observaciones, las coberturas con sus límites y, si la trae, la prima por bien (por ejemplo, por vehículo de una flotilla). Si la aseguradora no está registrada, la opción lo dice y hay que elegirla. Para volver a leer un documento, use Leer en su fila. - A mano : una línea por aseguradora con la prima neta, gastos, deducible y observaciones. El impuesto sale del ramo (o del documento) y la comisión de la tabla de cada aseguradora. Marque la recomendada , y como Póliza actual la que el cliente tiene hoy si quiere compararla. 5. Revisar : las opciones leídas quedan por revisar (en amarillo). Abra cada una con Revisar , compare primas y coberturas con el documento de la aseguradora, corrija lo necesario y pulse Revisado (o Todas revisadas arriba). Mientras haya opciones por revisar, el comparativo no se imprime ni se envía: las aseguradoras a veces se equivocan y este es el punto de control. 6. Enviar por correo o Imprimir comparativo : el PDF (carta horizontal, con el logo y los colores de la corredora en la cabecera de cada página) trae: - Preparado para (cliente, RNC o cédula, contacto) y Lo que se asegura (seguro, bienes, valor asegurado, vigencia). - Una tarjeta por aseguradora con la prima total anual grande, prima neta, impuestos, deducible y observación. Las etiquetas Recomendada (la que marcó), Menor prima y Póliza actual salen solas; la recomendada va destacada. - Nuestra lectura : la diferencia de prima frente a la más barata y frente a la póliza actual. - Qué cubre cada una : coberturas lado a lado con su límite; No cubre en rojo y — cuando la aseguradora no lo indica. - Prima por bien (si la cotización la trae), las notas para el cliente, la validez de la oferta y los datos del ejecutivo responsable. La cotización pasa a Enviada al cliente . La lectura automática necesita la clave del servicio de lectura, que se configura en Configuración → Ajustes → Cotizaciones ; el consumo se cobra a la cuenta dueña de esa clave. Si no se concreta: Perdida (anota el motivo) o Cancelar ; ambas se pueden Reactivar .", "k": "tema"}, {"id": "ventas-emision-o-nombramiento", "t": "Emisión o nombramiento", "p": "Ventas y cotizaciones", "b": "Cuando el cliente decide, pulsa Elegir en la opción que aceptó. Hay dos caminos: Nombramiento (el cliente ya tiene la póliza con la aseguradora y nombra a la corredora): pulsa Nombramiento , escribe el número de la póliza, revisa vigencia y prima y, si la tienes, adjunta la póliza en PDF. La póliza queda vigente de una vez con lo negociado y la oportunidad, ganada . Emisión nueva (la aseguradora tiene que emitirla): 1. Solicitar emisión crea la póliza en borrador ( Solicitada a la aseguradora ) con esa aseguradora, prima, comisión, vigencia, bienes y los ejecutivos del cliente. Si el prospecto no era cliente, pasa a serlo. 2. Cuando la aseguradora confirma la cobertura, en la póliza pulsa Riesgo aceptado . 3. Cuando llegan la póliza y la factura, pulsa Recibir emisión : número de póliza real, número de factura y NCF, gastos administrativos, la vigencia o la prima si cambiaron, y adjunta la póliza y la factura en PDF . Confirmar emisión deja la póliza vigente con su PDF, crea su factura de prima con la factura adjunta y marca la oportunidad como ganada . (En la ventana, el primer campo es Póliza : la solicitud que se está recibiendo.) Leer documentos : con la póliza y/o la factura adjuntas, el botón llena solo el número de póliza, la factura, el NCF, la fecha, la vigencia, la prima neta y los gastos, y compara la póliza emitida con la cotización que aceptó el cliente : aseguradora, asegurado, prima neta y total, gastos, vigencia, suma asegurada, deducible y cada cobertura cotizada (si falta, si la excluye o si el límite cambió). Las diferencias salen en un aviso amarillo antes de confirmar y quedan en el historial de la póliza al confirmar; si coincide, sale en verde. Operación → Emisiones pendientes muestra todas las solicitudes que esperan a la aseguradora, agrupadas por responsable, con su etapa ( Solicitada o Riesgo aceptado ) y los días que llevan esperando. Las solicitudes sin recibir aparecen en Pendientes del Inicio ( Emisiones por recibir ), igual que las cotizaciones enviadas sin respuesta hace más de 7 días.", "k": "tema"}, {"id": "ventas-ventas-cruzadas", "t": "Ventas cruzadas", "p": "Ventas y cotizaciones", "b": "Ventas → Ventas cruzadas : elige los ramos que el cliente tiene (vacío = cualquiera) y el que no tiene (por ejemplo, tienen vehículo y no tienen salud), y si quieres una aseguradora. Buscar lista los clientes; desmarca los que no quieras y Crear oportunidades las genera en lote, asignadas a quien elijas y con la etiqueta Venta cruzada . Los clientes que ya tienen una oportunidad abierta de ese ramo no se repiten.", "k": "tema"}, {"id": "ventas-reportes", "t": "Reportes", "p": "Ventas y cotizaciones", "b": "- Seguimiento a cotizaciones : Ventas → Cotizaciones, vista de pivote por responsable y estado. - Riesgo aceptado / emisiones : filtro Emitidas o los estados Aceptada y En emisión . - Oportunidades : las vistas de lista, pivote y gráfico del CRM (por etapa, responsable, ramo o campaña).", "k": "tema"}, {"id": "ventas", "t": "Ventas y cotizaciones", "p": "Manual", "b": "Prospectos, oportunidades, cotizaciones con comparativo, emisión y nombramiento. Dónde: Seguros → Ventas (Oportunidades, Cotizaciones, Ventas cruzadas, Calendario). El flujo completo es: oportunidad → cotización → el cliente elige → solicitud de emisión → recepción de la emisión → póliza vigente con su factura .", "k": "manual"}, {"id": "cobros-la-idea-clave-dinero-de-terceros-vs-ingreso-de-la-corredora", "t": "La idea clave: dinero de terceros vs. ingreso de la corredora", "p": "Cobros y comisiones", "b": "Qué Dónde vive ¿Toca la contabilidad de la corredora? Factura, débito o crédito de prima de la aseguradora al cliente Seguros → Cobros → Documentos de prima No. Es una deuda del cliente con la aseguradora. Cobro de prima por la corredora (recibo interno) Recibos de cobro Sí : entra al banco contra el pasivo Primas por remesar . Cobro directo en la aseguradora Recibos de cobro (pago directo) No; solo baja el balance y genera la comisión esperada. Envío del dinero a la aseguradora Remesas Sí : sale del banco y salda Primas por remesar . Comisión que paga la aseguradora Recibos de ingreso de comisiones Sí : factura de la corredora a la aseguradora (su ingreso). Comisión de ejecutivos Liquidaciones Sí : factura de proveedor (gasto).", "k": "tema"}, {"id": "cobros-configuracion-inicial-administrador", "t": "Configuración inicial (administrador)", "p": "Cobros y comisiones", "b": "En Seguros → Configuración → Ajustes : - Los clientes pagan siempre a la aseguradora : actívalo si la corredora nunca recibe el dinero de la prima. Desaparecen los recibos internos, el menú Remesas , el atajo de remesa y la línea Cobrado por remesar del Inicio; todo recibo queda como pago directo (sin asiento) y no se crea la cuenta Primas por remesar . En contabilidad solo quedan la factura de comisión a la aseguradora, su cobro y lo de los ejecutivos. Las dos opciones siguientes se ocultan porque no aplican. - Primas por remesar : cuenta de pasivo. Si queda vacía, se crea sola la primera vez que se registra un recibo interno. - Modo de remesa : - Bruta : se envía la prima completa y la aseguradora paga la comisión aparte. - Neta : la corredora descuenta su comisión al remesar. - Comisión de corretaje : producto de la factura a la aseguradora. Viene sin ITBIS : la comisión es ingreso bruto y se declara en el impuesto sobre la renta. Pon ahí la cuenta de ingreso y, solo si el contador lo indica, algún impuesto. - Comisión de ejecutivos : producto de la factura de proveedor. Pon ahí las retenciones que apliquen y la cuenta de gasto. - Anticipos a ejecutivos : cuenta de activo para los adelantos (también se crea sola). En Configuración → Comisiones : - Conceptos de facturación : Emisión, Renovación, Inclusión, Cancelación… Cada uno dice si es factura, nota de débito o nota de crédito, y si genera comisión. - Montos adicionales : bonos, premios y descuentos que la aseguradora agrega en sus pagos.", "k": "tema"}, {"id": "cobros-documentos-de-prima--cuotas-de-prima", "t": "Cuotas de prima", "p": "Cobros y comisiones › Documentos de prima", "b": "Si la póliza se paga semestral, trimestral o mensual , al confirmar el documento se generan sus cuotas: 2, 4 o 12, a partir del vencimiento del documento o, si no lo tiene, del inicio de vigencia. - Lo cobrado cubre las cuotas en orden. Cada cuota muestra lo cubierto, lo pendiente y su estado. - El atraso del documento se mide contra la cuota más vieja sin cubrir , y se ve el monto vencido. - Mientras el documento no tenga cobros, Recalcular cuotas las rehace. También se pueden editar a mano. - Cobros → Cuotas pendientes lista todas las cuotas por cubrir, con filtros de vencidas y de las que vencen este mes.", "k": "tema"}, {"id": "cobros-documentos-de-prima--documentos-que-vienen-de-un-movimiento", "t": "Documentos que vienen de un movimiento", "p": "Cobros y comisiones › Documentos de prima", "b": "Al aplicar un movimiento de póliza se crea su documento en borrador , con la prima y el impuesto calculados. Cuando llegue el endoso de la aseguradora, ponle su número y su NCF y Confirmar . Seguimiento a cobros muestra los documentos con balance, agrupados por cliente. Los filtros separan las facturas vencidas y las que están en acuerdo de pago.", "k": "tema"}, {"id": "cobros-documentos-de-prima--facturacion-periodica-vida-y-salud", "t": "Facturación periódica (vida y salud)", "p": "Cobros y comisiones › Documentos de prima", "b": "Las aseguradoras facturan cada mes (o trimestre) las pólizas de salud y vida. Cobros → Facturación periódica : 1. Elige el mes y, si quieres, la aseguradora. Por defecto se buscan las pólizas de personas; cambia a Todas las pólizas de pago fraccionado para incluir otras. 2. Buscar lista las pólizas vigentes con un período que empieza ese mes y que aún no tienen factura de ese período. El monto propuesto es el de la última factura de la póliza (o la parte proporcional de la prima si nunca se ha facturado); puedes cambiarlo. 3. Escribe el número de factura de la aseguradora (y el NCF) en las que vas a facturar. 4. Generar facturas crea y confirma las facturas con número; las que dejaste sin número siguen pendientes para otra vez.", "k": "tema"}, {"id": "cobros-documentos-de-prima--polizas-declarativas", "t": "Pólizas declarativas", "p": "Cobros y comisiones › Documentos de prima", "b": "Para pólizas cuya prima depende de lo que el cliente declara cada período (inventario, ventas, carga). En la póliza, pestaña Declaraciones : marca Póliza declarativa , la tasa (%) y si se declara mensual o trimestral. Cada período agrega una línea con las fechas y el valor declarado ; la prima neta sale de valor × tasa y el impuesto del ramo (puedes ajustarlos). Escribe el número de factura de la aseguradora y pulsa Facturar . Las pólizas sin declaración del último período cerrado aparecen en Pendientes del Inicio y en Cobros → Declaraciones .", "k": "tema"}, {"id": "cobros-documentos-de-prima--tarjeta-domiciliada", "t": "Tarjeta domiciliada", "p": "Cobros y comisiones › Documentos de prima", "b": "En la póliza, pestaña Cobro con tarjeta : marca Tarjeta domiciliada y anota la marca, los últimos 4 dígitos , el vencimiento (MM/AA), el banco y el día de cargo. Por seguridad el número completo nunca se guarda en Odoo: queda en la autorización firmada por el cliente. Reportes → Tarjetas domiciliadas lista las pólizas vigentes que se cobran así (en rojo las tarjetas vencidas) y Pendientes del Inicio avisa las que vencen en 30 días.", "k": "tema"}, {"id": "cobros-documentos-de-prima", "t": "Documentos de prima", "p": "Cobros y comisiones", "b": "1. Desde la póliza, botón Registrar factura de prima . Se abre con la prima, el impuesto y la vigencia de la póliza. Pon el número y el NCF de la aseguradora y la fecha de vencimiento. 2. Confirmar : el documento queda Pendiente con su balance. 3. Notas de crédito de la aseguradora (cancelación, exclusión, descuento): 1. Créala con un concepto de tipo crédito y confírmala. 2. Distribuir crédito la reparte entre las facturas pendientes del cliente, de la más antigua a la más reciente. 3. Aplicar crédito baja el balance de esas facturas. 4. Enviar recordatorio manda un correo al cliente con el balance pendiente.", "k": "tema"}, {"id": "cobros-recibos-de-cobro--saldo-a-favor-creditos-por-aplicar", "t": "Saldo a favor (créditos por aplicar)", "p": "Cobros y comisiones › Recibos de cobro", "b": "Un recibo no tiene que aplicarse completo: - Pago de más o anticipo : si el cliente paga más que lo pendiente, o paga antes de que exista la factura, registra el recibo igual. Lo que no se aplica queda como saldo a favor . - Cobros → Créditos por aplicar lista los recibos con saldo. Para usarlo: abre el recibo → agrega el documento o pulsa Distribuir → Aplicar saldo . Genera su comisión esperada como cualquier cobro. - Desaplicar (botón en la línea de aplicación): quita un cobro de un documento y lo devuelve al saldo a favor. Sirve para reclasificar un pago que se aplicó a la factura equivocada. No se puede si ese cobro ya se remesó o si su comisión ya se concilió. - En contabilidad, el saldo a favor sigue en Primas por remesar a nombre del cliente: no se remesa hasta que se aplique. - El saldo a favor aparece en el contacto (botón Balance de primas ) y en el estado de cuenta.", "k": "tema"}, {"id": "cobros-recibos-de-cobro", "t": "Recibos de cobro", "p": "Cobros y comisiones", "b": "1. Nuevo . Elige el tipo (si los clientes pagan siempre a la aseguradora no se pregunta: es pago directo): - Recibo interno : el cliente le pagó a la corredora. Indica la caja o el banco. - Pago directo : el cliente pagó en la aseguradora. Es obligatorio el número de recibo de la aseguradora. 2. Cliente, aseguradora y monto. Arriba se ve el balance que el cliente tiene con esa aseguradora, y la pestaña Pendientes del cliente muestra todo lo que debe con todas las aseguradoras, para saber a qué corresponde el pago. - Fecha del pago : cuándo pagó el cliente según el recibo de la aseguradora. La fecha de registro es cuando se anota en el sistema; pueden ser distintas. - Tipo de pago : Abono o Saldo total . Se propone solo comparando el monto con el balance; se puede cambiar. - Comprobante : adjunta el recibo que envió la aseguradora. - El pago se reparte solo entre las facturas, de la más vieja a la más nueva; en la pestaña de aplicación se corrige a mano cuánto va a cada una. Si el cliente es un grupo deudor , el recibo cubre los documentos de todos los clientes del grupo. 3. Distribuir aplica el monto a los documentos pendientes, del más antiguo al más reciente. Puedes cambiar a mano cuánto va a cada uno. 4. Mientras no se registra, es un recibo provisional y ya se puede imprimir. 5. Registrar : - baja el balance de los documentos; - en un recibo interno, genera el asiento contra Primas por remesar ; - crea la comisión esperada : la parte de prima neta cobrada × la tasa de la póliza × la participación de la corredora si hay coaseguro. 6. Anular : solo si el recibo no está en una remesa ni en una conciliación procesada. Revierte el asiento y devuelve el balance. Es irreversible.", "k": "tema"}, {"id": "cobros-remesas", "t": "Remesas", "p": "Cobros y comisiones", "b": "1. Nuevo → aseguradora, banco de salida y fecha tope → Buscar cobros . Trae lo cobrado por la corredora y aplicado a documentos de esa aseguradora que aún no se ha remesado. El saldo a favor no se remesa. 2. Generar remesa crea el asiento: - débito a Primas por remesar por cliente; - crédito al banco por lo que sale; - en modo neto, crédito a la cuenta por cobrar de la aseguradora por la comisión retenida. 3. Cuando la aseguradora devuelva sus recibos, anota en cada línea el número y la fecha definitivos , y pulsa Confirmar recepción .", "k": "tema"}, {"id": "cobros-acuerdos-de-pago", "t": "Acuerdos de pago", "p": "Cobros y comisiones", "b": "1. Nuevo → cliente, aseguradora, moneda → Cargar pendientes (puedes quitar documentos). 2. Tipo: - Convenio de ley (120 días) : inicial del 25 % + 3 cuotas mensuales; - Convenio especial : tú defines inicial, cantidad de cuotas y frecuencia; - Pago total : una sola cuota. 3. Calcular cuotas → revisa fechas y montos → Grabar acuerdo . 4. Los cobros que entren a esos documentos van cubriendo las cuotas en orden. Si se pasa la fecha de una cuota sin cubrirse, el acuerdo sale como Atrasado .", "k": "tema"}, {"id": "cobros-comisiones-de-la-corredora--recibo-de-ingreso-y-conciliacion", "t": "Recibo de ingreso y conciliación", "p": "Cobros y comisiones › Comisiones de la corredora", "b": "1. Comisiones → Recibos de ingreso → Nuevo . 2. Datos: - aseguradora; - monto del estado de cuenta (lo que la aseguradora reconoce, incluida la comisión ya retenida si remesas neto); - banco donde llegó el dinero; - rango de fechas de los cobros. Puedes adjuntar el estado de cuenta. 3. Conciliar comisiones trae las esperadas del período, con Recibido = Esperado . 4. Revisa línea por línea: - N/A : no corresponde a este pago; queda libre para otra conciliación. - Aceptada : recibiste menos de lo esperado y la diferencia queda a reclamar . - Aceptada con diferencia : aceptas lo pagado y la diferencia se da por perdida. Corrige el Recibido cuando la aseguradora pagó otro monto. 5. Montos adicionales : bonos y premios en positivo, descuentos en negativo. 6. El botón Procesar aparece solo cuando Por cuadrar es cero. Al procesar: - se crea y publica la factura de comisión a la aseguradora, con una línea por ramo y una por cada monto adicional; - se registra el pago de la parte que llegó al banco y se cruza con lo que ya se había retenido en remesas; - las líneas aceptadas se bloquean; - se calculan las comisiones de los ejecutivos . 7. Anular cancela la factura y el pago, y libera las comisiones. No se puede si ya se liquidaron comisiones de ejecutivos de esa conciliación. Reportes: en Comisiones esperadas , la vista pivote muestra lo esperado, lo recibido y lo reclamado por aseguradora y mes. El filtro Con monto a reclamar sirve para preparar los reclamos a la aseguradora.", "k": "tema"}, {"id": "cobros-comisiones-de-la-corredora", "t": "Comisiones de la corredora", "p": "Cobros y comisiones", "b": "Comisiones esperadas lista lo que la aseguradora debería pagar. Mientras no estén conciliadas, puedes corregir sus tasas: selecciona varias filas y cambia el porcentaje de una vez.", "k": "tema"}, {"id": "cobros-ejecutivos--plantilla-de-conciliacion", "t": "Plantilla de conciliación", "p": "Cobros y comisiones › Ejecutivos", "b": "En el recibo de ingreso, después de Conciliar comisiones , Descargar plantilla baja un Excel con una fila por comisión (póliza, cliente, documento, recibo, prima cobrada, % y comisión esperada). Llena la columna Recibido (o envíala a la aseguradora para que la llene), adjúntala en Plantilla con lo recibido y pulsa Importar lo recibido : cada comisión toma su monto.", "k": "tema"}, {"id": "cobros-ejecutivos",
