<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Manual de Seguros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Centro de ayuda: banda petróleo con el buscador arriba; abajo, manuales o lectura con índice lateral. */
:root {
  --bg: #F6F8F8;
  --surface: #FFFFFF;
  --band: #173C4A;
  --band-deep: #0B1F27;
  --on-band: #F3F7F7;
  --on-band-soft: #B9CDD1;
  --fg: #232628;
  --muted: #55636A;
  --line: #D6E1E3;
  --sky: #E4ECEC;
  --accent: #A05434;
  --accent-soft: #F4E3D9;
  --route-bg: #EAF1F2;
  --route-fg: #173C4A;
  --mark: #F7D9C6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A1F; --surface: #14242B; --band: #0B1F27; --band-deep: #07151A; --on-band: #EEF4F4; --on-band-soft: #9DB6BB;
    --fg: #E3EAEB; --muted: #9DADB2; --line: #26404A; --sky: #1A2F37; --accent: #E7B79C; --accent-soft: #3A2A22;
    --route-bg: #1C3640; --route-fg: #CFE2E5; --mark: #5A3A2A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A1F; --surface: #14242B; --band: #0B1F27; --band-deep: #07151A; --on-band: #EEF4F4; --on-band-soft: #9DB6BB;
  --fg: #E3EAEB; --muted: #9DADB2; --line: #26404A; --sky: #1A2F37; --accent: #E7B79C; --accent-soft: #3A2A22;
  --route-bg: #1C3640; --route-fg: #CFE2E5; --mark: #5A3A2A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Banda superior con el buscador */
.band { background: var(--band); color: var(--on-band); }
.band .wrap { padding-block: 28px 30px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand a { text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.45rem; margin: 0; letter-spacing: -0.01em; }
.brand .tag { color: var(--on-band-soft); font-size: .9rem; }
.band.home .wrap { padding-block: 40px 44px; }
.band.home .lead { font-family: var(--display); font-size: clamp(1.7rem, 4.2vw, 2.6rem); line-height: 1.12; font-weight: 700; margin: 6px 0 0; max-width: 22ch; text-wrap: balance; letter-spacing: -0.015em; }
.band:not(.home) .lead { display: none; }
.search { position: relative; max-width: 760px; }
.search input { width: 100%; font: inherit; font-size: 1.08rem; padding: 16px 52px 16px 20px; border-radius: 999px; border: 2px solid transparent; background: var(--surface); color: var(--fg); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.search input:focus { outline: none; border-color: var(--accent); }
.search kbd { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 600 .78rem var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { font: 500 .9rem var(--body); color: var(--on-band); background: transparent; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chips button:hover { background: rgba(255,255,255,.1); border-color: var(--on-band-soft); }
.band:not(.home) .chips { display: none; }

main .wrap { padding-block: 32px 64px; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
h2.title { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }

/* Inicio: recorrido + manuales */
.journey { margin-bottom: 40px; }
.steps { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; }
.steps a { display: grid; gap: 4px; height: 100%; padding: 14px 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, transform .15s; }
.steps a::before { content: counter(s); font: 700 .8rem var(--body); color: var(--accent); }
.steps a:hover { border-color: var(--accent); transform: translateY(-2px); }
.steps strong { font-weight: 600; line-height: 1.3; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
.card { display: grid; gap: 6px; align-content: start; padding: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s; }
.card:hover { border-color: var(--band); }
.card h3 { font-family: var(--display); font-size: 1.15rem; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; }
.card .count { font-size: .82rem; color: var(--accent); font-weight: 600; margin-top: 6px; }

/* Resultados */
.results { display: grid; gap: 10px; margin-top: 16px; }
.result { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.result:hover, .result.sel { border-color: var(--accent); }
.result .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.badge { font-weight: 700; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sky); color: var(--route-fg); }
.badge.pregunta { background: var(--accent-soft); color: var(--accent); }
.result h3 { margin: 0; font-size: 1.08rem; font-weight: 700; }
.result p { margin: 0; color: var(--muted); font-size: .95rem; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.empty { padding: 28px; border-radius: var(--radius); border: 1px dashed var(--line); color: var(--muted); }

/* Lectura */
.reader { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; font-size: .93rem; }
.toc .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-weight: 600; }
.toc .back:hover { color: var(--accent); }
.toc h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 10px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: block; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); }
.toc a:hover { background: var(--sky); color: var(--fg); }
.toc a.on { background: var(--route-bg); color: var(--route-fg); font-weight: 600; }
.toc .others { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.toc select { display: none; }
article { min-width: 0; max-width: 760px; }
article .intro { color: var(--muted); font-size: 1.05rem; }
article section { padding-top: 28px; margin-top: 28px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
article section h3 { font-family: var(--display); font-size: 1.4rem; margin: 0 0 10px; letter-spacing: -0.01em; text-wrap: balance; }
article h4 { font-size: 1.08rem; margin: 26px 0 6px; scroll-margin-top: 16px; }
article p, article li { max-width: 68ch; }
article ul, article ol { padding-left: 1.3em; }
article li { margin: 4px 0; }
article li::marker { color: var(--accent); }
article code { font-size: .9em; background: var(--sky); padding: 1px 5px; border-radius: 5px; }
.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--sky); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
/* Rutas de menú: Seguros → Ventas → Prospectos */
.route { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; background: var(--route-bg); color: var(--route-fg); border-radius: 8px; padding: 1px 8px; font-weight: 600; font-size: .94em; }
.route i { font-style: normal; color: var(--accent); font-weight: 700; }
.where { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--mark); } 100% { background: transparent; } }
footer { color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }
footer .wrap { padding-block: 20px 32px; }

@media (max-width: 820px) {
  .reader { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .toc { position: static; max-height: none; }
  .toc ol, .toc .others, .toc h3 { display: none; }
  .toc select { display: block; width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .search kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<header class="band home" id="band">
  <div class="wrap">
    <div class="brand">
      <a href="#inicio"><h1>Manual de Seguros</h1><span class="tag">Corredora de seguros · guía de uso</span></a>
    </div>
    <p class="lead">¿Qué necesita hacer hoy?</p>
    <div class="search" role="search">
      <label for="q" class="sr" hidden>Buscar en el manual</label>
      <input id="q" type="search" autocomplete="off" placeholder="Busque un tema o pregunta: renovar en lote, cobrar una cuota…" aria-label="Buscar en el manual">
      <kbd>/</kbd>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">Manual de usuario del sistema de seguros. Las rutas de menú se leen dentro de la app <b>Seguros</b>.</div></footer>

<script>
const DATA = {"chapters": [{"id": "guia", "title": "Guía rápida", "summary": "Dónde se hace cada paso, de prospecto a renovación.", "intro": "<p>El recorrido completo de un cliente, de prospecto a renovación, con el menú donde se hace cada paso. Todo está dentro de la app <strong>Seguros<\/strong>.<\/p>", "sections": [{"id": "guia-prospecto-y-cliente-nuevo", "title": "Prospecto y cliente nuevo", "html": "<p><strong>Dónde:<\/strong> Seguros → Ventas → <strong>Prospectos<\/strong>.<\/p>\n<ol>\n<li>Escriba el prospecto directamente en la lista: nombre, teléfono, ramo y tipo de cliente. No hace falta abrir ningún formulario.<\/li>\n<li>Cuando el prospecto acepta, ábralo y pulse <strong>Convertir en cliente<\/strong>: se crea el cliente con esos datos.<\/li>\n<li>Las oportunidades en curso se siguen en Seguros → Ventas → <strong>Oportunidades<\/strong>.<\/li>\n<\/ol>", "subs": []}, {"id": "guia-formulario-conoce-tu-cliente", "title": "Formulario Conoce tu Cliente", "html": "<p><strong>Dónde:<\/strong> ficha del cliente (Seguros → Operación → <strong>Clientes<\/strong>), pestaña <strong>Conoce tu Cliente<\/strong>.<\/p>\n<p>En la sección <em>Formulario Conoce tu Cliente<\/em> se registran las fechas de envío, recibido y vencimiento, y se sube el formulario firmado. El estado (al día, por vencer, vencido) se ve en la ficha y en Cumplimiento → <strong>Debida diligencia<\/strong>.<\/p>", "subs": []}, {"id": "guia-cotizacion-y-comparativo", "title": "Cotización y comparativo", "html": "<p><strong>Dónde:<\/strong> Seguros → Ventas → <strong>Cotizaciones<\/strong>.<\/p>\n<ol>\n<li>En la pestaña <strong>Documentos de las aseguradoras<\/strong>, arrastre al recuadro lo que mandó cada aseguradora (PDF, Excel, Word o foto), o pulse <strong>Seleccionar archivos<\/strong> y elija varios a la vez. La cotización se guarda sola y cada archivo queda como <em>Por leer<\/em>.<\/li>\n<li>Pulse <strong>Leer cotizaciones<\/strong>. Cada documento llena su opción con prima neta, impuestos, total, coberturas y prima por bien.<\/li>\n<li>Cada opción leída queda <strong>Por revisar<\/strong>. Use <strong>Revisar<\/strong> en la fila para confirmar los números y pulse <strong>Revisado<\/strong>; o <strong>Todas revisadas<\/strong> en el aviso amarillo.<\/li>\n<li>Si el cliente ya tiene póliza, marque esa opción como <strong>Póliza actual<\/strong>: el comparativo mostrará cuánto ahorra o cuánto sube.<\/li>\n<li><strong>Imprimir<\/strong> o <strong>Enviar<\/strong> genera el comparativo horizontal: resumen económico, diferencia de prima, comparación de coberturas y prima neta por bien.<\/li>\n<\/ol>\n<p>No se puede imprimir ni enviar mientras haya opciones sin revisar o sin aseguradora. Si una cotización viene de una aseguradora que no está registrada, regístrela en Seguros → Operación → <strong>Aseguradoras<\/strong> y elíjala en la opción.<\/p>", "subs": []}, {"id": "guia-emision-o-nombramiento", "title": "Emisión o nombramiento", "html": "<p><strong>Dónde:<\/strong> botones arriba de la cotización aceptada.<\/p>\n<ul>\n<li><strong>Solicitar emisión:<\/strong> crea la póliza en borrador para pedirla a la aseguradora. Aparece en Seguros → Operación → <strong>Emisiones pendientes<\/strong>, con los días que lleva esperando.<\/li>\n<li>En la póliza, cuando la aseguradora confirma, pulse <strong>Riesgo aceptado<\/strong>.<\/li>\n<li>Cuando llega la póliza, pulse <strong>Recibir emisión<\/strong> y suba el PDF de la póliza y el de la factura.<\/li>\n<li><strong>Nombramiento:<\/strong> para un cliente que ya tiene su póliza y nombra a la corredora. La póliza queda vigente directamente.<\/li>\n<\/ul>", "subs": []}, {"id": "guia-carta-de-despacho", "title": "Carta de despacho", "html": "<p><strong>Dónde:<\/strong> botón <strong>Carta de despacho<\/strong> en la póliza vigente.<\/p>\n<p>Sale en PDF o en Word, con el texto de emisión o de renovación. Desde la lista de pólizas se pueden seleccionar varias del mismo cliente para una sola carta.<\/p>", "subs": []}, {"id": "guia-cobro-de-la-prima", "title": "Cobro de la prima", "html": "<p><strong>Dónde:<\/strong> Seguros → Cobros → <strong>Recibos de cobro<\/strong>.<\/p>\n<ul>\n<li><strong>Fecha del pago:<\/strong> el día que pagó el cliente. <strong>Fecha de registro:<\/strong> el día que se registró en el sistema.<\/li>\n<li>El recibo indica si es <strong>abono<\/strong> o <strong>pago total<\/strong> y guarda el comprobante.<\/li>\n<li>La pestaña <strong>Pendientes del cliente<\/strong> muestra lo que aún debe.<\/li>\n<\/ul>", "subs": []}, {"id": "guia-grupo-deudor-empresa-que-paga-por-varios-clientes", "title": "Grupo deudor (empresa que paga por varios clientes)", "html": "<p><strong>Dónde:<\/strong> ficha del cliente, pestaña <strong>Seguros<\/strong>, campo <strong>Grupo deudor<\/strong>.<\/p>\n<p>Ponga ahí la empresa que paga por ese cliente. La ficha de la empresa muestra sus <strong>Clientes del grupo<\/strong>, su estado de cuenta sale como <strong>Estado de cuenta del grupo<\/strong>, y un solo recibo de la empresa puede cobrar documentos de todos los miembros.<\/p>", "subs": []}, {"id": "guia-comisiones", "title": "Comisiones", "html": "<p><strong>Dónde:<\/strong> Seguros → <strong>Comisiones<\/strong> → Recibos de ingreso, Comisiones esperadas, Comisiones de ejecutivos y Liquidaciones.<\/p>", "subs": []}, {"id": "guia-renovacion", "title": "Renovación", "html": "<p><strong>Dónde:<\/strong> Seguros → Operación → <strong>Por renovar<\/strong> (una a una) o <strong>Renovación en lote<\/strong>.<\/p>", "subs": []}, {"id": "guia-reclamaciones", "title": "Reclamaciones", "html": "<p><strong>Dónde:<\/strong> Seguros → <strong>Reclamaciones<\/strong>. El tipo de reclamación (consulta, emergencia, vacunas, laboratorio, medicamentos, maternidad, odontología, asistencia vial, equipos eléctricos…) se elige al registrarla; la lista se mantiene en Configuración → Reclamaciones → <strong>Tipos de reclamación<\/strong>.<\/p>", "subs": []}, {"id": "guia-ajustes-del-administrador", "title": "Ajustes del administrador", "html": "<p><strong>Dónde:<\/strong> Seguros → Configuración → <strong>Ajustes<\/strong>.<\/p>\n<ul>\n<li><strong>Pólizas:<\/strong> activa las coberturas por cada bien asegurado.<\/li>\n<li><strong>Cotizaciones:<\/strong> la clave del servicio de lectura de cotizaciones. Cada corredora puede poner la suya.<\/li>\n<\/ul>", "subs": []}]}, {"id": "cartera", "title": "Clientes, pólizas y reclamaciones", "summary": "Cartera, debida diligencia, pólizas, renovaciones, movimientos y reclamaciones.", "intro": "<p>Esta aplicación lleva la cartera de una corredora de seguros: clientes con su debida\ndiligencia, aseguradoras con sus tablas de comisión, y pólizas con sus condiciones\nparticulares, renovaciones y vencimientos.<\/p>", "sections": [{"id": "cartera-conceptos", "title": "Conceptos", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Concepto<\/th>\n<th>Qué es<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ramo<\/strong><\/td>\n<td>El tipo de seguro: Vehículos de motor, Incendio, Salud… Define qué datos se piden de lo asegurado y qué coberturas se precargan.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cobertura<\/strong><\/td>\n<td>Lo que cubre la póliza (Daños a la propiedad ajena, Terremoto…). Se agrupan por categoría de ramo.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tabla de comisiones<\/strong><\/td>\n<td>Cuánto paga cada aseguradora a la corredora por ramo, distinto si la póliza es <strong>nueva<\/strong> o <strong>renovación<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ejecutivo<\/strong><\/td>\n<td>Quien trae o atiende al cliente (ejecutivo de negocios, agente, referido). Tiene su propia tabla de comisiones.<\/td>\n<\/tr>\n<tr>\n<td><strong>Condiciones particulares<\/strong><\/td>\n<td>Los ítems asegurados de una póliza: vehículos, ubicaciones, personas. Cada uno con sus coberturas.<\/td>\n<\/tr>\n<tr>\n<td><strong>Conoce tu Cliente (KYC)<\/strong><\/td>\n<td>La información de debida diligencia que exige la ley de prevención de lavado.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "subs": []}, {"id": "cartera-inicio", "title": "Inicio", "html": "<p>Al abrir la app <strong>Seguros<\/strong> se ve <strong>Inicio<\/strong>. Todos los montos están en la moneda de la\ncompañía.<\/p>\n<p>Si hay pólizas en otra moneda, se convierten a la tasa del día y el Inicio lo indica.\nRespeta el modo claro u oscuro de Odoo.<\/p>\n<ul>\n<li><strong>Buscar<\/strong>: escribe un número de póliza, nombre de cliente o RNC/cédula y pulsa Intro.<\/li>\n<li><strong>Registrar<\/strong>: crea una póliza, cliente, movimiento, cobro, remesa, conciliación de\n  comisiones o reclamación, o abre la renovación en lote. El botón circular actualiza los datos.<\/li>\n<li><strong>Pulso<\/strong>, la franja de arriba: cartera vigente, por cobrar a clientes (la barra roja es la\n  parte vencida), comisión por conciliar con las aseguradoras y prima que se renueva en 90\n  días. Cada cifra abre su lista.<\/li>\n<li><strong>Calendario de vencimientos<\/strong>: 13 semanas día por día, desde el lunes de esta semana.\n  Mientras más oscuro el día, más prima vence ese día; el número son las pólizas. Hoy tiene\n  borde y los días pasados se ven tenues. Pulsa un día para ver sus pólizas.<\/li>\n<li><strong>Próximas renovaciones<\/strong>: las siete pólizas que vencen primero, con cliente, aseguradora,\n  ramo, prima y días que faltan (en rojo si faltan 15 días o menos). Pulsa una para abrirla.<\/li>\n<li><strong>Pendientes<\/strong>: agrupados por Cobros, Cartera, Cumplimiento y Reclamaciones; el punto rojo\n  es urgente, el ámbar es para esta semana. Si no hay nada, lo indica.<\/li>\n<li><strong>Producción<\/strong>: prima emitida por mes en 12 meses, nuevas y renovaciones, con la línea de\n  comisiones recibidas.<\/li>\n<li><strong>Aseguradoras<\/strong>: prima vigente por compañía y su porcentaje de la cartera.<\/li>\n<li><strong>Antigüedad del balance<\/strong> (con el módulo de Cobros): al día, 1-30, 31-60, 61-90 y más de 90\n  días, más cobrado por remesar, saldo a favor, comisión a reclamar, acuerdos vigentes y lo\n  cobrado en el mes.<\/li>\n<li><strong>Clientes<\/strong>: personas y empresas, y la distribución por nivel de riesgo.<\/li>\n<li><strong>Reclamaciones<\/strong>: abiertas, monto reclamado, pagado en el año y cuántas hay en cada estado.<\/li>\n<\/ul>", "subs": []}, {"id": "cartera-primeros-pasos-administrador", "title": "Primeros pasos (administrador)", "html": "<ol>\n<li><strong>Seguros → Configuración → Seguros → Ramos<\/strong>: revisa el catálogo base. Ajusta el\n   <strong>impuesto<\/strong> de cada ramo; los de salud y vida vienen en 0 hasta que el contador confirme\n   el tratamiento fiscal.<\/li>\n<li><strong>Seguros → Operación → Aseguradoras<\/strong>: crea cada aseguradora (marca <em>Es aseguradora<\/em>). En\n   su pestaña <strong>Aseguradora<\/strong> carga la tabla de comisiones.\n   - Para cargar o corregir muchas tasas de una vez, usa <strong>Configuración → Comisiones →\n     Tabla de comisiones<\/strong>: filtra por aseguradora o ramo, selecciona varias filas y cambia\n     el porcentaje en una sola.<\/li>\n<li><strong>Configuración → Comisiones → Ejecutivos<\/strong>: crea los ejecutivos. Asígnales un <strong>usuario<\/strong>\n   para que les lleguen los avisos de renovación, y carga su tabla de comisiones. Deja la\n   aseguradora vacía para que la tasa aplique a todas.<\/li>\n<li><strong>Configuración → Ajustes<\/strong>: define con cuántos días de anticipación se avisa una\n   renovación (por defecto, 30).<\/li>\n<\/ol>", "subs": []}, {"id": "cartera-clientes-y-debida-diligencia", "title": "Clientes y debida diligencia", "html": "<ol>\n<li><strong>Operación → Clientes → Nuevo<\/strong>. Indica si es persona o empresa y llena la cédula o el RNC.<\/li>\n<li>Pestaña <strong>Seguros<\/strong>: tipo de cliente, ejecutivos asignados (se proponen en cada póliza\n   nueva) y datos de identificación con su <strong>vencimiento<\/strong>.\n   - <strong>Grupo deudor<\/strong>: si otra empresa responde por las primas de este cliente (la compañía\n     madre), elígela aquí. El grupo muestra el botón <strong>Clientes del grupo<\/strong> y su lista. Es un\n     solo nivel: un grupo no pertenece a otro grupo. Filtros <em>Grupos deudores<\/em> y <em>Pertenecen\n     a un grupo<\/em>, y <em>Agrupar por → Grupo deudor<\/em> en la lista de clientes.<\/li>\n<li>Pestaña <strong>Conoce tu Cliente<\/strong>:\n   - perfil económico: profesión o cargo, actividad, ingresos, otros ingresos;\n   - las preguntas <strong>PEP<\/strong>. Si cualquiera es <em>sí<\/em>, o si la profesión es un cargo PEP, el\n     cliente queda marcado como PEP;\n   - el <strong>formulario<\/strong>: fechas de remisión y recepción, y el PDF firmado. Al poner la fecha de\n     recepción, el vencimiento se propone a un año.<\/li>\n<li>El <strong>nivel de riesgo<\/strong> se calcula solo:\n   - <strong>Alto<\/strong>: PEP, lista negra o actividad de riesgo (casinos, bancas, compraventa de\n     vehículos…).\n   - <strong>Medio<\/strong>: empresas, extranjeros o ingreso alto.\n   - <strong>Bajo<\/strong>: el resto.<\/li>\n<\/ol>\n<p>Si el oficial de cumplimiento decide otro nivel, lo pone en <em>Riesgo asignado<\/em>.\n5. <strong>Cumplimiento → Debida diligencia<\/strong> lista todos los clientes agrupados por riesgo. Los\n   filtros muestran los KYC sin formulario, por vencer (30 días) o vencidos, las\n   identificaciones vencidas, los PEP y la lista negra.<\/p><h4 id=\"cartera-clientes-y-debida-diligencia--listas-restrictivas\">Listas restrictivas<\/h4><p>En <strong>Cumplimiento → Listas restrictivas<\/strong> están las listas contra las que se verifica a los\nclientes:<\/p>\n<ul>\n<li><strong>OFAC - Lista SDN<\/strong> (sanciones del Tesoro de EE.UU.): pulsa <strong>Actualizar lista<\/strong> para\n  descargarla. Se puede programar para que se actualice sola cada semana.<\/li>\n<li><strong>ONU - Lista consolidada del Consejo de Seguridad<\/strong>: personas, entidades y sus alias; también\n  con <strong>Actualizar lista<\/strong> (la misma tarea programada actualiza OFAC y ONU).<\/li>\n<li><strong>INTERPOL<\/strong> (Notificaciones Rojas) no permite consultas automáticas: se verifica en su página\n  oficial y se registra el resultado (ver abajo).<\/li>\n<li><strong>Listas propias<\/strong>: crea una, elige <em>Archivo propio (CSV)<\/em>, adjunta un CSV con el nombre en la\n  primera columna (y, opcional, el documento en la segunda) y pulsa <strong>Actualizar lista<\/strong>. Sirve\n  para listas de la UAF, de la Superintendencia o internas.<\/li>\n<\/ul>\n<p>Para verificar, en la lista de clientes (o en la ficha) usa <strong>Acción → Verificar en listas\nrestrictivas<\/strong>. Se compara el nombre sin importar acentos, el orden de las palabras ni \"SRL\" o\n\"S.A.\":<\/p>\n<ul>\n<li><strong>Coincidencia<\/strong>: el nombre completo es el mismo (sin importar orden, acentos ni \"SRL\"). El\n  cliente queda en <strong>lista negra<\/strong> con el motivo y su riesgo pasa a alto. Verifica con la cédula\n  y la fecha de nacimiento si es la misma persona; si no lo es, quítale la marca de lista negra.<\/li>\n<li><strong>Posible coincidencia<\/strong>: nombre parecido o contenido en el otro (por ejemplo, \"Juan Carlos\n  González\" en la lista y \"Juan Carlos González Pérez\" como cliente). No se marca nada solo:\n  revísalo a mano.<\/li>\n<li><strong>Sin coincidencias<\/strong>.<\/li>\n<\/ul>\n<p>Cada consulta queda en <strong>Cumplimiento → Consultas en listas<\/strong> (fecha, quién consultó, contra qué\nlistas y el resultado), y la ficha del cliente muestra la última.<\/p>\n<p><strong>Consultas en bases de datos desde la ficha<\/strong> (pestaña <em>Conoce tu Cliente<\/em>):<\/p>\n<ul>\n<li><strong>Consultar en bases de datos<\/strong> compara al cliente <strong>y a su representante legal y beneficiarios\n  finales<\/strong> con OFAC, ONU y las listas propias. El detalle sale por persona y por lista. Una\n  coincidencia del representante o de un beneficiario avisa, pero no pone al cliente en lista negra.<\/li>\n<li><strong>Abrir INTERPOL<\/strong> abre la página oficial de Notificaciones Rojas: busque el nombre y pulse\n  <strong>INTERPOL: sin resultados<\/strong> o <strong>INTERPOL: con resultados<\/strong>. Queda quién lo verificó y cuándo.<\/li>\n<li><strong>Certificado<\/strong> imprime la constancia de la consulta (INTERPOL, OFAC, ONU y listas propias con su\n  resultado y una barra verde, amarilla o roja), para el expediente de debida diligencia.<\/li>\n<li>La consulta se hace <strong>sola<\/strong> al crear un cliente, al agregarle un representante o beneficiario\n  (si ya se había consultado) y al leer sus documentos de identidad.<\/li>\n<\/ul><h4 id=\"cartera-clientes-y-debida-diligencia--conoce-tu-cliente-en-lote\">Conoce tu Cliente en lote<\/h4><p>En la lista de clientes, selecciona varios y usa <strong>Acción → Conoce tu Cliente en lote<\/strong>:<\/p>\n<ul>\n<li><strong>Registrar formulario recibido<\/strong>: pone la fecha de recibido y el vencimiento (12 meses\n  por defecto) a todos; opcionalmente fija el nivel de riesgo.<\/li>\n<li><strong>Enviar formulario para firma<\/strong>: envía por correo a cada cliente su formulario en PDF con\n  los datos que tenemos, para que lo revise, firme y devuelva. Marca la fecha de remisión.\n  Los clientes sin correo se indican y no se envían.<\/li>\n<\/ul>", "subs": [{"id": "cartera-clientes-y-debida-diligencia--listas-restrictivas", "title": "Listas restrictivas"}, {"id": "cartera-clientes-y-debida-diligencia--conoce-tu-cliente-en-lote", "title": "Conoce tu Cliente en lote"}]}, {"id": "cartera-polizas", "title": "Pólizas", "html": "<h4 id=\"cartera-polizas--registrar-una-poliza\">Registrar una póliza<\/h4><ol>\n<li><strong>Operación → Pólizas → Nuevo<\/strong>.<\/li>\n<li>Número de póliza, cliente, aseguradora, ramo y tipo de producción (nueva o renovación).<\/li>\n<li>Vigencia: al poner el inicio, el fin se propone a un año. Cámbialo si la póliza es a\n   prorrata.<\/li>\n<li>Montos: suma asegurada, prima neta y gastos administrativos. El <strong>impuesto<\/strong> y la <strong>prima\n   bruta<\/strong> se calculan solos.<\/li>\n<li>La <strong>comisión<\/strong> se toma de la tabla de la aseguradora. Se puede corregir en la póliza.<\/li>\n<li>Pestaña <strong>Condiciones particulares<\/strong> → <em>Agregar línea<\/em>. Cada ítem lleva una descripción\n   (\"Carro 1\", \"Consultorio 3\"), su <strong>suma asegurada<\/strong> y, si se quiere, el <strong>documento de la\n   aseguradora<\/strong> (cuadro de coberturas, certificado o marbete): ese documento es el que vale y se\n   abre desde el ítem. Según el ramo también pide:\n   - <strong>vehículo<\/strong>: modelo (la marca y el tipo se llenan solos), año, color, chasis, placa y\n     uso;\n   - <strong>inmueble<\/strong>: ubicación, renglón, valor de edificación y contenido;\n   - <strong>persona<\/strong>: asegurado y parentesco (vacío = titular).<\/li>\n<\/ol>\n<p>Las coberturas <strong>no se digitan<\/strong>: la póliza en PDF de la aseguradora (campo <em>Póliza de la\n   aseguradora<\/em>, arriba en la póliza) y los documentos de cada ítem son la referencia. Si una\n   corredora prefiere detallarlas, en <strong>Configuración → Ajustes → Pólizas<\/strong> se enciende\n   <em>Detallar coberturas por ítem<\/em>: los ítems nuevos traen las coberturas del ramo para ajustar\n   límites y deducibles.\n7. Pestaña <strong>Ejecutivos<\/strong>: vienen los del cliente, con el porcentaje de su tabla.\n8. <strong>Coaseguro<\/strong> (si aplica): una línea por aseguradora con su participación; deben sumar\n   100 % y una debe ser la líder. La comisión esperada se calcula sobre la parte de la líder.\n9. <strong>Activar<\/strong>. La póliza pasa a <em>Vigente<\/em>.<\/p><h4 id=\"cartera-polizas--renovar\">Renovar<\/h4><ul>\n<li><strong>Operación → Por renovar<\/strong> muestra lo que vence en los próximos 60 días, agrupado por mes.<\/li>\n<li>Cada día el sistema crea una actividad <strong>Renovación de póliza<\/strong> para el responsable de las\n  pólizas que vencen dentro del plazo configurado.<\/li>\n<li>En la póliza, <strong>Renovar<\/strong> crea la del siguiente período en borrador, con los mismos ítems,\n  coberturas, ejecutivos y coaseguro, y con las <strong>tasas de renovación<\/strong>. Ajusta prima y\n  número si cambiaron y pulsa <strong>Activar<\/strong>: la anterior queda como <em>Renovada<\/em>.<\/li>\n<li>Las pólizas marcadas como <strong>No renovable<\/strong> no generan aviso ni se pueden renovar.<\/li>\n<\/ul><h4 id=\"cartera-polizas--renovacion-en-lote\">Renovación en lote<\/h4><p>Para renovar muchas pólizas a la vez: <strong>Operación → Renovación en lote<\/strong>.<\/p>\n<ol>\n<li>Indica el período de vencimiento y, si quieres, la aseguradora, el ramo o el área →\n   <strong>Buscar pólizas<\/strong>. Salen las vigentes o vencidas que no son <em>No renovables<\/em> y que aún no\n   se han renovado.<\/li>\n<li>En cada póliza captura la <strong>prima neta nueva<\/strong>: la línea se marca sola. Puedes cambiar\n   también la suma asegurada y la fecha de emisión.<\/li>\n<li>Con el módulo de Cobros instalado, escribe además el <strong>número de factura<\/strong> de la\n   aseguradora y el <strong>NCF<\/strong>: se crea la factura de renovación ya confirmada, con sus cuotas.<\/li>\n<li><strong>Generar renovaciones<\/strong> crea la póliza de cada una con ítems, coberturas y ejecutivos, y\n   con la <strong>tasa de renovación<\/strong>. Si dejaste marcado <em>Activar<\/em>, quedan vigentes y las\n   anteriores pasan a <em>Renovada<\/em>.<\/li>\n<\/ol><h4 id=\"cartera-polizas--traspaso-a-otro-cliente\">Traspaso a otro cliente<\/h4><p>En la póliza vigente, <strong>Traspasar<\/strong> → cliente destino, fecha efectiva y motivo.<\/p>\n<ul>\n<li>La póliza pasa al cliente nuevo y el traspaso queda como movimiento en su historial.<\/li>\n<li>Lo ya facturado <strong>sigue siendo del cliente original<\/strong>: él paga sus documentos pendientes. Lo\n  que se emita después es del cliente nuevo.<\/li>\n<li>Marca <em>Usar los ejecutivos del cliente destino<\/em> si la cuenta cambia de ejecutivo.<\/li>\n<\/ul><h4 id=\"cartera-polizas--cambio-de-aseguradora\">Cambio de aseguradora<\/h4><p>Cuando el cliente se mueve a otra aseguradora: en la póliza vigente, <strong>Cambiar aseguradora<\/strong>.<\/p>\n<ol>\n<li>Indica la aseguradora nueva, el número de la póliza nueva, la fecha efectiva y la prima.<\/li>\n<li>En <em>Prima a devolver<\/em> va la prima no devengada que acredita la aseguradora actual. Es\n   opcional.<\/li>\n<li>Al confirmar:\n   - se crea la póliza nueva con los mismos ítems, coberturas y ejecutivos, como producción\n     <strong>nueva<\/strong> y con la tasa de la aseguradora nueva (el coaseguro no se copia);\n   - la póliza actual se <strong>cancela<\/strong> con un movimiento de cancelación, que genera el crédito\n     por la prima a devolver;\n   - las dos pólizas quedan enlazadas en la pestaña <em>Otros<\/em>.<\/li>\n<\/ol><h4 id=\"cartera-polizas--movimientos-endosos\">Movimientos (endosos)<\/h4><p>Para cambiar una póliza vigente: en la póliza, <strong>Registrar movimiento<\/strong>, o desde\n<strong>Operación → Movimientos<\/strong>.<\/p>\n<ol>\n<li>Elige el <strong>tipo<\/strong>:\n   - <em>Inclusión<\/em>: agrega ítems. En la pestaña <em>Ítems a incluir<\/em> llénalos igual que en la\n     póliza.\n   - <em>Exclusión<\/em>: quita ítems. Selecciónalos en <em>Ítems a excluir<\/em>.\n   - <em>Aumento<\/em> o <em>Disminución<\/em>: cambia la suma asegurada.\n   - <em>Cancelación<\/em>: termina la póliza.\n   - <em>Cambio de datos<\/em>: no afecta la prima.<\/li>\n<li>Indica la <strong>fecha efectiva<\/strong>, el <strong>número de endoso<\/strong> de la aseguradora, la variación de suma\n   asegurada y la <strong>prima neta del movimiento<\/strong>, siempre en positivo: el tipo decide si suma o\n   resta. En inclusiones y exclusiones, si dejas la suma en cero, se toma la de los ítems.<\/li>\n<li><strong>Aplicar<\/strong>:\n   - los ítems incluidos se activan y los excluidos se archivan (no se borran: queda el\n     historial);\n   - la suma asegurada y la prima de la póliza se ajustan;\n   - en una cancelación, la póliza queda <em>Cancelada<\/em>.<\/li>\n<li>Un movimiento aplicado no se anula: si hubo un error, registra el movimiento contrario.<\/li>\n<\/ol>\n<p>Con el módulo de Cobros instalado, al aplicar se crea además el <strong>documento de prima<\/strong> en\nborrador: débito para inclusión o aumento, crédito para exclusión, disminución o cancelación.<\/p><h4 id=\"cartera-polizas--asegurados-de-un-colectivo-salud-vida\">Asegurados de un colectivo (salud, vida)<\/h4><p>En pólizas de personas, la pestaña <strong>Condiciones particulares<\/strong> tiene el botón <strong>Importar\nasegurados<\/strong>. Sube el listado de la empresa en Excel o CSV, una fila por persona. Se reconocen\nlas columnas <em>Nombre, Cédula, Fecha de nacimiento, Sexo, Parentesco, Certificado, Prima<\/em> y\n<em>Suma asegurada<\/em>, y además <em>Departamento, Código empleado, Fecha inclusión<\/em> y <em>Cédula titular<\/em>.\nEl titular va con parentesco vacío o \"Titular\"; los dependientes (Cónyuge, Hijo, Padre/Madre…)\nquedan enlazados a su titular: al de la <em>Cédula titular<\/em> o, si la columna no viene, al titular\nque aparece antes en el listado. En cada asegurado se ve su <strong>Titular<\/strong> y, en la pestaña\n<strong>Beneficiarios<\/strong>, quién cobra un seguro de vida y en qué porcentaje (no pueden pasar de 100%).<\/p>\n<p>Si la persona ya existe (por cédula o nombre) se actualiza, no se duplica. Con <strong>Reemplazar el\nlistado actual<\/strong>, quienes no vengan en el archivo se archivan (bajas del colectivo).<\/p><h4 id=\"cartera-polizas--vencimiento-y-cancelacion\">Vencimiento y cancelación<\/h4><ul>\n<li>Una póliza vigente cuyo fin de vigencia pasó sin renovarse se marca <strong>Vencida<\/strong>\n  automáticamente.<\/li>\n<li><strong>Cancelar<\/strong> la saca de la cartera; <strong>Volver a borrador<\/strong> la reabre.<\/li>\n<\/ul><h4 id=\"cartera-polizas--reportes\">Reportes<\/h4><ul>\n<li>En <strong>Pólizas<\/strong>, cambia a la vista <strong>pivote<\/strong> para ver la producción (prima bruta y comisión\n  esperada) por aseguradora y mes. Agrupa por ramo, área, cliente o mes de vencimiento desde\n  los filtros.<\/li>\n<li>Para buscar por <strong>placa o chasis<\/strong>, escríbelos en la búsqueda de pólizas.<\/li>\n<\/ul>", "subs": [{"id": "cartera-polizas--registrar-una-poliza", "title": "Registrar una póliza"}, {"id": "cartera-polizas--renovar", "title": "Renovar"}, {"id": "cartera-polizas--renovacion-en-lote", "title": "Renovación en lote"}, {"id": "cartera-polizas--traspaso-a-otro-cliente", "title": "Traspaso a otro cliente"}, {"id": "cartera-polizas--cambio-de-aseguradora", "title": "Cambio de aseguradora"}, {"id": "cartera-polizas--movimientos-endosos", "title": "Movimientos (endosos)"}, {"id": "cartera-polizas--asegurados-de-un-colectivo-salud-vida", "title": "Asegurados de un colectivo (salud, vida)"}, {"id": "cartera-polizas--vencimiento-y-cancelacion", "title": "Vencimiento y cancelación"}, {"id": "cartera-polizas--reportes", "title": "Reportes"}]}, {"id": "cartera-documentos-para-el-cliente", "title": "Documentos para el cliente", "html": "<h4 id=\"cartera-documentos-para-el-cliente--resumen-de-poliza\">Resumen de póliza<\/h4><p>En la póliza:\n- <strong>Resumen PDF<\/strong> imprime el resumen: datos del asegurado, vigencia, montos, condiciones\n  particulares con sus coberturas, cláusulas, endosos y ejecutivo.\n- <strong>Enviar resumen<\/strong> abre el correo al cliente con el PDF adjunto, usando la plantilla\n  <em>Seguros: resumen de póliza<\/em>. Se puede editar el texto antes de enviar.<\/p><h4 id=\"cartera-documentos-para-el-cliente--formulario-conoce-tu-cliente\">Formulario Conoce tu Cliente<\/h4><p>En el contacto, pestaña <em>Conoce tu Cliente<\/em>, <strong>Generar formulario KYC<\/strong> imprime el <strong>Formulario de\nConocimiento<\/strong> con el formato de la corredora, ya prellenado con la ficha:\n- <strong>Persona física<\/strong>: tipo de tercero, identificación, nacimiento, profesión y empresa donde labora,\n  domicilio, a dónde enviar la información, actividad económica, ingresos mensuales, las cuatro\n  preguntas PEP y el ramo solicitado.\n- <strong>Persona jurídica<\/strong>: información básica (RNC, razón social, nombre comercial, registro mercantil),\n  domicilio legal y principal, tipo de empresa, procedencia de fondos si es ONG, sector y tipo de\n  actividad, ingresos anuales, <strong>representante legal<\/strong> y <strong>beneficiarios finales<\/strong> (accionistas con\n  20% o más) y el ramo solicitado.\n- La declaración de veracidad, la autorización de verificación y cesión de información (leyes 172-13\n  y 155-17) y los recuadros de firma del cliente y del corredor.<\/p>\n<p>Los datos salen de la pestaña <em>Conoce tu Cliente<\/em>: tercero y solicitud, actividad económica,\ninformación financiera, domicilio principal y la lista <strong>Representante legal y beneficiarios\nfinales<\/strong> (marque quién es representante y quién es beneficiario, con su % de participación). Los\nrangos de ingreso son los del formulario: mensuales para personas y anuales para empresas\n(<em>Configuración → Conoce tu Cliente → Rangos de ingreso<\/em>, columna <em>Aplica a<\/em>).<\/p>\n<p>Si el formulario no se había remitido antes, se marca la fecha de remisión. Cuando el cliente\nlo devuelva firmado, adjúntalo y pon la fecha de recepción.<\/p><h4 id=\"cartera-documentos-para-el-cliente--remision-de-documentos\">Remisión de documentos<\/h4><p>Para entregar documentos con acuse: en la póliza, <strong>Remitir documentos<\/strong>, o desde\n<strong>Operación → Remisión de documentos<\/strong>.<\/p>\n<ol>\n<li>La lista se prepara sola con la póliza y un carnet o marbete por vehículo. Agrega o quita\n   documentos y escribe una nota si hace falta.<\/li>\n<li><strong>Carta de remisión<\/strong> imprime la carta con el acuse de recibo al pie.<\/li>\n<li><strong>Marcar enviada<\/strong>. Cuando vuelva firmada, <strong>Registrar recepción<\/strong> con el nombre y la\n   cédula de quien recibió, y adjunta el acuse escaneado.<\/li>\n<li>El filtro <em>Sin acuse<\/em> muestra lo que falta por confirmar.<\/li>\n<\/ol>", "subs": [{"id": "cartera-documentos-para-el-cliente--resumen-de-poliza", "title": "Resumen de póliza"}, {"id": "cartera-documentos-para-el-cliente--formulario-conoce-tu-cliente", "title": "Formulario Conoce tu Cliente"}, {"id": "cartera-documentos-para-el-cliente--remision-de-documentos", "title": "Remisión de documentos"}]}, {"id": "cartera-reportes", "title": "Reportes", "html": "<p>En <strong>Seguros → Reportes<\/strong>. Todos se pueden ver como gráfico, pivote o lista, cambiar\nfilas y columnas, filtrar y <strong>descargar a Excel<\/strong> con el botón de descarga del pivote.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Reporte<\/th>\n<th>Qué muestra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Producción<\/strong><\/td>\n<td>Prima bruta y comisión esperada de lo emitido por mes, nueva contra renovación. Cambia a aseguradora, ramo o ejecutivo.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cartera vigente<\/strong><\/td>\n<td>Prima de las pólizas vigentes por ramo y aseguradora.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cartera por ejecutivo<\/strong><\/td>\n<td>Prima y comisión vigente por ejecutivo principal y área.<\/td>\n<\/tr>\n<tr>\n<td><strong>Vencimientos (90 días)<\/strong><\/td>\n<td>Pólizas que vencen en los próximos 90 días, agrupadas por mes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Antigüedad de saldos<\/strong><\/td>\n<td>Lo pendiente por cliente en al día, 1-30, 31-60, 61-90 y más de 90 días. Con pago fraccionado se mide cada cuota contra su vencimiento. Agrupa por moneda si manejas pesos y dólares.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cobros<\/strong><\/td>\n<td>Lo cobrado por mes y aseguradora, recibos internos contra pagos directos.<\/td>\n<\/tr>\n<tr>\n<td><strong>Comisiones<\/strong><\/td>\n<td>Comisión esperada, recibida y a reclamar por aseguradora y mes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Comisiones de ejecutivos<\/strong><\/td>\n<td>Lo que se le debe a cada ejecutivo por mes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Siniestralidad<\/strong><\/td>\n<td>Lo reclamado y lo pagado por aseguradora, causa y mes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Comisiones proyectadas<\/strong><\/td>\n<td>Comisión esperada de la cartera vigente por aseguradora y área (cambia a ramo o ejecutivo).<\/td>\n<\/tr>\n<tr>\n<td><strong>Pólizas canceladas<\/strong><\/td>\n<td>Pólizas canceladas agrupadas por aseguradora.<\/td>\n<\/tr>\n<tr>\n<td><strong>Clientes sin póliza vigente<\/strong><\/td>\n<td>Clientes y prospectos sin ninguna póliza vigente, para recuperar o venta cruzada.<\/td>\n<\/tr>\n<tr>\n<td><strong>Clientes duplicados<\/strong><\/td>\n<td>Clientes con el mismo RNC/cédula o el mismo nombre (sin contar puntuación ni \"SRL\"); revisa y fusiona.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ejecutivos duplicados<\/strong><\/td>\n<td>Ejecutivos del mismo tipo con el mismo nombre (sin acentos ni puntuación) o el mismo contacto; una persona con dos roles no cuenta.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cumpleaños del mes<\/strong><\/td>\n<td>Clientes que cumplen años este mes, por día, con teléfono y correo.<\/td>\n<\/tr>\n<tr>\n<td><strong>Avisos enviados<\/strong><\/td>\n<td>(Con Avisos a clientes) qué aviso se envió a quién, por qué canal y si falló.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "subs": []}, {"id": "cartera-reclamaciones", "title": "Reclamaciones", "html": "<h4 id=\"cartera-reclamaciones--registrar-una-reclamacion\">Registrar una reclamación<\/h4><ol>\n<li><strong>Reclamaciones → Reclamaciones → Nuevo<\/strong>.<\/li>\n<li>Cliente, fecha del incidente y póliza. Solo aparecen las pólizas del cliente, y el incidente\n   tiene que caer dentro de su vigencia.<\/li>\n<li>Pestaña <strong>Datos del daño<\/strong>:\n   - el <strong>ítem afectado<\/strong> de las condiciones particulares (si la póliza tiene un solo ítem, se\n     pone solo);\n   - el <strong>tipo de reclamación<\/strong> (consulta médica, emergencia, vacunas, laboratorio,\n     medicamentos, hospitalización, choque, robo, cristales, asistencia vial…), el lugar y\n     cómo ocurrió. No hace falta tener las coberturas digitadas: basta el ítem o la persona y el\n     tipo. La lista se mantiene en <strong>Configuración → Reclamaciones → Tipos de reclamación<\/strong>;\n   - si hubo daños a terceros, márcalo y describe a los afectados.<\/li>\n<li>Pestaña <strong>Documentos<\/strong>: la lista de documentos requeridos se carga sola según el ramo. Por\n   ejemplo, en vehículos pide acta policial, matrícula y licencia; en salud, informe médico y\n   facturas. Marca lo recibido y adjunta el archivo. Arriba se ve cuántos obligatorios faltan.<\/li>\n<li>Pestaña <strong>Participantes<\/strong>: ajustador o tasador, taller y abogado.<\/li>\n<\/ol><h4 id=\"cartera-reclamaciones--flujo\">Flujo<\/h4><ul>\n<li><strong>Notificar a la aseguradora<\/strong>: exige el ítem afectado si la póliza tiene condiciones\n  particulares. <strong>Carta de notificación<\/strong> imprime la carta para la aseguradora con los datos\n  del siniestro y los documentos anexos.<\/li>\n<li><strong>En ajuste<\/strong> mientras la aseguradora evalúa.<\/li>\n<li><strong>Aprobar<\/strong>: requiere el monto autorizado.<\/li>\n<li><strong>Registrar pago<\/strong>: monto pagado, fecha y forma de pago.<\/li>\n<li><strong>Declinada<\/strong>: requiere el motivo.<\/li>\n<li><strong>Cerrar<\/strong> cuando todo terminó. <strong>Reabrir<\/strong> vuelve a ajuste.<\/li>\n<\/ul><h4 id=\"cartera-reclamaciones--valores\">Valores<\/h4><ul>\n<li>En <strong>Desglose<\/strong> van los conceptos (piezas, mano de obra, lesiones, grúa…) con lo reclamado y\n  lo autorizado. Los totales se suman solos. Sin desglose, se escriben a mano.<\/li>\n<li><strong>A pagar por la aseguradora<\/strong> = autorizado − deducible. El <strong>balance pendiente<\/strong> se calcula\n  contra lo pagado.<\/li>\n<\/ul><h4 id=\"cartera-reclamaciones--cheques\">Cheques<\/h4><p>Si la aseguradora paga con cheque que recibe la corredora:\n1. Anota la fecha en <em>Cheque recibido el<\/em>.\n2. Cuando lo entregues, anota la fecha y quién lo recibió.<\/p>\n<p><strong>Reclamaciones → Cheques por entregar<\/strong> lista los pendientes. Una reclamación con cheque\nrecibido no se cierra hasta registrar la entrega.<\/p><h4 id=\"cartera-reclamaciones--seguimiento-y-estadistica\">Seguimiento y estadística<\/h4><ul>\n<li><strong>Seguimiento<\/strong> muestra las reclamaciones abiertas en columnas por estado, con días abiertas.\n  Los filtros sacan las que tienen documentos pendientes y las tuyas.<\/li>\n<li>La vista <strong>pivote<\/strong> muestra lo reclamado y lo pagado por aseguradora y causa (siniestralidad).<\/li>\n<li>En <strong>Configuración → Reclamaciones<\/strong> se mantienen las causas, los documentos requeridos (por\n  ramo o área), los tipos de desglose y los ajustadores, talleres y abogados.<\/li>\n<\/ul>", "subs": [{"id": "cartera-reclamaciones--registrar-una-reclamacion", "title": "Registrar una reclamación"}, {"id": "cartera-reclamaciones--flujo", "title": "Flujo"}, {"id": "cartera-reclamaciones--valores", "title": "Valores"}, {"id": "cartera-reclamaciones--cheques", "title": "Cheques"}, {"id": "cartera-reclamaciones--seguimiento-y-estadistica", "title": "Seguimiento y estadística"}]}, {"id": "cartera-preguntas-frecuentes", "title": "Preguntas frecuentes", "html": "<p><strong id=\"cartera-preguntas-frecuentes--por-que-la-poliza-no-trae-comision\">¿Por qué la póliza no trae comisión?<\/strong> No hay una tasa en la tabla de comisiones para esa\naseguradora, ese ramo y ese tipo de producción. Cárgala y vuelve a seleccionar el ramo, o\nescribe el porcentaje en la póliza.<\/p>\n<p><strong id=\"cartera-preguntas-frecuentes--por-que-un-cliente-sale-con-riesgo-alto-si-no-es-pep\">¿Por qué un cliente sale con riesgo alto si no es PEP?<\/strong> Revisa la actividad económica\n(algunas son de riesgo alto) y si está en lista negra.<\/p>\n<p><strong id=\"cartera-preguntas-frecuentes--que-pasa-si-borro-una-cobertura-del-ramo\">¿Qué pasa si borro una cobertura del ramo?<\/strong> Las pólizas que ya la tienen la conservan. Para\ndejar de usarla, archívala en lugar de borrarla.<\/p>\n<p><strong id=\"cartera-preguntas-frecuentes--donde-estan-las-facturas-de-prima-los-cobros-y-las-comisione\">¿Dónde están las facturas de prima, los cobros y las comisiones recibidas?<\/strong> En el menú <strong>Cobros<\/strong> y <strong>Comisiones<\/strong>: vea el manual <em>Cobros y comisiones<\/em>.<\/p>", "subs": []}]}, {"id": "ventas", "title": "Ventas y cotizaciones", "summary": "Prospectos, oportunidades, cotizaciones con comparativo, emisión y nombramiento.", "intro": "<p><strong>Dónde:<\/strong> Seguros → <strong>Ventas<\/strong> (Oportunidades, Cotizaciones, Ventas cruzadas, Calendario).<\/p>\n<p>El flujo completo es: <strong>oportunidad → cotización → el cliente elige → solicitud de emisión →\nrecepción de la emisión → póliza vigente con su factura<\/strong>.<\/p>", "sections": [{"id": "ventas-prospectos-registro-rapido", "title": "Prospectos (registro rápido)", "html": "<p><strong>Ventas → Prospectos<\/strong> es una lista para anotar rápido, con lo mínimo: empresa, persona de\ncontacto, necesidad, tipo de cliente, producto (el área sale sola), teléfono y correo. Se escribe\ndirecto en la lista, sin abrir formularios.<\/p>\n<ul>\n<li><strong>Cotizar<\/strong> abre la cotización ya ligada al prospecto.<\/li>\n<li><strong>Convertir en cliente<\/strong>: cuando el prospecto dice que sí, crea el cliente (empresa o persona)\n  con esos datos y su persona de contacto, listo para emitir. No hace falta pasar por la\n  oportunidad ni la cotización si no se necesitan.<\/li>\n<\/ul>", "subs": []}, {"id": "ventas-documentos-de-identidad-del-cliente-ficha-y-formulario-kyc-l", "title": "Documentos de identidad del cliente (ficha y formulario KYC llenos solos)", "html": "<p>En la ficha del cliente, pestaña <strong>Conoce tu Cliente<\/strong>, arriba:<\/p>\n<ol>\n<li>Arrastre al recuadro la <strong>cédula<\/strong> (frente y dorso), el <strong>pasaporte<\/strong>, la <strong>residencia<\/strong>, la\n   <strong>licencia<\/strong>, el <strong>registro mercantil<\/strong> o el <strong>certificado de RNC<\/strong> (foto o PDF), o pulse\n   <strong>Seleccionar documentos<\/strong> y elija varios a la vez. La ficha se guarda sola y cada archivo queda\n   en la lista como <em>Por leer<\/em>.<\/li>\n<li>Pulse <strong>Leer documentos y llenar la ficha<\/strong>. Se llenan los datos <strong>que estén vacíos<\/strong>:\n   - Persona: cédula, pasaporte, residencia, fecha y lugar de nacimiento, país de nacimiento,\n     nacionalidad, sexo, vencimiento de la identificación, profesión (si coincide con la lista) y\n     dirección.\n   - Empresa: RNC, registro mercantil y su vencimiento, actividad económica (si coincide con la\n     lista) y dirección.<\/li>\n<li><strong>Lo que ya estaba escrito no se cambia.<\/strong> Si el documento dice otra cosa (otra fecha, otro\n   nombre), queda en la columna <em>Por revisar<\/em> y en una nota de los mensajes, junto con la lista de lo\n   que se llenó. También se anota el representante legal del registro mercantil y la profesión o\n   actividad que no esté en la lista, para elegirla.<\/li>\n<li><strong>Generar formulario KYC<\/strong> sale ya con esos datos. Los documentos quedan guardados en la ficha\n   como respaldo de la debida diligencia.<\/li>\n<\/ol>\n<p>Usa el mismo servicio de lectura y la misma clave que las cotizaciones.<\/p>", "subs": []}, {"id": "ventas-oportunidades", "title": "Oportunidades", "html": "<p>Son las ventas en curso, en un tablero por etapas: <em>Prospecto, Calificado, Cotizando,\nPropuesta enviada, En emisión, Emitida<\/em>. Arrastra la tarjeta entre etapas; las de cotización\ny emisión se mueven solas cuando avanzas la cotización.<\/p>\n<p>En la pestaña <strong>Seguro<\/strong> de la oportunidad:<\/p>\n<ul>\n<li><strong>Ramo de interés<\/strong> y <strong>prima estimada<\/strong>. Con la prima, el ingreso esperado se calcula con\n  la comisión típica del ramo.<\/li>\n<li><strong>Su póliza actual<\/strong>: con qué aseguradora está y <strong>cuándo vence<\/strong>. Es la mejor fecha para\n  cotizarle; el filtro <em>Su póliza vence en 60 días<\/em> y <em>Pendientes<\/em> del Inicio te las recuerdan.<\/li>\n<\/ul>\n<p>Desde la oportunidad se programan llamadas y reuniones (actividades) y se ven en\n<strong>Ventas → Calendario<\/strong>.<\/p>\n<p><strong>Importar una campaña:<\/strong> en Oportunidades, menú ⚙ → <em>Importar registros<\/em>, con un Excel de\nnombre, empresa, teléfono, correo y RNC. Puedes indicar la campaña para medir de dónde vienen.<\/p>", "subs": []}, {"id": "ventas-cotizaciones", "title": "Cotizaciones", "html": "<p>Botón <strong>Cotizar<\/strong> en la oportunidad (o Ventas → Cotizaciones → Nuevo):<\/p>\n<ol>\n<li><strong>Cliente o prospecto<\/strong>, contacto, <strong>ramo<\/strong> y moneda. Se proponen las coberturas típicas del\n   ramo en <em>Coberturas pedidas<\/em>.<\/li>\n<li><strong>Vigencia<\/strong>: anual (un año desde la fecha efectiva; por defecto, el vencimiento de su póliza\n   actual) o prorrata (eliges la fecha final).<\/li>\n<li><strong>Bienes a asegurar<\/strong>: vehículos (marca, modelo, año, chasis, placa), ubicaciones o personas,\n   con su suma asegurada.<\/li>\n<li><strong>Opciones de aseguradoras<\/strong>, de dos maneras:\n   - <strong>Leídas de los documentos (recomendado)<\/strong>: en la pestaña <strong>Documentos de las aseguradoras<\/strong>\n     arrastre al recuadro las cotizaciones que enviaron (PDF, Excel, Word o foto), o pulse\n     <strong>Seleccionar archivos<\/strong> y elija varias a la vez. La cotización se guarda sola y cada archivo\n     queda en la lista como <em>Por leer<\/em>. También se leen los archivos que se arrastren a los\n     mensajes de la cotización. Cuando estén todos, pulse <strong>Leer cotizaciones<\/strong>.\n     Cada documento llena su opción: aseguradora, prima neta, impuesto, gastos, deducible,\n     observaciones, las <strong>coberturas<\/strong> con sus límites y, si la trae, la <strong>prima por bien<\/strong>\n     (por ejemplo, por vehículo de una flotilla). Si la aseguradora no está registrada, la opción\n     lo dice y hay que elegirla. Para volver a leer un documento, use <strong>Leer<\/strong> en su fila.\n   - <strong>A mano<\/strong>: una línea por aseguradora con la prima neta, gastos, deducible y observaciones.<\/li>\n<\/ol>\n<p>El impuesto sale del ramo (o del documento) y la comisión de la tabla de cada aseguradora.\n   Marque la <strong>recomendada<\/strong>, y como <strong>Póliza actual<\/strong> la que el cliente tiene hoy si quiere\n   compararla.\n5. <strong>Revisar<\/strong>: las opciones leídas quedan <strong>por revisar<\/strong> (en amarillo). Abra cada una con\n   <strong>Revisar<\/strong>, compare primas y coberturas con el documento de la aseguradora, corrija lo\n   necesario y pulse <strong>Revisado<\/strong> (o <strong>Todas revisadas<\/strong> arriba). Mientras haya opciones por\n   revisar, el comparativo no se imprime ni se envía: las aseguradoras a veces se equivocan y este\n   es el punto de control.\n6. <strong>Enviar por correo<\/strong> o <strong>Imprimir comparativo<\/strong>: el PDF (carta horizontal, con el logo y los\n   colores de la corredora en la cabecera de cada página) trae:\n   - <strong>Preparado para<\/strong> (cliente, RNC o cédula, contacto) y <strong>Lo que se asegura<\/strong> (seguro, bienes,\n     valor asegurado, vigencia).\n   - <strong>Una tarjeta por aseguradora<\/strong> con la prima total anual grande, prima neta, impuestos,\n     deducible y observación. Las etiquetas <strong>Recomendada<\/strong> (la que marcó), <strong>Menor prima<\/strong> y\n     <strong>Póliza actual<\/strong> salen solas; la recomendada va destacada.\n   - <strong>Nuestra lectura<\/strong>: la diferencia de prima frente a la más barata y frente a la póliza actual.\n   - <strong>Qué cubre cada una<\/strong>: coberturas lado a lado con su límite; <em>No cubre<\/em> en rojo y — cuando la\n     aseguradora no lo indica.\n   - <strong>Prima por bien<\/strong> (si la cotización la trae), las notas para el cliente, la validez de la\n     oferta y los datos del ejecutivo responsable.<\/p>\n<p>La cotización pasa a <em>Enviada al cliente<\/em>.<\/p>\n<p>La lectura automática necesita la clave del servicio de lectura, que se configura en <strong>Configuración → Ajustes → Cotizaciones<\/strong>; el consumo se cobra a la cuenta dueña de esa clave.<\/p>\n<p>Si no se concreta: <strong>Perdida<\/strong> (anota el motivo) o <strong>Cancelar<\/strong>; ambas se pueden <strong>Reactivar<\/strong>.<\/p><h4 id=\"ventas-cotizaciones--slip-para-pedir-cotizaciones-a-las-aseguradoras\">Slip para pedir cotizaciones a las aseguradoras<\/h4><p>En la cotización, <strong>Slip para aseguradoras<\/strong> descarga un Excel con el formato de la corredora:<\/p>\n<ul>\n<li><strong>Primas<\/strong>: cada bien con su valor asegurado y la columna <em>Prima neta<\/em> para que la aseguradora la\n  complete, con la prima total, el ISC y el total anual ya formulados.<\/li>\n<li><strong>Valores<\/strong>: el desglose de los bienes (marca, modelo, placa, chasis, ubicación, renglón).<\/li>\n<li><strong>Coberturas<\/strong>: las coberturas pedidas con su límite y la columna <em>Propuesta de la aseguradora<\/em>;\n  debajo, los deducibles pedidos.<\/li>\n<li><strong>Notas<\/strong>: las del ramo (<em>Configuración → Ramos<\/em>, pestaña <em>Slip de cotización<\/em>, una por línea:\n  validez de la oferta, inspección, cláusulas) más las de la cotización (pestaña <em>Notas<\/em>).<\/li>\n<\/ul>\n<p>Cuando la aseguradora lo devuelve completado, se sube en <em>Documentos de las aseguradoras<\/em> y se lee\ncomo cualquier cotización.<\/p>", "subs": [{"id": "ventas-cotizaciones--slip-para-pedir-cotizaciones-a-las-aseguradoras", "title": "Slip para pedir cotizaciones a las aseguradoras"}]}, {"id": "ventas-emision-o-nombramiento", "title": "Emisión o nombramiento", "html": "<p>Cuando el cliente decide, pulsa <strong>Elegir<\/strong> en la opción que aceptó. Hay dos caminos:<\/p>\n<p><strong>Nombramiento<\/strong> (el cliente ya tiene la póliza con la aseguradora y nombra a la corredora):\npulsa <strong>Nombramiento<\/strong>, escribe el número de la póliza, revisa vigencia y prima y, si la tienes,\nadjunta la póliza en PDF. La póliza queda <strong>vigente<\/strong> de una vez con lo negociado y la\noportunidad, <strong>ganada<\/strong>.<\/p>\n<p><strong>Emisión nueva<\/strong> (la aseguradora tiene que emitirla):<\/p>\n<ol>\n<li><strong>Solicitar emisión<\/strong> crea la póliza en <strong>borrador<\/strong> (<em>Solicitada a la aseguradora<\/em>) con esa\n   aseguradora, prima, comisión, vigencia, bienes y los ejecutivos del cliente. Si el prospecto\n   no era cliente, pasa a serlo.<\/li>\n<li>Cuando la aseguradora confirma la cobertura, en la póliza pulsa <strong>Riesgo aceptado<\/strong>.<\/li>\n<li>Cuando llegan la póliza y la factura, pulsa <strong>Recibir emisión<\/strong>: número de póliza real,\n   número de factura y NCF, gastos administrativos, la vigencia o la prima si cambiaron, y\n   adjunta <strong>la póliza y la factura en PDF<\/strong>. <strong>Confirmar emisión<\/strong> deja la póliza <strong>vigente<\/strong>\n   con su PDF, crea su <strong>factura de prima<\/strong> con la factura adjunta y marca la oportunidad como\n   <strong>ganada<\/strong>.<\/li>\n<\/ol>\n<p>(En la ventana, el primer campo es <strong>Póliza<\/strong>: la solicitud que se está recibiendo.)<\/p>\n<p><strong>Leer documentos<\/strong>: con la póliza y/o la factura adjuntas, el botón llena solo el número de\n   póliza, la factura, el NCF, la fecha, la vigencia, la prima neta y los gastos, y <strong>compara la\n   póliza emitida con la cotización que aceptó el cliente<\/strong>: aseguradora, asegurado, prima neta y\n   total, gastos, vigencia, suma asegurada, deducible y cada cobertura cotizada (si falta, si la\n   excluye o si el límite cambió). Las diferencias salen en un aviso amarillo antes de confirmar y\n   quedan en el historial de la póliza al confirmar; si coincide, sale en verde.<\/p>\n<p><strong>Operación → Emisiones pendientes<\/strong> muestra todas las solicitudes que esperan a la aseguradora,\nagrupadas por responsable, con su etapa (<em>Solicitada<\/em> o <em>Riesgo aceptado<\/em>) y los días que llevan\nesperando.<\/p>\n<p>Las solicitudes sin recibir aparecen en <em>Pendientes<\/em> del Inicio (<em>Emisiones por recibir<\/em>), igual\nque las cotizaciones enviadas sin respuesta hace más de 7 días.<\/p>", "subs": []}, {"id": "ventas-ventas-cruzadas", "title": "Ventas cruzadas", "html": "<p>Ventas → <strong>Ventas cruzadas<\/strong>: elige los ramos que el cliente <strong>tiene<\/strong> (vacío = cualquiera) y el\nque <strong>no tiene<\/strong> (por ejemplo, tienen vehículo y no tienen salud), y si quieres una aseguradora.\n<strong>Buscar<\/strong> lista los clientes; desmarca los que no quieras y <strong>Crear oportunidades<\/strong> las genera\nen lote, asignadas a quien elijas y con la etiqueta <em>Venta cruzada<\/em>. Los clientes que ya tienen\nuna oportunidad abierta de ese ramo no se repiten.<\/p>", "subs": []}, {"id": "ventas-reportes", "title": "Reportes", "html": "<ul>\n<li><strong>Seguimiento a cotizaciones<\/strong>: Ventas → Cotizaciones, vista de pivote por responsable y estado.<\/li>\n<li><strong>Riesgo aceptado / emisiones<\/strong>: filtro <em>Emitidas<\/em> o los estados <em>Aceptada<\/em> y <em>En emisión<\/em>.<\/li>\n<li><strong>Oportunidades<\/strong>: las vistas de lista, pivote y gráfico del CRM (por etapa, responsable,\n  ramo o campaña).<\/li>\n<\/ul>", "subs": []}]}, {"id": "cobros", "title": "Cobros y comisiones", "summary": "Documentos de prima, recibos, remesas, acuerdos de pago, comisiones y carta de despacho.", "intro": "<p>Este módulo se instala sobre <strong>Corredora de Seguros<\/strong> y agrega todo lo que tiene que ver con\ndinero: lo que el cliente le debe a la aseguradora, lo que la corredora cobra y remesa, y lo\nque la aseguradora le paga a la corredora como comisión.<\/p>", "sections": [{"id": "cobros-la-idea-clave-dinero-de-terceros-vs-ingreso-de-la-corredora", "title": "La idea clave: dinero de terceros vs. ingreso de la corredora", "html": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Qué<\/th>\n<th>Dónde vive<\/th>\n<th>¿Toca la contabilidad de la corredora?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Factura, débito o crédito de prima de la aseguradora al cliente<\/td>\n<td>Seguros → Cobros → Documentos de prima<\/td>\n<td><strong>No.<\/strong> Es una deuda del cliente con la aseguradora.<\/td>\n<\/tr>\n<tr>\n<td>Cobro de prima por la corredora (recibo interno)<\/td>\n<td>Recibos de cobro<\/td>\n<td><strong>Sí<\/strong>: entra al banco contra el pasivo <em>Primas por remesar<\/em>.<\/td>\n<\/tr>\n<tr>\n<td>Cobro directo en la aseguradora<\/td>\n<td>Recibos de cobro (pago directo)<\/td>\n<td>No; solo baja el balance y genera la comisión esperada.<\/td>\n<\/tr>\n<tr>\n<td>Envío del dinero a la aseguradora<\/td>\n<td>Remesas<\/td>\n<td><strong>Sí<\/strong>: sale del banco y salda <em>Primas por remesar<\/em>.<\/td>\n<\/tr>\n<tr>\n<td>Comisión que paga la aseguradora<\/td>\n<td>Recibos de ingreso de comisiones<\/td>\n<td><strong>Sí<\/strong>: factura de la corredora a la aseguradora (su ingreso).<\/td>\n<\/tr>\n<tr>\n<td>Comisión de ejecutivos<\/td>\n<td>Liquidaciones<\/td>\n<td><strong>Sí<\/strong>: factura de proveedor (gasto).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "subs": []}, {"id": "cobros-configuracion-inicial-administrador", "title": "Configuración inicial (administrador)", "html": "<p>En <strong>Seguros → Configuración → Ajustes<\/strong>:<\/p>\n<ul>\n<li><strong>Los clientes pagan siempre a la aseguradora<\/strong>: actívalo si la corredora nunca recibe el\n  dinero de la prima. Desaparecen los recibos internos, el menú <strong>Remesas<\/strong>, el atajo de remesa\n  y la línea <em>Cobrado por remesar<\/em> del Inicio; todo recibo queda como <strong>pago directo<\/strong> (sin\n  asiento) y no se crea la cuenta <em>Primas por remesar<\/em>. En contabilidad solo quedan la factura\n  de comisión a la aseguradora, su cobro y lo de los ejecutivos. Las dos opciones siguientes\n  se ocultan porque no aplican.<\/li>\n<li><strong>Primas por remesar<\/strong>: cuenta de pasivo. Si queda vacía, se crea sola la primera vez que se\n  registra un recibo interno.<\/li>\n<li><strong>Modo de remesa<\/strong>:<\/li>\n<li><em>Bruta<\/em>: se envía la prima completa y la aseguradora paga la comisión aparte.<\/li>\n<li><em>Neta<\/em>: la corredora descuenta su comisión al remesar.<\/li>\n<li><strong>Comisión de corretaje<\/strong>: producto de la factura a la aseguradora. Viene <strong>sin ITBIS<\/strong>: la\n  comisión es ingreso bruto y se declara en el impuesto sobre la renta. Pon ahí la cuenta de\n  ingreso y, solo si el contador lo indica, algún impuesto.<\/li>\n<li><strong>Comisión de ejecutivos<\/strong>: producto de la factura de proveedor. Pon ahí las\n  <strong>retenciones<\/strong> que apliquen y la cuenta de gasto.<\/li>\n<li><strong>Anticipos a ejecutivos<\/strong>: cuenta de activo para los adelantos (también se crea sola).<\/li>\n<\/ul>\n<p>En <strong>Configuración → Comisiones<\/strong>:<\/p>\n<ul>\n<li><strong>Conceptos de facturación<\/strong>: Emisión, Renovación, Inclusión, Cancelación… Cada uno dice si es\n  factura, nota de débito o nota de crédito, y si genera comisión.<\/li>\n<li><strong>Montos adicionales<\/strong>: bonos, premios y descuentos que la aseguradora agrega en sus pagos.<\/li>\n<\/ul>", "subs": []}, {"id": "cobros-documentos-de-prima", "title": "Documentos de prima", "html": "<ol>\n<li>Desde la póliza, botón <strong>Registrar factura de prima<\/strong>. Se abre con la prima, el impuesto y\n   la vigencia de la póliza. Pon el número y el NCF de la aseguradora y la fecha de\n   vencimiento.<\/li>\n<li><strong>Confirmar<\/strong>: el documento queda <em>Pendiente<\/em> con su balance.<\/li>\n<li><strong>Notas de crédito<\/strong> de la aseguradora (cancelación, exclusión, descuento):<\/li>\n<li>Créala con un concepto de tipo crédito y confírmala.<\/li>\n<li><strong>Distribuir crédito<\/strong> la reparte entre las facturas pendientes del cliente, de la más\n      antigua a la más reciente.<\/li>\n<li><strong>Aplicar crédito<\/strong> baja el balance de esas facturas.<\/li>\n<li><strong>Enviar recordatorio<\/strong> manda un correo al cliente con el balance pendiente.<\/li>\n<\/ol><h4 id=\"cobros-documentos-de-prima--cuotas-de-prima\">Cuotas de prima<\/h4><p>Si la póliza se paga <strong>semestral, trimestral o mensual<\/strong>, al confirmar el documento se generan\nsus cuotas: 2, 4 o 12, a partir del vencimiento del documento o, si no lo tiene, del inicio de\nvigencia.<\/p>\n<ul>\n<li>Lo cobrado cubre las cuotas en orden. Cada cuota muestra lo cubierto, lo pendiente y su\n  estado.<\/li>\n<li>El atraso del documento se mide contra la <strong>cuota más vieja sin cubrir<\/strong>, y se ve el monto\n  vencido.<\/li>\n<li>Mientras el documento no tenga cobros, <strong>Recalcular cuotas<\/strong> las rehace. También se pueden\n  editar a mano.<\/li>\n<li><strong>Cobros → Cuotas pendientes<\/strong> lista todas las cuotas por cubrir, con filtros de vencidas y\n  de las que vencen este mes.<\/li>\n<\/ul><h4 id=\"cobros-documentos-de-prima--documentos-que-vienen-de-un-movimiento\">Documentos que vienen de un movimiento<\/h4><p>Al aplicar un movimiento de póliza se crea su documento en <strong>borrador<\/strong>, con la prima y el\nimpuesto calculados. Cuando llegue el endoso de la aseguradora, ponle su número y su NCF y\n<strong>Confirmar<\/strong>.<\/p>\n<p><strong>Seguimiento a cobros<\/strong> muestra los documentos con balance, agrupados por cliente. Los filtros\nseparan las facturas vencidas y las que están en acuerdo de pago.<\/p><h4 id=\"cobros-documentos-de-prima--facturacion-periodica-vida-y-salud\">Facturación periódica (vida y salud)<\/h4><p>Las aseguradoras facturan cada mes (o trimestre) las pólizas de salud y vida.\n<strong>Cobros → Facturación periódica<\/strong>:<\/p>\n<ol>\n<li>Elige el <strong>mes<\/strong> y, si quieres, la aseguradora. Por defecto se buscan las pólizas de\n   personas; cambia a <em>Todas las pólizas de pago fraccionado<\/em> para incluir otras.<\/li>\n<li><strong>Buscar<\/strong> lista las pólizas vigentes con un período que empieza ese mes y que aún no\n   tienen factura de ese período. El monto propuesto es el de la última factura de la póliza\n   (o la parte proporcional de la prima si nunca se ha facturado); puedes cambiarlo.<\/li>\n<li>Escribe el <strong>número de factura de la aseguradora<\/strong> (y el NCF) en las que vas a facturar.<\/li>\n<li><strong>Generar facturas<\/strong> crea y confirma las facturas con número; las que dejaste sin número\n   siguen pendientes para otra vez.<\/li>\n<\/ol><h4 id=\"cobros-documentos-de-prima--polizas-declarativas\">Pólizas declarativas<\/h4><p>Para pólizas cuya prima depende de lo que el cliente declara cada período (inventario, ventas,\ncarga). En la póliza, pestaña <strong>Declaraciones<\/strong>: marca <em>Póliza declarativa<\/em>, la <strong>tasa<\/strong> (%) y\nsi se declara mensual o trimestral.<\/p>\n<p>Cada período agrega una línea con las fechas y el <strong>valor declarado<\/strong>; la prima neta sale de\nvalor × tasa y el impuesto del ramo (puedes ajustarlos). Escribe el número de factura de la\naseguradora y pulsa <strong>Facturar<\/strong>. Las pólizas sin declaración del último período cerrado\naparecen en <em>Pendientes<\/em> del Inicio y en <strong>Cobros → Declaraciones<\/strong>.<\/p><h4 id=\"cobros-documentos-de-prima--tarjeta-domiciliada\">Tarjeta domiciliada<\/h4><p>En la póliza, pestaña <strong>Cobro con tarjeta<\/strong>: marca <em>Tarjeta domiciliada<\/em> y anota la marca, los\n<strong>últimos 4 dígitos<\/strong>, el vencimiento (MM/AA), el banco y el día de cargo. Por seguridad el número\ncompleto nunca se guarda en Odoo: queda en la autorización firmada por el cliente.<\/p>\n<p><strong>Reportes → Tarjetas domiciliadas<\/strong> lista las pólizas vigentes que se cobran así (en rojo las\ntarjetas vencidas) y <em>Pendientes<\/em> del Inicio avisa las que vencen en 30 días.<\/p>", "subs": [{"id": "cobros-documentos-de-prima--cuotas-de-prima", "title": "Cuotas de prima"}, {"id": "cobros-documentos-de-prima--documentos-que-vienen-de-un-movimiento", "title": "Documentos que vienen de un movimiento"}, {"id": "cobros-documentos-de-prima--facturacion-periodica-vida-y-salud", "title": "Facturación periódica (vida y salud)"}, {"id": "cobros-documentos-de-prima--polizas-declarativas", "title": "Pólizas declarativas"}, {"id": "cobros-documentos-de-prima--tarjeta-domiciliada", "title": "Tarjeta domiciliada"}]}, {"id": "cobros-recibos-de-cobro", "title": "Recibos de cobro", "html": "<ol>\n<li><strong>Nuevo<\/strong>. Elige el tipo (si los clientes pagan siempre a la aseguradora no se pregunta:\n   es pago directo):\n   - <strong>Recibo interno<\/strong>: el cliente le pagó a la corredora. Indica la caja o el banco.\n   - <strong>Pago directo<\/strong>: el cliente pagó en la aseguradora. Es obligatorio el número de recibo de\n     la aseguradora.<\/li>\n<li>Cliente, aseguradora y monto. Arriba se ve el balance que el cliente tiene con esa\n   aseguradora, y la pestaña <strong>Pendientes del cliente<\/strong> muestra todo lo que debe con todas las\n   aseguradoras, para saber a qué corresponde el pago.\n   - <strong>Fecha del pago<\/strong>: cuándo pagó el cliente según el recibo de la aseguradora. La <em>fecha de\n     registro<\/em> es cuando se anota en el sistema; pueden ser distintas.\n   - <strong>Tipo de pago<\/strong>: <em>Abono<\/em> o <em>Saldo total<\/em>. Se propone solo comparando el monto con el\n     balance; se puede cambiar.\n   - <strong>Comprobante<\/strong>: adjunta el recibo que envió la aseguradora.\n   - El pago se reparte solo entre las facturas, de la más vieja a la más nueva; en la pestaña\n     de aplicación se corrige a mano cuánto va a cada una. Si el cliente es un <strong>grupo deudor<\/strong>, el recibo cubre los documentos de todos\n   los clientes del grupo.<\/li>\n<li><strong>Distribuir<\/strong> aplica el monto a los documentos pendientes, del más antiguo al más reciente.\n   Puedes cambiar a mano cuánto va a cada uno.<\/li>\n<li>Mientras no se registra, es un <strong>recibo provisional<\/strong> y ya se puede imprimir.<\/li>\n<li><strong>Registrar<\/strong>:\n   - baja el balance de los documentos;\n   - en un recibo interno, genera el asiento contra <em>Primas por remesar<\/em>;\n   - crea la <strong>comisión esperada<\/strong>: la parte de prima neta cobrada × la tasa de la póliza ×\n     la participación de la corredora si hay coaseguro.<\/li>\n<li><strong>Anular<\/strong>: solo si el recibo no está en una remesa ni en una conciliación procesada. Revierte\n   el asiento y devuelve el balance. Es irreversible.<\/li>\n<\/ol><h4 id=\"cobros-recibos-de-cobro--saldo-a-favor-creditos-por-aplicar\">Saldo a favor (créditos por aplicar)<\/h4><p>Un recibo no tiene que aplicarse completo:<\/p>\n<ul>\n<li><strong>Pago de más o anticipo<\/strong>: si el cliente paga más que lo pendiente, o paga antes de que exista\n  la factura, registra el recibo igual. Lo que no se aplica queda como <strong>saldo a favor<\/strong>.<\/li>\n<li><strong>Cobros → Créditos por aplicar<\/strong> lista los recibos con saldo. Para usarlo: abre el recibo →\n  agrega el documento o pulsa <strong>Distribuir<\/strong> → <strong>Aplicar saldo<\/strong>. Genera su comisión esperada\n  como cualquier cobro.<\/li>\n<li><strong>Desaplicar<\/strong> (botón en la línea de aplicación): quita un cobro de un documento y lo devuelve\n  al saldo a favor. Sirve para <strong>reclasificar<\/strong> un pago que se aplicó a la factura equivocada.\n  No se puede si ese cobro ya se remesó o si su comisión ya se concilió.<\/li>\n<li>En contabilidad, el saldo a favor sigue en <em>Primas por remesar<\/em> a nombre del cliente: no se\n  remesa hasta que se aplique.<\/li>\n<li>El saldo a favor aparece en el contacto (botón <em>Balance de primas<\/em>) y en el estado de cuenta.<\/li>\n<\/ul>", "subs": [{"id": "cobros-recibos-de-cobro--saldo-a-favor-creditos-por-aplicar", "title": "Saldo a favor (créditos por aplicar)"}]}, {"id": "cobros-remesas", "title": "Remesas", "html": "<ol>\n<li><strong>Nuevo<\/strong> → aseguradora, banco de salida y fecha tope → <strong>Buscar cobros<\/strong>. Trae lo cobrado\n   por la corredora y <strong>aplicado<\/strong> a documentos de esa aseguradora que aún no se ha remesado. El\n   saldo a favor no se remesa.<\/li>\n<li><strong>Generar remesa<\/strong> crea el asiento:\n   - débito a <em>Primas por remesar<\/em> por cliente;\n   - crédito al banco por lo que sale;\n   - en modo neto, crédito a la cuenta por cobrar de la aseguradora por la comisión retenida.<\/li>\n<li>Cuando la aseguradora devuelva sus recibos, anota en cada línea el <strong>número y la fecha\n   definitivos<\/strong>, y pulsa <strong>Confirmar recepción<\/strong>.<\/li>\n<\/ol>", "subs": []}, {"id": "cobros-acuerdos-de-pago", "title": "Acuerdos de pago", "html": "<ol>\n<li><strong>Nuevo<\/strong> → cliente, aseguradora, moneda → <strong>Cargar pendientes<\/strong> (puedes quitar documentos).<\/li>\n<li>Tipo:\n   - <strong>Convenio de ley (120 días)<\/strong>: inicial del 25 % + 3 cuotas mensuales;\n   - <strong>Convenio especial<\/strong>: tú defines inicial, cantidad de cuotas y frecuencia;\n   - <strong>Pago total<\/strong>: una sola cuota.<\/li>\n<li><strong>Calcular cuotas<\/strong> → revisa fechas y montos → <strong>Grabar acuerdo<\/strong>.<\/li>\n<li>Los cobros que entren a esos documentos van cubriendo las cuotas en orden. Si se pasa la\n   fecha de una cuota sin cubrirse, el acuerdo sale como <strong>Atrasado<\/strong>.<\/li>\n<\/ol>", "subs": []}, {"id": "cobros-comisiones-de-la-corredora", "title": "Comisiones de la corredora", "html": "<p><strong>Comisiones esperadas<\/strong> lista lo que la aseguradora debería pagar. Mientras no estén\nconciliadas, puedes corregir sus tasas: selecciona varias filas y cambia el porcentaje de una\nvez.<\/p><h4 id=\"cobros-comisiones-de-la-corredora--recibo-de-ingreso-y-conciliacion\">Recibo de ingreso y conciliación<\/h4><ol>\n<li><strong>Comisiones → Recibos de ingreso → Nuevo<\/strong>.<\/li>\n<li>Datos:\n   - aseguradora;\n   - <strong>monto del estado de cuenta<\/strong> (lo que la aseguradora reconoce, incluida la comisión ya\n     retenida si remesas neto);\n   - banco donde llegó el dinero;\n   - rango de fechas de los cobros.<\/li>\n<\/ol>\n<p>Puedes adjuntar el estado de cuenta.\n3. <strong>Conciliar comisiones<\/strong> trae las esperadas del período, con <em>Recibido = Esperado<\/em>.\n4. Revisa línea por línea:\n   - <strong>N/A<\/strong>: no corresponde a este pago; queda libre para otra conciliación.\n   - <strong>Aceptada<\/strong>: recibiste menos de lo esperado y la diferencia queda <strong>a reclamar<\/strong>.\n   - <strong>Aceptada con diferencia<\/strong>: aceptas lo pagado y la diferencia se da por perdida.<\/p>\n<p>Corrige el <strong>Recibido<\/strong> cuando la aseguradora pagó otro monto.\n5. <strong>Montos adicionales<\/strong>: bonos y premios en positivo, descuentos en negativo.\n6. El botón <strong>Procesar<\/strong> aparece solo cuando <em>Por cuadrar<\/em> es cero. Al procesar:\n   - se crea y publica la <strong>factura de comisión<\/strong> a la aseguradora, con una línea por ramo y\n     una por cada monto adicional
